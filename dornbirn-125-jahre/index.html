e/Wisconsin und benannte seinen Sohn nach dem englischen Sozialphilosophen Herbert Spencer. Als Leiter des Rockefeller Institute for Medical Research wurde Gasser zum berühmtesten Spross der Dornbirner Auswanderer."}],"id":"E070"},{"year":1945,"year_end":null,"date_precision":"year","title":"Befreiung durch franzoesische Truppen und Kriegsende","summary":"Am 29. April 1945 ueberquerten franzoesische Truppen die Vorarlberger Grenze. Am 2. Mai erreichten sie Dornbirn, die Haeuser waren mit weissen Leintuechern beflaggt. Beim Stigelbach und im Wallenmahd kam es zu Kaempfen, in der Naehe der Fabrik J.M. Fussenegger starben fuenf franzoesische Soldaten und der Zivilist Otto G. Eine Widerstandsgruppe verhinderte unnoetiges Blutvergiessen. Eduard Ulmer und Johann Martin Luger uebergaben die Stadt an General de Lattre de Tassigny. NS-Buergermeister Josef Dreher floh auf die Alpe Spaetenbach. Am Abend des 2. Mai meldete sich der Sender Vorarlberg in Dornbirn als erste oesterreichische Sendestation. Am 8. Mai erklaerte die Staatsregierung die NSDAP fuer aufgeloest. Am 9. Oktober wurden OuVP, SPOuml; und KPOuml; zugelassen.","people":["Josef Dreher","Eduard Ulmer","Johann Martin Luger","Otto Schubert","Ulrich Ilg"],"places":["Dornbirn","Wallenmahd","Marktplatz"],"category":"Krieg","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 78-80"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Befreiung durch franzoesische Truppen und Kriegsende","summary":"Am 29. April 1945 ueberquerten franzoesische Truppen die Vorarlberger Grenze. Am 2. Mai erreichten sie Dornbirn, die Haeuser waren mit weissen Leintuechern beflaggt. Beim Stigelbach und im Wallenmahd kam es zu Kaempfen, in der Naehe der Fabrik J.M. Fussenegger starben fuenf franzoesische Soldaten und der Zivilist Otto G. Eine Widerstandsgruppe verhinderte unnoetiges Blutvergiessen. Eduard Ulmer und Johann Martin Luger uebergaben die Stadt an General de Lattre de Tassigny. NS-Buergermeister Josef Dreher floh auf die Alpe Spaetenbach. Am Abend des 2. Mai meldete sich der Sender Vorarlberg in Dornbirn als erste oesterreichische Sendestation. Am 8. Mai erklaerte die Staatsregierung die NSDAP fuer aufgeloest. Am 9. Oktober wurden OuVP, SPOuml; und KPOuml; zugelassen."}],"id":"E071"},{"year":1945,"year_end":null,"date_precision":"year","title":"Erste freie Wahlen und Buergermeister Moosbrugger","summary":"Die ersten freien Nationalrats- und Landtagswahlen fanden am 25. November 1945 statt. In Dornbirn erzielte die OuVP rund 62 Prozent, die SPOu 34 Prozent, die KPOu 3,5 Prozent. Der Dornbirner Ulrich Ilg wurde der erste Landeshauptmann nach dem Zweiten Weltkrieg. In Dornbirn wurde Dr. Guenter Anton Moosbrugger (OuVP) zum Buergermeister bestellt, Franz Katzengruber (SPOu) zum Vizebuergermeister. Die Sendeanlagen von Radio Vorarlberg konnten vor der Zerstoerung bewahrt werden. Im November uebernahm Hans Moltkau aus Magdeburg das neue Vorarlberger Rundfunkorchester.","people":["Guenter Anton Moosbrugger","Franz Katzengruber","Ulrich Ilg","Hans Moltkau"],"places":["Dornbirn"],"category":"Politik","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 89, 98"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Erste freie Wahlen und Buergermeister Moosbrugger","summary":"Die ersten freien Nationalrats- und Landtagswahlen fanden am 25. November 1945 statt. In Dornbirn erzielte die OuVP rund 62 Prozent, die SPOu 34 Prozent, die KPOu 3,5 Prozent. Der Dornbirner Ulrich Ilg wurde der erste Landeshauptmann nach dem Zweiten Weltkrieg. In Dornbirn wurde Dr. Guenter Anton Moosbrugger (OuVP) zum Buergermeister bestellt, Franz Katzengruber (SPOu) zum Vizebuergermeister. Die Sendeanlagen von Radio Vorarlberg konnten vor der Zerstoerung bewahrt werden. Im November uebernahm Hans Moltkau aus Magdeburg das neue Vorarlberger Rundfunkorchester."}],"id":"E072"},{"year":1945,"year_end":null,"date_precision":"year","title":"Erweiterung Herrburger & Rhomberg Juchen mit Shedbau","summary":"Nach 1945 erfuhr das Fabriksensemble Juchen der Firma Herrburger & Rhomberg eine groessere Erweiterung. An den westlichen Teil wurde ein Shedbau angefuegt, in dem vor allem Bettwaesche hergestellt wurde. Die Firma Juchen war als aelteste Textilfirma Vorarlbergs und Tirols 1795 gegruendet worden.","people":["Herrburger","Rhomberg"],"places":["Dornbirn","Juchen"],"category":"Industrie","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 48"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Erweiterung Herrburger & Rhomberg Juchen mit Shedbau","summary":"Nach 1945 erfuhr das Fabriksensemble Juchen der Firma Herrburger & Rhomberg eine groessere Erweiterung. An den westlichen Teil wurde ein Shedbau angefuegt, in dem vor allem Bettwaesche hergestellt wurde. Die Firma Juchen war als aelteste Textilfirma Vorarlbergs und Tirols 1795 gegruendet worden."}],"id":"E073"},{"year":1945,"year_end":null,"date_precision":"year","title":"Ruesch-Werke beginnen Guellepumpen-Produktion","summary":"Da man beim Turbinenbau den technologischen Anschluss verloren hatte, begann die Maschinenfabrik Ruesch 1945 nach Kriegsende mit der Produktion von Guellepumpen fuer die Landwirtschaft. Damit suchte das Unternehmen nach dem Zusammenbruch der Ruestungsproduktion ein neues Standbein.","people":[],"places":["Dornbirn"],"category":"Industrie","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 61"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Ruesch-Werke beginnen Guellepumpen-Produktion","summary":"Da man beim Turbinenbau den technologischen Anschluss verloren hatte, begann die Maschinenfabrik Ruesch 1945 nach Kriegsende mit der Produktion von Guellepumpen fuer die Landwirtschaft. Damit suchte das Unternehmen nach dem Zusammenbruch der Ruestungsproduktion ein neues Standbein."}],"id":"E074"},{"year":1947,"year_end":null,"date_precision":"year","title":"Reorganisation J.M. Fussenegger mit neuer Bleicherei","summary":"Nach den Konjunkturschwankungen der Zwischenkriegszeit und des Zweiten Weltkriegs gelang es 1947 den Gesellschaftern DDr. Ginzel, dem Schwiegersohn von Julius Fussenegger, seinem Neffen Dr. Arnold Rhomberg und Dr. Kurt Fussenegger, das Unternehmen J.M. Fussenegger mit einer neuen Bleicherei und Ausruesterei zu reorganisieren. Durch Forschung und moderne Technik wuchs der Betrieb zum fuehrenden Veredler von Stickereiwaren mit 650 Beschaeftigten.","people":["Ginzel","Arnold Rhomberg","Kurt Fussenegger"],"places":["Dornbirn","Wallenmahd"],"category":"Industrie","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 15"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Reorganisation J.M. Fussenegger mit neuer Bleicherei","summary":"Nach den Konjunkturschwankungen der Zwischenkriegszeit und des Zweiten Weltkriegs gelang es 1947 den Gesellschaftern DDr. Ginzel, dem Schwiegersohn von Julius Fussenegger, seinem Neffen Dr. Arnold Rhomberg und Dr. Kurt Fussenegger, das Unternehmen J.M. Fussenegger mit einer neuen Bleicherei und Ausruesterei zu reorganisieren. Durch Forschung und moderne Technik wuchs der Betrieb zum fuehrenden Veredler von Stickereiwaren mit 650 Beschaeftigten."}],"id":"E075"},{"year":1949,"year_end":null,"date_precision":"year","title":"Erste Export- und Musterschau Dornbirn","summary":"Vom 26. Juli bis 6. August 1949 fand die 1. Export- und Musterschau Dornbirn statt, die spaeter zur weltbekannten Dornbirner Messe wurde. Die Initiative ging vom Verkehrsverein Dornbirn unter der Leitung von Sparkassendirektor Dr. Eugen Lecher aus, als Ausstellungsleiter wurde Dkfm. Hermann Rhomberg bestellt. 541 Firmen, davon 509 aus Oesterreich, beteiligten sich, 150.000 Besucher aus dem In- und Ausland wurden gezaehlt. Im selben Jahr beschaeftigte die Dornbirner Industrie 4.282 Arbeitnehmer. Armin Diem veroeffentlichte seinen historischen Roman Koenig, Papst und Herzog.","people":["Eugen Lecher","Hermann Rhomberg","Armin Diem"],"places":["Dornbirn","Marktplatz"],"category":"Wirtschaft","sources":["Matt: Geschichte Dornbirns","Fessler: Wirtschaften"],"page_hints":["Matt: Geschichte Dornbirns S. 88-89","Fessler: Wirtschaften S. 9"],"alt_titles":["Gruendung der Dornbirner Export- und Musterschau"],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Erste Export- und Musterschau Dornbirn","summary":"Vom 26. Juli bis 6. August 1949 fand die 1. Export- und Musterschau Dornbirn statt, die spaeter zur weltbekannten Dornbirner Messe wurde. Die Initiative ging vom Verkehrsverein Dornbirn unter der Leitung von Sparkassendirektor Dr. Eugen Lecher aus, als Ausstellungsleiter wurde Dkfm. Hermann Rhomberg bestellt. 541 Firmen, davon 509 aus Oesterreich, beteiligten sich, 150.000 Besucher aus dem In- und Ausland wurden gezaehlt. Im selben Jahr beschaeftigte die Dornbirner Industrie 4.282 Arbeitnehmer. Armin Diem veroeffentlichte seinen historischen Roman Koenig, Papst und Herzog."},{"book":"Fessler: Wirtschaften","title":"Gruendung der Dornbirner Export- und Musterschau","summary":"1949 wurde die Dornbirner Textil- und Musterschau gegruendet als Aushaengeschild der nach dem Krieg rasch wiedererstarkten Textilindustrie. Sie nannte sich spaeter Export- und Mustermesse und an ihr beteiligten sich ueber 500 Firmen. Die Flaggen zahlreicher Laender dominierten in den 50er und 60er Jahren das Stadtbild und den Marktplatz und verliehen Dornbirn ein internationales Flair."}],"id":"E076"},{"year":1950,"year_end":null,"date_precision":"year","title":"Gruendung der Firma Zumtobel durch Dr. Walter Zumtobel","summary":"1950 wurde die Firma Zumtobel als Elektrogeraete und Kunstharzpresswerk Zumtobel KG von Dr. Walter Zumtobel mit sechs Mitarbeitern gegruendet. Produziert wurden anfangs elektromagnetische Vorschaltgeraete fuer die damals noch neuartigen Leuchtstoffroehren. Zwei Jahre nach Beginn entwickelte man bereits komplette Leuchten. Heute zaehlt die Zumtobel AG zu den groessten Anbietern der internationalen Beleuchtungsindustrie.","people":["Walter Zumtobel"],"places":["Dornbirn"],"category":"Industrie","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 69"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Gruendung der Firma Zumtobel durch Dr. Walter Zumtobel","summary":"1950 wurde die Firma Zumtobel als Elektrogeraete und Kunstharzpresswerk Zumtobel KG von Dr. Walter Zumtobel mit sechs Mitarbeitern gegruendet. Produziert wurden anfangs elektromagnetische Vorschaltgeraete fuer die damals noch neuartigen Leuchtstoffroehren. Zwei Jahre nach Beginn entwickelte man bereits komplette Leuchten. Heute zaehlt die Zumtobel AG zu den groessten Anbietern der internationalen Beleuchtungsindustrie."}],"id":"E077"},{"year":1950,"year_end":null,"date_precision":"year","title":"Gruendung der Walter Zumtobel KG und erste Nachkriegswahlen","summary":"Am 1. Jaenner 1950 gruendete Dr. Walter Zumtobel (geboren 1907) eine Kommanditgesellschaft und begann mit sechs Beschaeftigten Vorschaltgeraete, Thermostarter, Fassungen und Kunststoffteile zu produzieren - der Anfang des spaeteren Weltkonzerns Zumtobel. Im selben Jahr 1950 erfolgten die ersten freien Gemeinderatswahlen nach 20 Jahren: Die OuVP verlor die absolute Mehrheit (46 Prozent), die WdU (Sammelbecken ehemaliger Nationalsozialisten) erreichte 23 Prozent. Bei der Textilveredelung wurde die erste Sanforisiermaschine Oesterreichs aufgestellt.","people":["Walter Zumtobel","Guenter Anton Moosbrugger"],"places":["Dornbirn","Hoechsterstrasse"],"category":"Wirtschaft","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 95-96, 102-103"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Gruendung der Walter Zumtobel KG und erste Nachkriegswahlen","summary":"Am 1. Jaenner 1950 gruendete Dr. Walter Zumtobel (geboren 1907) eine Kommanditgesellschaft und begann mit sechs Beschaeftigten Vorschaltgeraete, Thermostarter, Fassungen und Kunststoffteile zu produzieren - der Anfang des spaeteren Weltkonzerns Zumtobel. Im selben Jahr 1950 erfolgten die ersten freien Gemeinderatswahlen nach 20 Jahren: Die OuVP verlor die absolute Mehrheit (46 Prozent), die WdU (Sammelbecken ehemaliger Nationalsozialisten) erreichte 23 Prozent. Bei der Textilveredelung wurde die erste Sanforisiermaschine Oesterreichs aufgestellt."}],"id":"E078"},{"year":1950,"year_end":1959,"date_precision":"decade","title":"Möbelfabrik Luger in St. Paul wird eingestellt","summary":"In den 1950er Jahren wird die Produktion der 'Luger Furniture Company' im North St. Paul/Minnesota eingestellt. Die Schreinerfamilie Luger aus Dornbirn-Schwefel – begründet 1862 durch die Brüder Ferdinand und Johann Nepomuk Luger in Wabasha – hat durch hundert Jahre und vier Generationen das Wirtschaftsleben Minnesotas und den Möbelgeschmack einer Epoche geprägt. Eine der wichtigsten Dornbirner Wirtschaftsspuren in den USA endet.","people":["Ferdinand Luger","Johann Nepomuk Luger"],"places":["North St. Paul","Wabasha","Dornbirn"],"category":"Industrie","sources":["Pichler: Auswanderer"],"page_hints":["Pichler: Auswanderer S. 51"],"alt_titles":[],"source_summaries":[{"book":"Pichler: Auswanderer","title":"Möbelfabrik Luger in St. Paul wird eingestellt","summary":"In den 1950er Jahren wird die Produktion der 'Luger Furniture Company' im North St. Paul/Minnesota eingestellt. Die Schreinerfamilie Luger aus Dornbirn-Schwefel – begründet 1862 durch die Brüder Ferdinand und Johann Nepomuk Luger in Wabasha – hat durch hundert Jahre und vier Generationen das Wirtschaftsleben Minnesotas und den Möbelgeschmack einer Epoche geprägt. Eine der wichtigsten Dornbirner Wirtschaftsspuren in den USA endet."}],"id":"E079"},{"year":1951,"year_end":null,"date_precision":"year","title":"Gruendung der Export und Mustermesse Gesellschaft","summary":"Im Maerz 1951 wurde die Export und Mustermesse Ges.m.b.H. Dornbirn als eigene Gesellschaft gegruendet. Im selben Jahr konnte die Messe erstmals mehr als 200.000 Eintritte verzeichnen. Hans Naegele veroeffentlichte das Dornbirner Heimatbuch, das lange Zeit das einzige Standardwerk zur Geschichte Dornbirns blieb - die NSDAP-Zeit, die Verfolgten und der Krieg wurden darin mit keinem Wort erwaehnt.","people":["Hans Naegele"],"places":["Dornbirn"],"category":"Wirtschaft","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 81, 89"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Gruendung der Export und Mustermesse Gesellschaft","summary":"Im Maerz 1951 wurde die Export und Mustermesse Ges.m.b.H. Dornbirn als eigene Gesellschaft gegruendet. Im selben Jahr konnte die Messe erstmals mehr als 200.000 Eintritte verzeichnen. Hans Naegele veroeffentlichte das Dornbirner Heimatbuch, das lange Zeit das einzige Standardwerk zur Geschichte Dornbirns blieb - die NSDAP-Zeit, die Verfolgten und der Krieg wurden darin mit keinem Wort erwaehnt."}],"id":"E080"},{"year":1951,"year_end":1960,"date_precision":"year_range","title":"Ruesch-Werke produzieren automatische Webstuehle","summary":"Die von Ruesch selbst entwickelten automatischen Webstuehle (1951-1960) waren eine erfolgreiche Antwort auf den grossen Bedarf der sich rasch entwickelnden Textilindustrie nach dem Zweiten Weltkrieg. Die Schweizer Maschinenindustrie mit Rueti und Saurer konnte die Nachfrage kaum decken.","people":[],"places":["Dornbirn"],"category":"Industrie","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 61"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Ruesch-Werke produzieren automatische Webstuehle","summary":"Die von Ruesch selbst entwickelten automatischen Webstuehle (1951-1960) waren eine erfolgreiche Antwort auf den grossen Bedarf der sich rasch entwickelnden Textilindustrie nach dem Zweiten Weltkrieg. Die Schweizer Maschinenindustrie mit Rueti und Saurer konnte die Nachfrage kaum decken."}],"id":"E081"},{"year":1952,"year_end":null,"date_precision":"year","title":"Tod des Kuenstlers Edmund Kalb und Bau der Hauptschule","summary":"Im Jahr 1952 starb der Dornbirner Kuenstler Edmund Kalb (geb. 1900) an einem Magendurchbruch - ein einsamer und qualvoller Tod. Kalb war ein moderner Portraetzeichner, dessen Werk erst nach seinem Tod entdeckt wurde und in den 1990er Jahren internationale Anerkennung erlangte. Im selben Jahr 1952 wurde die neue Hauptschule errichtet, die gleichzeitig als Ausstellungsgebaeude fuer die Dornbirner Messe diente.","people":["Edmund Kalb"],"places":["Dornbirn","Schillerstrasse"],"category":"Persönlichkeit","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 85-86, 93"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Tod des Kuenstlers Edmund Kalb und Bau der Hauptschule","summary":"Im Jahr 1952 starb der Dornbirner Kuenstler Edmund Kalb (geb. 1900) an einem Magendurchbruch - ein einsamer und qualvoller Tod. Kalb war ein moderner Portraetzeichner, dessen Werk erst nach seinem Tod entdeckt wurde und in den 1990er Jahren internationale Anerkennung erlangte. Im selben Jahr 1952 wurde die neue Hauptschule errichtet, die gleichzeitig als Ausstellungsgebaeude fuer die Dornbirner Messe diente."}],"id":"E082"},{"year":1953,"year_end":null,"date_precision":"year","title":"Erbau der Messehalle und Ankauf des Naturmuseums-Gebaeudes","summary":"Im Jahr 1953 wurde die eigentliche Messehalle errichtet, die heute als Stadthalle dient. Im selben Jahr kauften Land Vorarlberg und Stadt Dornbirn das Haus Marktstrasse Nr. 53 um darin die naturkundlichen Sammlungen von Siegfried Fussenegger auszustellen. Walter Zumtobel erzielte 1953 mit einem neuen Vorschaltgeraet einen Durchbruch und begann mit der Leuchtenproduktion unter dem Namen Profilux-Leuchten. Die Lebensmittelkarten wurden Mitte 1953 letztmalig ausgegeben.","people":["Siegfried Fussenegger","Walter Zumtobel"],"places":["Dornbirn","Marktstrasse"],"category":"Bauten","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 93, 96, 102"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Erbau der Messehalle und Ankauf des Naturmuseums-Gebaeudes","summary":"Im Jahr 1953 wurde die eigentliche Messehalle errichtet, die heute als Stadthalle dient. Im selben Jahr kauften Land Vorarlberg und Stadt Dornbirn das Haus Marktstrasse Nr. 53 um darin die naturkundlichen Sammlungen von Siegfried Fussenegger auszustellen. Walter Zumtobel erzielte 1953 mit einem neuen Vorschaltgeraet einen Durchbruch und begann mit der Leuchtenproduktion unter dem Namen Profilux-Leuchten. Die Lebensmittelkarten wurden Mitte 1953 letztmalig ausgegeben."}],"id":"E083"},{"year":1954,"year_end":null,"date_precision":"year","title":"Erstes Vorarlberger Hochhaus in Dornbirn","summary":"Im Jahr 1954 wurde das erste Vorarlberger Hochhaus in Dornbirn an der Marktstrasse 8 gebaut. Es wuchs nach dem Erdgeschoss noch sieben Stockwerke in die Hoehe. Das Hochhaus im Gruenen sollte spaeter vom Gessler-Hochhaus in der Schulgasse Nr. 7 und dem zehngeschossigen Messe-Hochhaus in der Realschulstrasse Nr. 6 uebertroffen werden. Im selben Jahr 1954 musste der Vorarlberger Landessender an den Bund uebergeben werden.","people":[],"places":["Dornbirn","Marktstrasse"],"category":"Bauten","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 93-94"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Erstes Vorarlberger Hochhaus in Dornbirn","summary":"Im Jahr 1954 wurde das erste Vorarlberger Hochhaus in Dornbirn an der Marktstrasse 8 gebaut. Es wuchs nach dem Erdgeschoss noch sieben Stockwerke in die Hoehe. Das Hochhaus im Gruenen sollte spaeter vom Gessler-Hochhaus in der Schulgasse Nr. 7 und dem zehngeschossigen Messe-Hochhaus in der Realschulstrasse Nr. 6 uebertroffen werden. Im selben Jahr 1954 musste der Vorarlberger Landessender an den Bund uebergeben werden."}],"id":"E084"},{"year":1954,"year_end":null,"date_precision":"year","title":"Vorarlberger Naturschau in der Marktstrasse eroeffnet","summary":"Die Vorarlberger Naturschau entstand 1954, als das Land Vorarlberg und die Stadt Dornbirn die Sammlung Siegfried Fusseneggers kauften und im Gebaeude in der Dornbirner Marktstrasse ausstellten. Auch die naturwissenschaftlichen Sammlungen des Landesmuseums in Bregenz wurden in das neue Haus ueberfuehrt.","people":["Siegfried Fussenegger"],"places":["Dornbirn","Marktstrasse"],"category":"Kultur","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 62"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Vorarlberger Naturschau in der Marktstrasse eroeffnet","summary":"Die Vorarlberger Naturschau entstand 1954, als das Land Vorarlberg und die Stadt Dornbirn die Sammlung Siegfried Fusseneggers kauften und im Gebaeude in der Dornbirner Marktstrasse ausstellten. Auch die naturwissenschaftlichen Sammlungen des Landesmuseums in Bregenz wurden in das neue Haus ueberfuehrt."}],"id":"E085"},{"year":1955,"year_end":null,"date_precision":"year","title":"Einweihung Messehalle mit Gemeinschaftsaufführung","summary":"Im Jahr 1955 fand anlaesslich der Einweihung der Messehalle eine grosse Gemeinschaftsaufführung saemtlicher Dornbirner Choere statt. Ueber 400 Personen fuehrten Die Schoepfung von Joseph Haydn unter der Leitung von Friedrich Jung auf. Bei den Gemeindevertretungswahlen 1955 verlor die WdU stark, die OuVP erreichte 49 Prozent.","people":["Friedrich Jung","Joseph Haydn"],"places":["Dornbirn"],"category":"Kultur","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 99, 103"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Einweihung Messehalle mit Gemeinschaftsaufführung","summary":"Im Jahr 1955 fand anlaesslich der Einweihung der Messehalle eine grosse Gemeinschaftsaufführung saemtlicher Dornbirner Choere statt. Ueber 400 Personen fuehrten Die Schoepfung von Joseph Haydn unter der Leitung von Friedrich Jung auf. Bei den Gemeindevertretungswahlen 1955 verlor die WdU stark, die OuVP erreichte 49 Prozent."}],"id":"E086"},{"year":1955,"year_end":null,"date_precision":"year","title":"Tod der späteren Heiligen Katharina Drexel in Philadelphia","summary":"Katharina Drexel (1858-1955), Enkelin des aus Dornbirn-Hatlerdorf ausgewanderten Bankiers Franz Martin Drexel und Tochter des Bankerben Francis A. Drexel, stirbt 1955. Nach dem frühen Tod ihrer Mutter und einer Halbgeschwisterehe ihres Vaters mit Emma Bouvier (Grosstante von Jackie Kennedy) hatte sie ihr riesiges geerbtes Vermögen für soziale und missionarische Projekte verwendet. Sie gründete einen Nonnenorden zur Schulung von 'Indianern und Schwarzen'.","people":["Katharina Drexel","Francis A. Drexel","Emma Bouvier","Franz Martin Drexel"],"places":["Philadelphia","Hatlerdorf"],"category":"Religion","sources":["Pichler: Auswanderer"],"page_hints":["Pichler: Auswanderer S. 19"],"alt_titles":[],"source_summaries":[{"book":"Pichler: Auswanderer","title":"Tod der späteren Heiligen Katharina Drexel in Philadelphia","summary":"Katharina Drexel (1858-1955), Enkelin des aus Dornbirn-Hatlerdorf ausgewanderten Bankiers Franz Martin Drexel und Tochter des Bankerben Francis A. Drexel, stirbt 1955. Nach dem frühen Tod ihrer Mutter und einer Halbgeschwisterehe ihres Vaters mit Emma Bouvier (Grosstante von Jackie Kennedy) hatte sie ihr riesiges geerbtes Vermögen für soziale und missionarische Projekte verwendet. Sie gründete einen Nonnenorden zur Schulung von 'Indianern und Schwarzen'."}],"id":"E087"},{"year":1956,"year_end":null,"date_precision":"year","title":"Oelz uebersiedelt in ehemalige Tischlerei Rhomberg","summary":"1956 uebersiedelte der Betrieb Oelz von der Marktstrasse an die Schmelzhuetterstrasse in die ehemalige Tischlerei Rhomberg, die in Konkurs gegangen war. Im selben Jahr nahm bei Fussenegger die Tochterfirma Arido in Wiener Neustadt die Produktion konfektionierter Damen- und Herrenwaesche auf.","people":["Rudolf Oelz","Heinz Ginzel"],"places":["Dornbirn","Schmelzhuetterstrasse"],"category":"Wirtschaft","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 49"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Oelz uebersiedelt in ehemalige Tischlerei Rhomberg","summary":"1956 uebersiedelte der Betrieb Oelz von der Marktstrasse an die Schmelzhuetterstrasse in die ehemalige Tischlerei Rhomberg, die in Konkurs gegangen war. Im selben Jahr nahm bei Fussenegger die Tochterfirma Arido in Wiener Neustadt die Produktion konfektionierter Damen- und Herrenwaesche auf."}],"id":"E088"},{"year":1959,"year_end":null,"date_precision":"year","title":"Umgestaltung Rathausplatz","summary":"Ende der 1950er Jahre veraenderte der Rathausplatz sein Gesicht: 1959 machte das alte Gericht einem kleinen Park mit Fahnenrondell Platz. Die Aufloesung des Vorarlberger Rundfunkorchesters 1958/59 - das Land Vorarlberg wollte keinen Zuschuss leisten - laehmte das musikalische Leben der Stadt. 22 Musiker gingen nach Wien, um im spaeteren ORF-Sinfonieorchester zu spielen.","people":[],"places":["Dornbirn","Rathausplatz"],"category":"Stadtentwicklung","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 93, 99"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Umgestaltung Rathausplatz","summary":"Ende der 1950er Jahre veraenderte der Rathausplatz sein Gesicht: 1959 machte das alte Gericht einem kleinen Park mit Fahnenrondell Platz. Die Aufloesung des Vorarlberger Rundfunkorchesters 1958/59 - das Land Vorarlberg wollte keinen Zuschuss leisten - laehmte das musikalische Leben der Stadt. 22 Musiker gingen nach Wien, um im spaeteren ORF-Sinfonieorchester zu spielen."}],"id":"E089"},{"year":1959,"year_end":null,"date_precision":"year","title":"Zumtobel beginnt mit elektronischen Lichtkomponenten","summary":"1959 begann Zumtobel mit der Entwicklung elektronischer Lichtkomponenten. Damit setzte das Unternehmen den Weg vom Vorschaltgeraete-Hersteller zum Lichttechnik-Konzern fort, der spaeter durch Mikrokontroller zur Lichtsteuerung gepraegt sein sollte.","people":[],"places":["Dornbirn"],"category":"Industrie","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 68"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Zumtobel beginnt mit elektronischen Lichtkomponenten","summary":"1959 begann Zumtobel mit der Entwicklung elektronischer Lichtkomponenten. Damit setzte das Unternehmen den Weg vom Vorschaltgeraete-Hersteller zum Lichttechnik-Konzern fort, der spaeter durch Mikrokontroller zur Lichtsteuerung gepraegt sein sollte."}],"id":"E090"},{"year":1960,"year_end":null,"date_precision":"decade","title":"Erkundungsbohrung Dornbirn 1 erreicht Felsuntergrund","summary":"Anfang der 1960er-Jahre wurde am Nordrand des Siedlungsgebiets an der Straße nach Bregenz die Erkundungsbohrung Dornbirn 1 niedergebracht. Sie traf den felsigen Untergrund erst in 336 Metern Tiefe - 77 Meter über dem Meeresniveau. Die Bohrung lieferte wichtige Erkenntnisse über die enorme Übertiefung des Rheintaltrogs durch die eiszeitlichen Gletscher.","people":[],"places":["Dornbirn"],"category":"Bildung","sources":["Friebe: Naturraum"],"page_hints":["Friebe: Naturraum S. 37"],"alt_titles":[],"source_summaries":[{"book":"Friebe: Naturraum","title":"Erkundungsbohrung Dornbirn 1 erreicht Felsuntergrund","summary":"Anfang der 1960er-Jahre wurde am Nordrand des Siedlungsgebiets an der Straße nach Bregenz die Erkundungsbohrung Dornbirn 1 niedergebracht. Sie traf den felsigen Untergrund erst in 336 Metern Tiefe - 77 Meter über dem Meeresniveau. Die Bohrung lieferte wichtige Erkenntnisse über die enorme Übertiefung des Rheintaltrogs durch die eiszeitlichen Gletscher."}],"id":"E091"},{"year":1960,"year_end":null,"date_precision":"year","title":"Eroeffnung des Naturmuseums und Gemeindewahlen","summary":"Im Juni 1960 wurde das Naturmuseum (Vorarlberger Naturschau) als Lebenstraum von Siegfried Fussenegger eroeffnet. Dornbirn zaehlte nun 28.075 Einwohner. Im selben Jahr brachten die Gemeindewahlen Stimmengewinne fuer die SPOu unter Franz Katzengruber, die FPOu mit Hubert Zumtobel konnte ihre Mandate von vier auf sechs erhoehen. Walter Zumtobels Firma wies rund 300 Beschaeftigte auf.","people":["Siegfried Fussenegger","Hubert Zumtobel","Walter Zumtobel"],"places":["Dornbirn"],"category":"Kultur","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 96, 102-105, 115"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Eroeffnung des Naturmuseums und Gemeindewahlen","summary":"Im Juni 1960 wurde das Naturmuseum (Vorarlberger Naturschau) als Lebenstraum von Siegfried Fussenegger eroeffnet. Dornbirn zaehlte nun 28.075 Einwohner. Im selben Jahr brachten die Gemeindewahlen Stimmengewinne fuer die SPOu unter Franz Katzengruber, die FPOu mit Hubert Zumtobel konnte ihre Mandate von vier auf sechs erhoehen. Walter Zumtobels Firma wies rund 300 Beschaeftigte auf."}],"id":"E092"},{"year":1960,"year_end":null,"date_precision":"year","title":"Hoehepunkt der Textilstadt - 5000 Beschaeftigte","summary":"Im Jahre 1960 arbeiteten ca. 5000 Beschaeftigte im Textilsektor in Dornbirn, bei einer Gesamtbevoelkerung von 28.700. Man konnte damals mit Fug und Recht von einer Textilstadt sprechen. Es war einer der Hoehepunkte der Textilindustrie, bevor 1973 die Spitzenzahl von 6000 Dienstnehmern bei 37.500 Einwohnern erreicht wurde.","people":[],"places":["Dornbirn"],"category":"Industrie","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 10"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Hoehepunkt der Textilstadt - 5000 Beschaeftigte","summary":"Im Jahre 1960 arbeiteten ca. 5000 Beschaeftigte im Textilsektor in Dornbirn, bei einer Gesamtbevoelkerung von 28.700. Man konnte damals mit Fug und Recht von einer Textilstadt sprechen. Es war einer der Hoehepunkte der Textilindustrie, bevor 1973 die Spitzenzahl von 6000 Dienstnehmern bei 37.500 Einwohnern erreicht wurde."}],"id":"E093"},{"year":1960,"year_end":1969,"date_precision":"decade","title":"Strukturwandel: neue Leitbranchen loesen Textilindustrie ab","summary":"Ab den 1960er Jahren begann sich die wirtschaftliche Struktur Dornbirns spuerbar zu wandeln. Die metallverarbeitende Industrie, die Elektroindustrie, die Nahrungsmittelindustrie sowie der Handels- und Dienstleistungsbereich wurden zu den wichtigsten Arbeitgebern in der Stadt und loesten die zuvor dominierende Textilindustrie als Beschaeftigungsmotor schrittweise ab. Damit begann die Diversifizierung der einseitig auf Textilien ausgerichteten Wirtschaftsstruktur, die Dornbirn einst das Attribut Manchester am Rhein eingebracht hatte.","people":[],"places":["Dornbirn"],"category":"Wirtschaft","sources":["Aberer: Stadtentwicklung"],"page_hints":["Aberer: Stadtentwicklung S. 19"],"alt_titles":[],"source_summaries":[{"book":"Aberer: Stadtentwicklung","title":"Strukturwandel: neue Leitbranchen loesen Textilindustrie ab","summary":"Ab den 1960er Jahren begann sich die wirtschaftliche Struktur Dornbirns spuerbar zu wandeln. Die metallverarbeitende Industrie, die Elektroindustrie, die Nahrungsmittelindustrie sowie der Handels- und Dienstleistungsbereich wurden zu den wichtigsten Arbeitgebern in der Stadt und loesten die zuvor dominierende Textilindustrie als Beschaeftigungsmotor schrittweise ab. Damit begann die Diversifizierung der einseitig auf Textilien ausgerichteten Wirtschaftsstruktur, die Dornbirn einst das Attribut Manchester am Rhein eingebracht hatte."}],"id":"E094"},{"year":1961,"year_end":null,"date_precision":"year","title":"Groesster Websaal Oesterreichs in Saegen - SPAR Drexel","summary":"1961 stand im F.M. Haemmerle-Werk in Saegen der groesste Websaal Oesterreichs. Im gleichen Jahr breiteten sich die Lebensmittel-Selbstbedienungslaeden der SPAR-Handelskette ueber ganz Vorarlberg aus, und die Brueder Drexel errichteten fuer ihre Filialen eine Grosshandelszentrale an der Bahnlinie in der Birkenwiese mit innovativer EDV-gesteuerter Grosslagerhausbewirtschaftung.","people":["Drexel"],"places":["Dornbirn","Saegen","Birkenwiese"],"category":"Wirtschaft","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 50"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Groesster Websaal Oesterreichs in Saegen - SPAR Drexel","summary":"1961 stand im F.M. Haemmerle-Werk in Saegen der groesste Websaal Oesterreichs. Im gleichen Jahr breiteten sich die Lebensmittel-Selbstbedienungslaeden der SPAR-Handelskette ueber ganz Vorarlberg aus, und die Brueder Drexel errichteten fuer ihre Filialen eine Grosshandelszentrale an der Bahnlinie in der Birkenwiese mit innovativer EDV-gesteuerter Grosslagerhausbewirtschaftung."}],"id":"E095"},{"year":1961,"year_end":null,"date_precision":"year","title":"Letzter Nachweis des Malven-Dickkopffalters vor Verschollenheit","summary":"Aus dem Jahr 1961 stammt der letzte Nachweis des Malven-Dickkopffalters (Carcharodus alceae) in Vorarlberg, gesichtet in Bangs. Danach galt die Art als verschollen. Erst rund 50 Jahre später wurde der Wärme liebende Falter im Garten der inatura wiederentdeckt - möglicherweise begünstigt durch den Klimawandel.","people":[],"places":["Bangs"],"category":"Natur","sources":["Friebe: Naturraum"],"page_hints":["Friebe: Naturraum S. 92"],"alt_titles":[],"source_summaries":[{"book":"Friebe: Naturraum","title":"Letzter Nachweis des Malven-Dickkopffalters vor Verschollenheit","summary":"Aus dem Jahr 1961 stammt der letzte Nachweis des Malven-Dickkopffalters (Carcharodus alceae) in Vorarlberg, gesichtet in Bangs. Danach galt die Art als verschollen. Erst rund 50 Jahre später wurde der Wärme liebende Falter im Garten der inatura wiederentdeckt - möglicherweise begünstigt durch den Klimawandel."}],"id":"E096"},{"year":1962,"year_end":1978,"date_precision":"year_range","title":"Bau der Siedlung Bremenmahd","summary":"Zwischen 1962 und 1978 entstand am suedlichen Rand von Dornbirn die VOGEWOSI-Siedlung Bremenmahd. Sie sollte Menschen aus den letzten Barackensiedlungen, die noch aus dem Zweiten Weltkrieg stammten, menschenwuerdige Wohnbedingungen ermoeglichen. Die Siedlung wuchs in mehreren Baulosen und beherbergte rund 1.200 Menschen. Lage und Billigkeit der Baugruende waren wesentlich, infrastrukturell lag die Siedlung jedoch sehr peripher.","people":[],"places":["Bremenmahd","Dornbirn"],"category":"Stadtentwicklung","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 92"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Bau der Siedlung Bremenmahd","summary":"Zwischen 1962 und 1978 entstand am suedlichen Rand von Dornbirn die VOGEWOSI-Siedlung Bremenmahd. Sie sollte Menschen aus den letzten Barackensiedlungen, die noch aus dem Zweiten Weltkrieg stammten, menschenwuerdige Wohnbedingungen ermoeglichen. Die Siedlung wuchs in mehreren Baulosen und beherbergte rund 1.200 Menschen. Lage und Billigkeit der Baugruende waren wesentlich, infrastrukturell lag die Siedlung jedoch sehr peripher."}],"id":"E097"},{"year":1962,"year_end":null,"date_precision":"year","title":"Erste Chemiefasertagung in Dornbirn","summary":"Die internationale Chemiefasertagung (Man-Made Fibers Congress) hatte erstmals 1962 in den Raeumen der Textilschule Dornbirn vor 180 Teilnehmern aus der ganzen Welt stattgefunden. Themen waren texturierte Garne, Terylene-Gewebe, Viskosefasern, Zellwolle oder Chemiefasern in Heimtextilien. Unter der Patronanz von CIRFS entwickelte sich die Tagung zu einer bedeutenden jaehrlichen Grossveranstaltung.","people":[],"places":["Dornbirn"],"category":"Wirtschaft","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 26"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Erste Chemiefasertagung in Dornbirn","summary":"Die internationale Chemiefasertagung (Man-Made Fibers Congress) hatte erstmals 1962 in den Raeumen der Textilschule Dornbirn vor 180 Teilnehmern aus der ganzen Welt stattgefunden. Themen waren texturierte Garne, Terylene-Gewebe, Viskosefasern, Zellwolle oder Chemiefasern in Heimtextilien. Unter der Patronanz von CIRFS entwickelte sich die Tagung zu einer bedeutenden jaehrlichen Grossveranstaltung."}],"id":"E098"},{"year":1963,"year_end":null,"date_precision":"year","title":"Oelz vertreibt erstmals Stangenkuchen ueber Grosshandel","summary":"Erstmals wurden 1963 von der Firma Oelz Stangenkuchen ueber den Grosshandel vertrieben. Damit begann der Aufstieg der Firma zur fuehrenden Backwarenmarke Oesterreichs. Drei Jahre spaeter wurde der erste Netzbandofen in Betrieb genommen.","people":["Rudolf Oelz"],"places":["Dornbirn"],"category":"Wirtschaft","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 49"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Oelz vertreibt erstmals Stangenkuchen ueber Grosshandel","summary":"Erstmals wurden 1963 von der Firma Oelz Stangenkuchen ueber den Grosshandel vertrieben. Damit begann der Aufstieg der Firma zur fuehrenden Backwarenmarke Oesterreichs. Drei Jahre spaeter wurde der erste Netzbandofen in Betrieb genommen."}],"id":"E099"},{"year":1963,"year_end":null,"date_precision":"year","title":"Tod des Nobelpreisträgers Herbert Spencer Gasser","summary":"Herbert Spencer Gasser stirbt 1963. Der Enkel des nach Dubuque ausgewanderten Dornbirner Schuhmachers Kaspar Gasser war seit 1944 Nobelpreisträger und leitete das renommierte Rockefeller Institute for Medical Research in New York. Mit Katharina Drexel bildet er das zweite international herausragende Vermächtnis der Dornbirner USA-Auswanderung – wie Pichler betont: 'Die AuswandererInnen keiner österreichischen Stadt haben eine Heilige und einen Nobelpreisträger vorzuweisen, ausser die aus Dornbirn.'","people":["Herbert Spencer Gasser"],"places":["New York","Dornbirn"],"category":"Persönlichkeit","sources":["Pichler: Auswanderer"],"page_hints":["Pichler: Auswanderer S. 55, S. 57"],"alt_titles":[],"source_summaries":[{"book":"Pichler: Auswanderer","title":"Tod des Nobelpreisträgers Herbert Spencer Gasser","summary":"Herbert Spencer Gasser stirbt 1963. Der Enkel des nach Dubuque ausgewanderten Dornbirner Schuhmachers Kaspar Gasser war seit 1944 Nobelpreisträger und leitete das renommierte Rockefeller Institute for Medical Research in New York. Mit Katharina Drexel bildet er das zweite international herausragende Vermächtnis der Dornbirner USA-Auswanderung – wie Pichler betont: 'Die AuswandererInnen keiner österreichischen Stadt haben eine Heilige und einen Nobelpreisträger vorzuweisen, ausser die aus Dornbirn.'"}],"id":"E100"},{"year":1964,"year_end":null,"date_precision":"year","title":"Chemie haelt Einzug an der Textilschule unter Hinterauer","summary":"Unter dem Chemiker und Direktor Dr. Hinterauer hielt 1964 auch die Chemie an der Dornbirner Bundes-Textilschule Einzug. Die Schule bekam die Bezeichnung Hoehere Bundes-Lehr- und Versuchsanstalt, womit sich der Forschungsauftrag bereits abzeichnete. Pruefen und Versuchen wurde zum zentralen Aufgabengebiet der Spezialabteilung.","people":["Hinterauer"],"places":["Dornbirn"],"category":"Bildung","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 22"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Chemie haelt Einzug an der Textilschule unter Hinterauer","summary":"Unter dem Chemiker und Direktor Dr. Hinterauer hielt 1964 auch die Chemie an der Dornbirner Bundes-Textilschule Einzug. Die Schule bekam die Bezeichnung Hoehere Bundes-Lehr- und Versuchsanstalt, womit sich der Forschungsauftrag bereits abzeichnete. Pruefen und Versuchen wurde zum zentralen Aufgabengebiet der Spezialabteilung."}],"id":"E101"},{"year":1964,"year_end":null,"date_precision":"year","title":"Eroeffnung der Arlbergstrasse - Entlastung Hatler Zentrum","summary":"Im Jahr 1964 wurde die Arlbergstrasse als Umfahrung eroeffnet, die das alte Hatler Zentrum vom Transitverkehr befreite. Die Verkehrsentwicklung war Folge des starken Bevoelkerungswachstums und des steigenden Wohlstands. Zwischen 1956 und 1961 hatte sich Dornbirn am dynamischsten entwickelt, fast zwei Drittel der Zuwanderer kamen aus den Bundeslaendern Steiermark, Tirol und Kaernten.","people":[],"places":["Hatlerdorf","Dornbirn"],"category":"Verkehr","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 92"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Eroeffnung der Arlbergstrasse - Entlastung Hatler Zentrum","summary":"Im Jahr 1964 wurde die Arlbergstrasse als Umfahrung eroeffnet, die das alte Hatler Zentrum vom Transitverkehr befreite. Die Verkehrsentwicklung war Folge des starken Bevoelkerungswachstums und des steigenden Wohlstands. Zwischen 1956 und 1961 hatte sich Dornbirn am dynamischsten entwickelt, fast zwei Drittel der Zuwanderer kamen aus den Bundeslaendern Steiermark, Tirol und Kaernten."}],"id":"E102"},{"year":1965,"year_end":null,"date_precision":"year","title":"Karl Bohle wird Buergermeister","summary":"Das Wahljahr 1965 brachte einen ueberwaeltigenden Sieg fuer die Volkspartei unter Dr. Karl Bohle (1920-1987), der mit 25 von 36 Mandaten eine Zwei-Drittel-Mehrheit erreichte. Selbst die bisher sozialistisch dominierten neuen Siedlungsgebiete am Stadtrand waehlten nun schwarz. Die SPOu unter Andreas Jellitsch verlor vier Mandate, die FPOu unter Herbert Diem verlor drei Mandate. Die Kommentare aller Parteien sahen die Ursache in den Ereignissen um die verhinderte Schiffstaufe in Fussach.","people":["Karl Bohle","Andreas Jellitsch","Herbert Diem"],"places":["Dornbirn"],"category":"Politik","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 105"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Karl Bohle wird Buergermeister","summary":"Das Wahljahr 1965 brachte einen ueberwaeltigenden Sieg fuer die Volkspartei unter Dr. Karl Bohle (1920-1987), der mit 25 von 36 Mandaten eine Zwei-Drittel-Mehrheit erreichte. Selbst die bisher sozialistisch dominierten neuen Siedlungsgebiete am Stadtrand waehlten nun schwarz. Die SPOu unter Andreas Jellitsch verlor vier Mandate, die FPOu unter Herbert Diem verlor drei Mandate. Die Kommentare aller Parteien sahen die Ursache in den Ereignissen um die verhinderte Schiffstaufe in Fussach."}],"id":"E103"},{"year":1965,"year_end":null,"date_precision":"year","title":"Ruesch exportiert Metall-Bandsaege-Automat weltweit","summary":"Ab 1965 wurde der Metall-Bandsaege-Automat aus eigener Konstruktion der Maschinenfabrik Ruesch in alle Teile der Welt exportiert und war auf vielen grossen Messen Europas, besonders im damaligen Ostblock, praesent. Es war einer der letzten Erfolge des Unternehmens vor dem endgueltigen Niedergang.","people":[],"places":["Dornbirn"],"category":"Industrie","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 61"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Ruesch exportiert Metall-Bandsaege-Automat weltweit","summary":"Ab 1965 wurde der Metall-Bandsaege-Automat aus eigener Konstruktion der Maschinenfabrik Ruesch in alle Teile der Welt exportiert und war auf vielen grossen Messen Europas, besonders im damaligen Ostblock, praesent. Es war einer der letzten Erfolge des Unternehmens vor dem endgueltigen Niedergang."}],"id":"E104"},{"year":1966,"year_end":1970,"date_precision":"year_range","title":"Erweiterungsbau des Wirtschaftsfoerderungsinstituts","summary":"Zwischen 1966 und 1970 entstand der Erweiterungsbau des Wirtschaftsfoerderungsinstituts in Dornbirn, geplant vom Architekten Ernst Hiesmayr. Das Gebaeude bestimmte gemeinsam mit dem ORF-Landestudio von Gustav Peichl (1968-1972) die oeffentliche Architekturdiskussion der Zeit.","people":["Ernst Hiesmayr"],"places":["Dornbirn"],"category":"Bauten","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 101"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Erweiterungsbau des Wirtschaftsfoerderungsinstituts","summary":"Zwischen 1966 und 1970 entstand der Erweiterungsbau des Wirtschaftsfoerderungsinstituts in Dornbirn, geplant vom Architekten Ernst Hiesmayr. Das Gebaeude bestimmte gemeinsam mit dem ORF-Landestudio von Gustav Peichl (1968-1972) die oeffentliche Architekturdiskussion der Zeit."}],"id":"E105"},{"year":1966,"year_end":1967,"date_precision":"year_range","title":"oetex Fachmesse und EHG Stahlzentrum West","summary":"1966 und 1967 versuchte man es in Dornbirn noch mit der oetex, der Oesterreichischen Textil-Fachmesse fuer Stoffe aller Art, die schliesslich aus wirtschaftlichen Gruenden aufgegeben wurde. 1966/67 errichtete die Eisenhandelsgesellschaft EHG Dornbirn, eine Kooperation von vier alteingesessenen Eisenhaendlern, im Wallenmahd das Stahlzentrum West fuer ca. 15.000 Tonnen Staehle.","people":[],"places":["Dornbirn","Wallenmahd"],"category":"Wirtschaft","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 9"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"oetex Fachmesse und EHG Stahlzentrum West","summary":"1966 und 1967 versuchte man es in Dornbirn noch mit der oetex, der Oesterreichischen Textil-Fachmesse fuer Stoffe aller Art, die schliesslich aus wirtschaftlichen Gruenden aufgegeben wurde. 1966/67 errichtete die Eisenhandelsgesellschaft EHG Dornbirn, eine Kooperation von vier alteingesessenen Eisenhaendlern, im Wallenmahd das Stahlzentrum West fuer ca. 15.000 Tonnen Staehle."}],"id":"E106"},{"year":1968,"year_end":1972,"date_precision":"year_range","title":"Bau des ORF-Landestudios durch Gustav Peichl","summary":"Zwischen 1968 und 1972 entstand das markante ORF-Landestudio in Dornbirn nach Plaenen von Architekt Gustav Peichl. Das Gebaeude wurde zu einem der bekanntesten Bauten Dornbirns und praegte zusammen mit dem Erweiterungsbau des Wirtschaftsfoerderungsinstituts die Architekturdebatte der Zeit.","people":["Gustav Peichl"],"places":["Dornbirn"],"category":"Bauten","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 101"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Bau des ORF-Landestudios durch Gustav Peichl","summary":"Zwischen 1968 und 1972 entstand das markante ORF-Landestudio in Dornbirn nach Plaenen von Architekt Gustav Peichl. Das Gebaeude wurde zu einem der bekanntesten Bauten Dornbirns und praegte zusammen mit dem Erweiterungsbau des Wirtschaftsfoerderungsinstituts die Architekturdebatte der Zeit."}],"id":"E107"},{"year":1969,"year_end":null,"date_precision":"year","title":"Eigene Bezirkshauptmannschaft fuer Dornbirn","summary":"Im Jahr 1969 wurde Dornbirn Sitz einer eigenen Bezirkshauptmannschaft und loeste sich damit von der Verwaltung in Feldkirch. Im selben Jahr fand der Umbau der katholischen Pfarrkirche St. Martin durch Emil Steffann und Gisbert Hülsmann seinen Abschluss.","people":["Emil Steffann","Gisbert Hülsmann"],"places":["Dornbirn","St. Martin"],"category":"Politik","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 14, 92, 115"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Eigene Bezirkshauptmannschaft fuer Dornbirn","summary":"Im Jahr 1969 wurde Dornbirn Sitz einer eigenen Bezirkshauptmannschaft und loeste sich damit von der Verwaltung in Feldkirch. Im selben Jahr fand der Umbau der katholischen Pfarrkirche St. Martin durch Emil Steffann und Gisbert Hülsmann seinen Abschluss."}],"id":"E108"},{"year":1970,"year_end":1971,"date_precision":"year_range","title":"INTERSPAR - erstes grosses Einkaufszentrum Dornbirns","summary":"Am fruehesten vorausgesehen hatte die Entwicklung zu Einkaufszentren der Unternehmer Luis Drexel: 1970/71 errichtete er nach Gruendung der oesterreichischen SPAR-AG an der Autobahnauffahrt Dornbirn-Sued mit 5100 m2 Verkaufsflaeche das erste grosse Einkaufszentrum INTERSPAR, um dem Schweizer Rheinpark zuvorzukommen. Schluessel zum Erfolg war das Parkplatzangebot fuer 600 PKWs.","people":["Luis Drexel"],"places":["Dornbirn","Dornbirn-Sued"],"category":"Wirtschaft","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 76"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"INTERSPAR - erstes grosses Einkaufszentrum Dornbirns","summary":"Am fruehesten vorausgesehen hatte die Entwicklung zu Einkaufszentren der Unternehmer Luis Drexel: 1970/71 errichtete er nach Gruendung der oesterreichischen SPAR-AG an der Autobahnauffahrt Dornbirn-Sued mit 5100 m2 Verkaufsflaeche das erste grosse Einkaufszentrum INTERSPAR, um dem Schweizer Rheinpark zuvorzukommen. Schluessel zum Erfolg war das Parkplatzangebot fuer 600 PKWs."}],"id":"E109"},{"year":1970,"year_end":1979,"date_precision":"decade","title":"Krise der Textilindustrie und Freiwerden grosser Industrieareale","summary":"In den 1970er Jahren begann ein rasanter Wandel in Dornbirns Wirtschaft: Die Textilmaerkte brachen weltweit ein, in Osteuropa und Uebersee wurde billiger produziert und konfektioniert. Mit dem Niedergang der Textilindustrie wurden grosse Industrieareale in zentraler Stadtlage frei. Dieser Strukturbruch wurde zur Chance fuer die Stadtentwicklung nach innen und legte den Grundstein fuer die spaetere systematische Nachnutzung der Areale. Noch 1983 wurden in der Dornbirner Textilindustrie rund 4.500 Arbeitsplaetze gezaehlt, heute sind es nur noch rund 100.","people":[],"places":["Dornbirn"],"category":"Wirtschaft","sources":["Aberer: Stadtentwicklung"],"page_hints":["Aberer: Stadtentwicklung S. 19"],"alt_titles":[],"source_summaries":[{"book":"Aberer: Stadtentwicklung","title":"Krise der Textilindustrie und Freiwerden grosser Industrieareale","summary":"In den 1970er Jahren begann ein rasanter Wandel in Dornbirns Wirtschaft: Die Textilmaerkte brachen weltweit ein, in Osteuropa und Uebersee wurde billiger produziert und konfektioniert. Mit dem Niedergang der Textilindustrie wurden grosse Industrieareale in zentraler Stadtlage frei. Dieser Strukturbruch wurde zur Chance fuer die Stadtentwicklung nach innen und legte den Grundstein fuer die spaetere systematische Nachnutzung der Areale. Noch 1983 wurden in der Dornbirner Textilindustrie rund 4.500 Arbeitsplaetze gezaehlt, heute sind es nur noch rund 100."}],"id":"E110"},{"year":1970,"year_end":null,"date_precision":"year","title":"Tochterfirma Promonta in Satteins gegruendet","summary":"1970 wurde mit einem auslaendischen Partner die Tochterfirma Promonta - Sportmoden GmbH in Satteins gegruendet, die anfangs Skibekleidung herstellte. Heute bietet sie textile und logistische Dienstleistungen an und organisiert die Fabriksverkaeufe der Fussenegger-Gruppe.","people":[],"places":["Dornbirn","Satteins"],"category":"Industrie","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 16"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Tochterfirma Promonta in Satteins gegruendet","summary":"1970 wurde mit einem auslaendischen Partner die Tochterfirma Promonta - Sportmoden GmbH in Satteins gegruendet, die anfangs Skibekleidung herstellte. Heute bietet sie textile und logistische Dienstleistungen an und organisiert die Fabriksverkaeufe der Fussenegger-Gruppe."}],"id":"E111"},{"year":1971,"year_end":null,"date_precision":"year","title":"Erstes Teilstueck der Rheintalautobahn eroeffnet","summary":"Im Jahr 1971 wurde das erste Teilstueck der Rheintalautobahn eroeffnet, das den Durchreiseverkehr im Westen an Dornbirn vorbeifuehrte. Dornbirn zaehlte nun 33.810 Einwohner. Bei den Gemeinderatswahlen 1970 hatte Karl Bohle das ausgezeichnete Ergebnis von 1965 noch durch zwei zusaetzliche Mandate uebertreffen koennen. Die Bauten von Hans Purin (Buerglegasse 6, 1972/73) und Gunter Wratzfeld (Watzenegg 41, 1971/72) setzten Massstaebe im Einfamilienhausbau.","people":["Karl Bohle","Hans Purin","Gunter Wratzfeld"],"places":["Dornbirn","Buerglegasse","Watzenegg"],"category":"Verkehr","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 92, 101, 115"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Erstes Teilstueck der Rheintalautobahn eroeffnet","summary":"Im Jahr 1971 wurde das erste Teilstueck der Rheintalautobahn eroeffnet, das den Durchreiseverkehr im Westen an Dornbirn vorbeifuehrte. Dornbirn zaehlte nun 33.810 Einwohner. Bei den Gemeinderatswahlen 1970 hatte Karl Bohle das ausgezeichnete Ergebnis von 1965 noch durch zwei zusaetzliche Mandate uebertreffen koennen. Die Bauten von Hans Purin (Buerglegasse 6, 1972/73) und Gunter Wratzfeld (Watzenegg 41, 1971/72) setzten Massstaebe im Einfamilienhausbau."}],"id":"E112"},{"year":1973,"year_end":null,"date_precision":"year","title":"Hoehepunkt der Textilindustrie - 6000 Beschaeftigte","summary":"Auf dem Hoehepunkt der Entwicklung gab es 1973 in der Dornbirner Textilindustrie die stolze Zahl von 6000 Dienstnehmern bei 37.500 Einwohnern. Im gleichen Jahr ueberschritt F.M. Haemmerle erstmals die Milliarde Schilling an Umsatz. Aber die Beschaeftigten im Dienstleistungssektor erreichten beinahe schon die Zahl der Textilbranche. Tobias Ilg, spaeter Energie-Landwirt im Hatlerdorf, wurde 1973 geboren.","people":["Tobias Ilg"],"places":["Dornbirn"],"category":"Industrie","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 10"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Hoehepunkt der Textilindustrie - 6000 Beschaeftigte","summary":"Auf dem Hoehepunkt der Entwicklung gab es 1973 in der Dornbirner Textilindustrie die stolze Zahl von 6000 Dienstnehmern bei 37.500 Einwohnern. Im gleichen Jahr ueberschritt F.M. Haemmerle erstmals die Milliarde Schilling an Umsatz. Aber die Beschaeftigten im Dienstleistungssektor erreichten beinahe schon die Zahl der Textilbranche. Tobias Ilg, spaeter Energie-Landwirt im Hatlerdorf, wurde 1973 geboren."}],"id":"E113"},{"year":1974,"year_end":null,"date_precision":"year","title":"Fohramoos wird Naturschutzgebiet","summary":"1974 wurde das Fohramoos an der Grenze zwischen Dornbirn und Schwarzenberg zum Naturschutzgebiet erklärt. Das Hochmoor beherbergt einen Komplex aus relativ ungestörten Hochmoorgesellschaften, Moorwäldern, Streuwiesen und Magerrasen. Es entstand auf einer eiszeitlich geformten Plattform mit Wasser stauendem Seeton und ist ein bedeutender postglazialer Reliktstandort für spezialisierte Tier- und Pflanzenarten.","people":[],"places":["Dornbirn","Schwarzenberg","Fohramoos"],"category":"Natur","sources":["Friebe: Naturraum"],"page_hints":["Friebe: Naturraum S. 49"],"alt_titles":[],"source_summaries":[{"book":"Friebe: Naturraum","title":"Fohramoos wird Naturschutzgebiet","summary":"1974 wurde das Fohramoos an der Grenze zwischen Dornbirn und Schwarzenberg zum Naturschutzgebiet erklärt. Das Hochmoor beherbergt einen Komplex aus relativ ungestörten Hochmoorgesellschaften, Moorwäldern, Streuwiesen und Magerrasen. Es entstand auf einer eiszeitlich geformten Plattform mit Wasser stauendem Seeton und ist ein bedeutender postglazialer Reliktstandort für spezialisierte Tier- und Pflanzenarten."}],"id":"E114"},{"year":1974,"year_end":null,"date_precision":"year","title":"Krisenjahr Textilindustrie - Oelz expandiert oesterreichweit","summary":"Das Krisenjahr 1974 traf die Textilindustrie schwer, doch sie erholte sich ein letztes Mal. Im selben Jahr begann die Firma Oelz mit der Gruendung von Land-Leben/Salzburg ein oesterreichweites Vertriebsnetz und legte damit den Grundstein fuer ihren Aufstieg zur fuehrenden Backwarenmarke.","people":[],"places":["Dornbirn"],"category":"Wirtschaft","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 10"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Krisenjahr Textilindustrie - Oelz expandiert oesterreichweit","summary":"Das Krisenjahr 1974 traf die Textilindustrie schwer, doch sie erholte sich ein letztes Mal. Im selben Jahr begann die Firma Oelz mit der Gruendung von Land-Leben/Salzburg ein oesterreichweites Vertriebsnetz und legte damit den Grundstein fuer ihren Aufstieg zur fuehrenden Backwarenmarke."}],"id":"E115"},{"year":1975,"year_end":null,"date_precision":"year","title":"Verlagerung der Dornbirner Messe an den Stadtrand","summary":"Im Jahr 1975 zog die Dornbirner Messe an den westlichen Rand der Stadt um. Unmittelbar daneben entstand das groesste und meistfrequentierte Einkaufszentrum Vorarlbergs (Messepark). Die Zumtobel KG zaehlte 1975 in Dornbirn knapp unter 1.000 Beschaeftigte. Bei den Gemeinderatswahlen baute die OuVP unter Karl Bohle ihren Vorsprung weiter aus.","people":["Karl Bohle"],"places":["Dornbirn","Messepark"],"category":"Wirtschaft","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 92, 96, 105-106"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Verlagerung der Dornbirner Messe an den Stadtrand","summary":"Im Jahr 1975 zog die Dornbirner Messe an den westlichen Rand der Stadt um. Unmittelbar daneben entstand das groesste und meistfrequentierte Einkaufszentrum Vorarlbergs (Messepark). Die Zumtobel KG zaehlte 1975 in Dornbirn knapp unter 1.000 Beschaeftigte. Bei den Gemeinderatswahlen baute die OuVP unter Karl Bohle ihren Vorsprung weiter aus."}],"id":"E116"},{"year":1976,"year_end":null,"date_precision":"year","title":"Zumtobel wird Aktiengesellschaft und kauft Tridonic","summary":"1976 beteiligte sich Zumtobel als nunmehrige Aktiengesellschaft an der britischen Tridonic Ltd. zur Erzeugung von Elektrobauteilen, die schliesslich aufgekauft wurde. Damit begann unter Fuehrung der Soehne des Gruenders Walter Zumtobel die Phase der Firmenuebernahmen und der Gruendung von Vertriebsgesellschaften in Europa.","people":["Walter Zumtobel"],"places":["Dornbirn"],"category":"Industrie","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 68"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Zumtobel wird Aktiengesellschaft und kauft Tridonic","summary":"1976 beteiligte sich Zumtobel als nunmehrige Aktiengesellschaft an der britischen Tridonic Ltd. zur Erzeugung von Elektrobauteilen, die schliesslich aufgekauft wurde. Damit begann unter Fuehrung der Soehne des Gruenders Walter Zumtobel die Phase der Firmenuebernahmen und der Gruendung von Vertriebsgesellschaften in Europa."}],"id":"E117"},{"year":1978,"year_end":null,"date_precision":"year","title":"Oelz baeckt erstmals industriell Toastbrot","summary":"1978 wurde von Oelz erstmals Toastbrot industriell gebacken. 1981 startete man mit Zopfbroten. Diese Sortimente wurden immer staerker nachgefragt und legten den Grundstein fuer die spaetere Expansion in das ehemalige Textilfabriksareal Juchen.","people":[],"places":["Dornbirn"],"category":"Wirtschaft","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 49"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Oelz baeckt erstmals industriell Toastbrot","summary":"1978 wurde von Oelz erstmals Toastbrot industriell gebacken. 1981 startete man mit Zopfbroten. Diese Sortimente wurden immer staerker nachgefragt und legten den Grundstein fuer die spaetere Expansion in das ehemalige Textilfabriksareal Juchen."}],"id":"E118"},{"year":1979,"year_end":null,"date_precision":"year","title":"Gruendung Musikverein Rohrbach und Leitungsuebernahme Musikschule","summary":"Im Jahr 1979 wurde der Musikverein Rohrbach gegruendet und damit die vierte grosse Blasmusikkapelle Dornbirns neben Stadtmusik, Stadtkapelle Haselstauden und Musikgesellschaft Hatlerdorf. Seit 1979 leitet Guntram Simma die Musikschule Dornbirn, in der die Schuelerzahl bis 1990 auf rund 2.000 anstieg. Das Jugendsinfonieorchester Dornbirn entwickelte sich erfolgreich unter Simmas Leitung.","people":["Guntram Simma"],"places":["Rohrbach","Dornbirn"],"category":"Kultur","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 98-99"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Gruendung Musikverein Rohrbach und Leitungsuebernahme Musikschule","summary":"Im Jahr 1979 wurde der Musikverein Rohrbach gegruendet und damit die vierte grosse Blasmusikkapelle Dornbirns neben Stadtmusik, Stadtkapelle Haselstauden und Musikgesellschaft Hatlerdorf. Seit 1979 leitet Guntram Simma die Musikschule Dornbirn, in der die Schuelerzahl bis 1990 auf rund 2.000 anstieg. Das Jugendsinfonieorchester Dornbirn entwickelte sich erfolgreich unter Simmas Leitung."}],"id":"E119"},{"year":1980,"year_end":1989,"date_precision":"decade","title":"Aktive Bodenpolitik als zentrales Steuerungsinstrument","summary":"Seit rund 30 Jahren, also etwa ab den 1980er Jahren, investiert die Stadt Dornbirn jaehrlich hohe Mittel in Flaechensicherung und Flaechenentwicklung. Die aktive Bodenpolitik kommt in keinem Raumplanungsgesetz vor, gehoert in Dornbirn aber zu den wichtigsten gestalterischen Instrumenten der Stadtentwicklung. Voraussetzung ist ein Gleichklang zwischen den stadtpolitischen Akteuren und der Stadtverwaltung. In knapp 150 Sitzungen der Arbeitsgruppe Flaechenmanagement wurden Standorte und Interventionen beraten und zur Beschlussfassung vorbereitet.","people":[],"places":["Dornbirn"],"category":"Politik","sources":["Aberer: Stadtentwicklung"],"page_hints":["Aberer: Stadtentwicklung S. 25"],"alt_titles":[],"source_summaries":[{"book":"Aberer: Stadtentwicklung","title":"Aktive Bodenpolitik als zentrales Steuerungsinstrument","summary":"Seit rund 30 Jahren, also etwa ab den 1980er Jahren, investiert die Stadt Dornbirn jaehrlich hohe Mittel in Flaechensicherung und Flaechenentwicklung. Die aktive Bodenpolitik kommt in keinem Raumplanungsgesetz vor, gehoert in Dornbirn aber zu den wichtigsten gestalterischen Instrumenten der Stadtentwicklung. Voraussetzung ist ein Gleichklang zwischen den stadtpolitischen Akteuren und der Stadtverwaltung. In knapp 150 Sitzungen der Arbeitsgruppe Flaechenmanagement wurden Standorte und Interventionen beraten und zur Beschlussfassung vorbereitet."}],"id":"E120"},{"year":1980,"year_end":null,"date_precision":"decade","title":"Ältester Stein Vorarlbergs im Steinbruch Gstöhl gefunden","summary":"In den 1980er-Jahren wurde im ehemaligen Steinbruch Gstöhl (heute Bauschuttdeponie) ein exotisches Gneisgeröll im Glaukonitsandstein entdeckt. Eine Altersdatierung ergab 827,7 plus/minus 17 Millionen Jahre - es ist damit der älteste Stein Vorarlbergs. Das nächstgelegene Vorkommen vergleichbarer Gesteine befindet sich in der Gegend von Brno (Tschechien). Wahrscheinlich war der Gneis in einem Wurzelstock eingeschlossen, der vor 100 Millionen Jahren ins Meer gespült wurde.","people":[],"places":["Dornbirn","Gstöhl"],"category":"Bildung","sources":["Friebe: Naturraum"],"page_hints":["Friebe: Naturraum S. 19"],"alt_titles":[],"source_summaries":[{"book":"Friebe: Naturraum","title":"Ältester Stein Vorarlbergs im Steinbruch Gstöhl gefunden","summary":"In den 1980er-Jahren wurde im ehemaligen Steinbruch Gstöhl (heute Bauschuttdeponie) ein exotisches Gneisgeröll im Glaukonitsandstein entdeckt. Eine Altersdatierung ergab 827,7 plus/minus 17 Millionen Jahre - es ist damit der älteste Stein Vorarlbergs. Das nächstgelegene Vorkommen vergleichbarer Gesteine befindet sich in der Gegend von Brno (Tschechien). Wahrscheinlich war der Gneis in einem Wurzelstock eingeschlossen, der vor 100 Millionen Jahren ins Meer gespült wurde."}],"id":"E121"},{"year":1980,"year_end":1989,"date_precision":"decade","title":"Grossflaechige Handelsstrukturen am Stadtrand","summary":"Seit den 1980er Jahren stellen grossflaechige Handelsstrukturen am Stadtrand einen Gegensatz zu den Bemuehungen der Zentrumsentwicklung dar. Moebelhaeuser, Fachmaerkte und Einkaufszentren siedelten sich an den Raendern Dornbirns an, oft an Autobahnstandorten, und schufen mit Restaurants, Schnellimbissen und Einzelhandelsketten urbane Konkurrenzangebote. Die Stadtplanung sieht darin eine Gefahr fuer Schoenheit, Vielfalt und Lebensqualitaet der Innenstadt und setzt entsprechend auf Restriktion.","people":[],"places":["Dornbirn"],"category":"Wirtschaft","sources":["Aberer: Stadtentwicklung"],"page_hints":["Aberer: Stadtentwicklung S. 49"],"alt_titles":[],"source_summaries":[{"book":"Aberer: Stadtentwicklung","title":"Grossflaechige Handelsstrukturen am Stadtrand","summary":"Seit den 1980er Jahren stellen grossflaechige Handelsstrukturen am Stadtrand einen Gegensatz zu den Bemuehungen der Zentrumsentwicklung dar. Moebelhaeuser, Fachmaerkte und Einkaufszentren siedelten sich an den Raendern Dornbirns an, oft an Autobahnstandorten, und schufen mit Restaurants, Schnellimbissen und Einzelhandelsketten urbane Konkurrenzangebote. Die Stadtplanung sieht darin eine Gefahr fuer Schoenheit, Vielfalt und Lebensqualitaet der Innenstadt und setzt entsprechend auf Restriktion."}],"id":"E122"},{"year":1981,"year_end":null,"date_precision":"year","title":"4377 Textilbeschaeftigte - Oelz startet Zopfbrot","summary":"Noch 1981 waren die Hersteller von Textilien in Dornbirn mit 4377 Beschaeftigten die wichtigsten Arbeitgeber der Stadt. Im selben Jahr startete die Firma Oelz mit der Produktion von Zopfbroten, die zu einem ihrer erfolgreichsten Sortimente werden sollte.","people":[],"places":["Dornbirn"],"category":"Industrie","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 10"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"4377 Textilbeschaeftigte - Oelz startet Zopfbrot","summary":"Noch 1981 waren die Hersteller von Textilien in Dornbirn mit 4377 Beschaeftigten die wichtigsten Arbeitgeber der Stadt. Im selben Jahr startete die Firma Oelz mit der Produktion von Zopfbroten, die zu einem ihrer erfolgreichsten Sortimente werden sollte."}],"id":"E123"},{"year":1981,"year_end":null,"date_precision":"year","title":"Gruendung des Spielbodens Dornbirn","summary":"Am 27. Februar 1981 fand die Gruendungsversammlung des Spielbodens im Kopfbau der ehemaligen Messehalle statt. Das ehemalige Messecafe wurde an Wise Koehlmeier vermietet, der dort eine Kunstgalerie betrieb. Mit dem Spielboden entwickelte sich eine reiche Vereinsszene: Aktion 3. Welt, Filmkulturklub, Forum Humanum, Jeunesse musicale, Jazzseminar, Kasperltheater, Literaturforum, Offenes Haus, Tanzforum und Triangel. Der Spielboden zaehlte rund 20.000 Besucher pro Jahr.","people":["Wise Koehlmeier","Ulrich Gabriel"],"places":["Dornbirn"],"category":"Kultur","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 100"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Gruendung des Spielbodens Dornbirn","summary":"Am 27. Februar 1981 fand die Gruendungsversammlung des Spielbodens im Kopfbau der ehemaligen Messehalle statt. Das ehemalige Messecafe wurde an Wise Koehlmeier vermietet, der dort eine Kunstgalerie betrieb. Mit dem Spielboden entwickelte sich eine reiche Vereinsszene: Aktion 3. Welt, Filmkulturklub, Forum Humanum, Jeunesse musicale, Jazzseminar, Kasperltheater, Literaturforum, Offenes Haus, Tanzforum und Triangel. Der Spielboden zaehlte rund 20.000 Besucher pro Jahr."}],"id":"E124"},{"year":1982,"year_end":null,"date_precision":"year","title":"Festival Brennnessel und 100-Wecker-Konzert","summary":"Im Jahr 1982 organisierte Guenther Sohm das Festival Brennnessel im alternativen Bereich. Im Herbst 1982 laeutete unter Spielboden-Obmann Ulrich Gabriel ein 100-Wecker-Konzert das Projekt Wecken und animieren ein. Durch eine breite Palette von Projekten sollten Schwellenaengste abgebaut werden.","people":["Guenther Sohm","Ulrich Gabriel"],"places":["Dornbirn"],"category":"Kultur","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 100"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Festival Brennnessel und 100-Wecker-Konzert","summary":"Im Jahr 1982 organisierte Guenther Sohm das Festival Brennnessel im alternativen Bereich. Im Herbst 1982 laeutete unter Spielboden-Obmann Ulrich Gabriel ein 100-Wecker-Konzert das Projekt Wecken und animieren ein. Durch eine breite Palette von Projekten sollten Schwellenaengste abgebaut werden."}],"id":"E125"},{"year":1982,"year_end":null,"date_precision":"year","title":"Forschungsinstitut Textilchemie - Ende Maschinenbau Ruesch","summary":"1982 wurde das Forschungsinstitut fuer Textilchemie und Textilphysik der Universitaet Innsbruck im HTL-Gebaeude Dornbirn gegruendet - die erste Hochschuleinrichtung Vorarlbergs dieser Art. Im selben Jahr endete bei den Ruesch-Werken der Maschinenbau wegen schlechter Ertragslage. An der Saegen wurde eine Webereihalle mit 90 Webmaschinen neu eingerichtet; F.M. Haemmerle war mit 2200 Beschaeftigten groesstes Textilunternehmen Oesterreichs.","people":["Thomas Bechtold"],"places":["Dornbirn","Hoechsterstrasse","Saegen"],"category":"Bildung","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 23"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Forschungsinstitut Textilchemie - Ende Maschinenbau Ruesch","summary":"1982 wurde das Forschungsinstitut fuer Textilchemie und Textilphysik der Universitaet Innsbruck im HTL-Gebaeude Dornbirn gegruendet - die erste Hochschuleinrichtung Vorarlbergs dieser Art. Im selben Jahr endete bei den Ruesch-Werken der Maschinenbau wegen schlechter Ertragslage. An der Saegen wurde eine Webereihalle mit 90 Webmaschinen neu eingerichtet; F.M. Haemmerle war mit 2200 Beschaeftigten groesstes Textilunternehmen Oesterreichs."}],"id":"E126"},{"year":1983,"year_end":null,"date_precision":"year","title":"Konkurs Herrburger & Rhomberg - Beginn des Niedergangs","summary":"1983 wurde mit dem Konkurs der Traditionsfirma Herrburger und Rhomberg die unaufhaltsame Talfahrt der Dornbirner Textilindustrie eingeleitet. Die Firma war 1795 gegruendet worden und galt als aelteste Textilfirma Vorarlbergs. Im selben Jahr trennte F.M. Haemmerle die Immobiliengeschaefte von der Textilbranche und unterstellte sie der Holding Unternehmensbeteiligungen AG. Bei Fussenegger Holzbau kam in dieser Zeit der Holzhandel hinzu.","people":["Herrburger","Rhomberg","Karl Bohle"],"places":["Dornbirn","Juchen"],"category":"Industrie","sources":["Matt: Geschichte Dornbirns","Fessler: Wirtschaften"],"page_hints":["Matt: Geschichte Dornbirns S. 96, 106","Fessler: Wirtschaften S. 11"],"alt_titles":["Konkurs Herrburger und Rhomberg"],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Konkurs Herrburger und Rhomberg","summary":"Im Jahr 1983 erfolgte der Konkurs des Traditionsunternehmens Herrburger und Rhomberg, der 1810 als mechanische Flachsspinnerei in Juchen gegruendet worden war und damit eine der ersten Fabriken in der Habsburgermonarchie war. Zu Jahresende 1983 musste Buergermeister Karl Bohle aus gesundheitlichen Gruenden sein Amt zurueckzulegen."},{"book":"Fessler: Wirtschaften","title":"Konkurs Herrburger & Rhomberg - Beginn des Niedergangs","summary":"1983 wurde mit dem Konkurs der Traditionsfirma Herrburger und Rhomberg die unaufhaltsame Talfahrt der Dornbirner Textilindustrie eingeleitet. Die Firma war 1795 gegruendet worden und galt als aelteste Textilfirma Vorarlbergs. Im selben Jahr trennte F.M. Haemmerle die Immobiliengeschaefte von der Textilbranche und unterstellte sie der Holding Unternehmensbeteiligungen AG. Bei Fussenegger Holzbau kam in dieser Zeit der Holzhandel hinzu."}],"id":"E127"},{"year":1983,"year_end":null,"date_precision":"year","title":"Noch 4.500 Arbeitsplaetze in der Dornbirner Textilindustrie","summary":"1983 zaehlte die Dornbirner Textilindustrie noch rund 4.500 Arbeitsplaetze. Dieser Wert dokumentiert das letzte Auflodern eines einst dominierenden Wirtschaftszweigs vor seinem fast vollstaendigen Verschwinden. In den folgenden Jahrzehnten schrumpfte die Beschaeftigung in der Textilbranche auf rund 100 Arbeitsplaetze. Die ehemaligen Textilareale wurden in Folge Schauplaetze einer der bedeutendsten Stadtumbauten Dornbirns.","people":[],"places":["Dornbirn"],"category":"Wirtschaft","sources":["Aberer: Stadtentwicklung"],"page_hints":["Aberer: Stadtentwicklung S. 19"],"alt_titles":[],"source_summaries":[{"book":"Aberer: Stadtentwicklung","title":"Noch 4.500 Arbeitsplaetze in der Dornbirner Textilindustrie","summary":"1983 zaehlte die Dornbirner Textilindustrie noch rund 4.500 Arbeitsplaetze. Dieser Wert dokumentiert das letzte Auflodern eines einst dominierenden Wirtschaftszweigs vor seinem fast vollstaendigen Verschwinden. In den folgenden Jahrzehnten schrumpfte die Beschaeftigung in der Textilbranche auf rund 100 Arbeitsplaetze. Die ehemaligen Textilareale wurden in Folge Schauplaetze einer der bedeutendsten Stadtumbauten Dornbirns."}],"id":"E128"},{"year":1983,"year_end":1984,"date_precision":"year_range","title":"Veredelung Fischbach veredelt 36,5 km2 Stoff","summary":"Im Geschaeftsjahr 1983/84 durchlief die Veredelungsabteilung Fischbach der F.M. Haemmerle die unvorstellbare Hoechstmenge von 36.547.000 Quadratmetern Stoff - also 36,5 km2, das entspricht etwa der gesamten besiedelten Flaeche Dornbirns. Es war ein letzter spektakulaerer Hoehepunkt vor dem rasanten Niedergang Ende der 1980er-Jahre.","people":[],"places":["Dornbirn","Fischbach"],"category":"Industrie","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 11"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Veredelung Fischbach veredelt 36,5 km2 Stoff","summary":"Im Geschaeftsjahr 1983/84 durchlief die Veredelungsabteilung Fischbach der F.M. Haemmerle die unvorstellbare Hoechstmenge von 36.547.000 Quadratmetern Stoff - also 36,5 km2, das entspricht etwa der gesamten besiedelten Flaeche Dornbirns. Es war ein letzter spektakulaerer Hoehepunkt vor dem rasanten Niedergang Ende der 1980er-Jahre."}],"id":"E129"},{"year":1984,"year_end":null,"date_precision":"year","title":"Letzter Gusstag Ruesch - Zumtobel in den USA","summary":"Am 27. Juni 1984 kam es zum letzten Gusstag der ehemaligen Ruesch-Werke. Die Giesserei hatte zuvor noch Kundengussauftraege erledigt, doch stellte man schliesslich auch hier den Betrieb ein. Zur Erinnerung an die ueber 150 Jahre alte Firma wurde eine Totenglocke geformt und gegossen, die heute in der inatura ausgestellt ist. Im selben Jahr fasste Zumtobel auf dem US-amerikanischen Markt Fuss. Auch das Bauunternehmen Fussenegger & Ruemmele erwarb die Muehlebuendt.","people":[],"places":["Dornbirn","Schmelzhuetten","Muehlebuendt"],"category":"Industrie","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 61"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Letzter Gusstag Ruesch - Zumtobel in den USA","summary":"Am 27. Juni 1984 kam es zum letzten Gusstag der ehemaligen Ruesch-Werke. Die Giesserei hatte zuvor noch Kundengussauftraege erledigt, doch stellte man schliesslich auch hier den Betrieb ein. Zur Erinnerung an die ueber 150 Jahre alte Firma wurde eine Totenglocke geformt und gegossen, die heute in der inatura ausgestellt ist. Im selben Jahr fasste Zumtobel auf dem US-amerikanischen Markt Fuss. Auch das Bauunternehmen Fussenegger & Ruemmele erwarb die Muehlebuendt."}],"id":"E130"},{"year":1984,"year_end":null,"date_precision":"year","title":"Rudolf Sohm wird Buergermeister","summary":"Am 19. Jaenner 1984 wurde der bisherige Vizebuergermeister Rudolf Sohm zum neuen Buergermeister von Dornbirn gewaehlt, D.I. Wolfgang Ruemmele zu seinem Stellvertreter. Sohm war vor der Wahl Exportleiter bei F.M. Haemmerle gewesen und trat das Amt unter der innerparteilichen Vorgabe an, die Stadtstrasse zu bauen. Am 2. Dezember 1984 erhielt der zurueckgetretene Vorgaenger Karl Bohle den Ehrenbuergerbrief.","people":["Rudolf Sohm","Wolfgang Ruemmele","Karl Bohle"],"places":["Dornbirn"],"category":"Politik","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 106"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Rudolf Sohm wird Buergermeister","summary":"Am 19. Jaenner 1984 wurde der bisherige Vizebuergermeister Rudolf Sohm zum neuen Buergermeister von Dornbirn gewaehlt, D.I. Wolfgang Ruemmele zu seinem Stellvertreter. Sohm war vor der Wahl Exportleiter bei F.M. Haemmerle gewesen und trat das Amt unter der innerparteilichen Vorgabe an, die Stadtstrasse zu bauen. Am 2. Dezember 1984 erhielt der zurueckgetretene Vorgaenger Karl Bohle den Ehrenbuergerbrief."}],"id":"E131"},{"year":1984,"year_end":null,"date_precision":"year","title":"Stilllegung der Rüsch-Werke","summary":"1984 erfolgt die Stilllegung der Rüsch-Werke am Industriekanal Müllerbach. Die Gießerei war jahrzehntelang das einzige nicht-textile Großunternehmen in der Stadt und kam in der deutschen Zeit in das Eigentum zweier großer Textilunternehmen. Nach erfolglosen Versuchen, im Areal ein Vorarlberger Industriemuseum zu entwickeln, wurden mehrere städtebauliche Studien erarbeitet, die später zur Nachnutzung als inatura führten.","people":[],"places":["Dornbirn","Müllerbach"],"category":"Industrie","sources":["Hämmerle: Innovation"],"page_hints":["Hämmerle: Innovation S. 20"],"alt_titles":[],"source_summaries":[{"book":"Hämmerle: Innovation","title":"Stilllegung der Rüsch-Werke","summary":"1984 erfolgt die Stilllegung der Rüsch-Werke am Industriekanal Müllerbach. Die Gießerei war jahrzehntelang das einzige nicht-textile Großunternehmen in der Stadt und kam in der deutschen Zeit in das Eigentum zweier großer Textilunternehmen. Nach erfolglosen Versuchen, im Areal ein Vorarlberger Industriemuseum zu entwickeln, wurden mehrere städtebauliche Studien erarbeitet, die später zur Nachnutzung als inatura führten."}],"id":"E132"},{"year":1985,"year_end":null,"date_precision":"year","title":"Offene Buergerliste Dornbirn als neue politische Kraft","summary":"Bei den Gemeinderatswahlen 1985 trat die Offene Buergerliste Dornbirn (OBGL) als neue politische Erscheinung an und erreichte drei Mandate. Spitzenkandidat war der Rechtsanwalt Dr. Guenter Hagen. Die OuVP unter Rudolf Sohm verlor zwei Mandate, hielt aber 22 von 36 Sitzen. Mitte der 1980er Jahre erfolgte die Ernennung eines eigenen Kulturstadtrates, D.I. Wolfgang Ruemmele. Der Konflikt um den Spielboden eskalierte.","people":["Rudolf Sohm","Guenter Hagen","Wolfgang Ruemmele"],"places":["Dornbirn"],"category":"Politik","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 100, 106-107"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Offene Buergerliste Dornbirn als neue politische Kraft","summary":"Bei den Gemeinderatswahlen 1985 trat die Offene Buergerliste Dornbirn (OBGL) als neue politische Erscheinung an und erreichte drei Mandate. Spitzenkandidat war der Rechtsanwalt Dr. Guenter Hagen. Die OuVP unter Rudolf Sohm verlor zwei Mandate, hielt aber 22 von 36 Sitzen. Mitte der 1980er Jahre erfolgte die Ernennung eines eigenen Kulturstadtrates, D.I. Wolfgang Ruemmele. Der Konflikt um den Spielboden eskalierte."}],"id":"E133"},{"year":1985,"year_end":null,"date_precision":"year","title":"Strickerei Maselli und Versuchsanstalt HTL","summary":"1985 wurde die Strickerei Maselli GmbH gegruendet, die aus dem Traditionsbetrieb Maeser hervorgegangen war. Im selben Jahr begann die Versuchsanstalt fuer Textil und Chemie ihre Arbeit in den Raeumlichkeiten der HTL Dornbirn. Erich Gasser wurde zum Textilveredler. Oelz erwarb das ge

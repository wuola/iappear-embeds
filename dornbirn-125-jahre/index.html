],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Heinrich Fussenegger uebernimmt J.M. Fussenegger allein","summary":"Ab 1904 leitete Heinrich Fussenegger das Unternehmen J.M. Fussenegger (Hausname Michles) im Wallenmahd allein. Er modernisierte die Maschinen und beschaeftigte 1913 bereits 130 Arbeiterinnen und Arbeiter. Das Unternehmen entwickelte sich zu einem fuehrenden Veredler von Stickereiwaren."}],"id":"E007"},{"year":1904,"year_end":null,"date_precision":"year","title":"Tod des Pionierfarmers Ferdinand Bohle in Colton/Washington","summary":"Ferdinand Bohle aus Dornbirn, ein Drechsler, der ab 1890 im Staat Washington eine 130 Hektar grosse Farm aufgebaut und seinen Bruder Josef zur Hilfe nachgeholt hatte, zieht sich an einer Blechdose eine Schnittwunde zu. Ohne ärztliche Versorgung entwickelt sich eine Blutvergiftung, an der er am 1. Juni 1904 stirbt. Die Familie kapituliert kurz darauf vor der Pionierarbeit – ein typisches Schicksal später Auswanderer in der Wildnis.","people":["Ferdinand Bohle","Josef Bohle"],"places":["Colton","Dornbirn"],"category":"Migration","sources":["Pichler: Auswanderer"],"page_hints":["Pichler: Auswanderer S. 42"],"alt_titles":[],"source_summaries":[{"book":"Pichler: Auswanderer","title":"Tod des Pionierfarmers Ferdinand Bohle in Colton/Washington","summary":"Ferdinand Bohle aus Dornbirn, ein Drechsler, der ab 1890 im Staat Washington eine 130 Hektar grosse Farm aufgebaut und seinen Bruder Josef zur Hilfe nachgeholt hatte, zieht sich an einer Blechdose eine Schnittwunde zu. Ohne ärztliche Versorgung entwickelt sich eine Blutvergiftung, an der er am 1. Juni 1904 stirbt. Die Familie kapituliert kurz darauf vor der Pionierarbeit – ein typisches Schicksal später Auswanderer in der Wildnis."}],"id":"E008"},{"year":1905,"year_end":1910,"date_precision":"year_range","title":"Bau des Rheintal-Binnenkanals zur Entwässerung des Rieds","summary":"Zwischen 1905 und 1910 wurde der Rheintal-Binnenkanal angelegt. Gemeinsam mit dem Rheindurchstich (1900) schuf er die wichtigsten Voraussetzungen für eine effiziente Entwässerung des Dornbirner Rieds. Die Maßnahme ermöglichte neue Wiesen und Weiden für die aufstrebende Viehzucht und neuen Siedlungsraum für die expandierende Industrie. Zugleich gingen wertvolle Streuwiesen-Lebensräume verloren.","people":[],"places":["Dornbirn","Rheintal"],"category":"Stadtentwicklung","sources":["Friebe: Naturraum"],"page_hints":["Friebe: Naturraum S. 80"],"alt_titles":[],"source_summaries":[{"book":"Friebe: Naturraum","title":"Bau des Rheintal-Binnenkanals zur Entwässerung des Rieds","summary":"Zwischen 1905 und 1910 wurde der Rheintal-Binnenkanal angelegt. Gemeinsam mit dem Rheindurchstich (1900) schuf er die wichtigsten Voraussetzungen für eine effiziente Entwässerung des Dornbirner Rieds. Die Maßnahme ermöglichte neue Wiesen und Weiden für die aufstrebende Viehzucht und neuen Siedlungsraum für die expandierende Industrie. Zugleich gingen wertvolle Streuwiesen-Lebensräume verloren."}],"id":"E009"},{"year":1905,"year_end":null,"date_precision":"year","title":"Konkurs der Firma Josef Andrae Winder","summary":"1905 ging das Textilunternehmen Josef Andrae Winder in der Parzelle Boden in Konkurs. Nach dem Brand von 1902 und schlechtem Geschaeftsgang konnte sich die Firma nicht halten. 1907 uebernahm die Vereinigte Maschinenfabrik J. Ig. Ruesch-Ganahl die Anlagen mit den zwei betriebsfaehigen Turbinen und nutzte das Erdgeschoss als Kraftwerk fuer das Fabriksgelaende Schmelzhuetten.","people":["Josef Andrae Winder","J. Ig. Ruesch-Ganahl"],"places":["Dornbirn","Parzelle Boden"],"category":"Industrie","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 40"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Konkurs der Firma Josef Andrae Winder","summary":"1905 ging das Textilunternehmen Josef Andrae Winder in der Parzelle Boden in Konkurs. Nach dem Brand von 1902 und schlechtem Geschaeftsgang konnte sich die Firma nicht halten. 1907 uebernahm die Vereinigte Maschinenfabrik J. Ig. Ruesch-Ganahl die Anlagen mit den zwei betriebsfaehigen Turbinen und nutzte das Erdgeschoss als Kraftwerk fuer das Fabriksgelaende Schmelzhuetten."}],"id":"E010"},{"year":1905,"year_end":null,"date_precision":"year","title":"Rückwanderung der Familie Bohle aus Washington nach Dornbirn","summary":"Nach dem Tod von Ferdinand Bohle 1904 geben Bruder Josef Bohle und seine Frau Wilhelmine Böhler die Farm in Colton/Washington auf und kehren mit ihren in Amerika geborenen Kindern Helene, Bruno, Gertrud und Erwin nach Dornbirn zurück. Vor der Heimreise lassen sie die Kinder in Moscow/Idaho fotografieren. Das Beispiel zeigt, dass nicht alle Dornbirner Auswanderer in der Neuen Welt Fuß fassten – Rückwanderung war ein realer Ausweg.","people":["Josef Bohle","Wilhelmine Böhler"],"places":["Colton","Moscow","Dornbirn"],"category":"Migration","sources":["Pichler: Auswanderer"],"page_hints":["Pichler: Auswanderer S. 43"],"alt_titles":[],"source_summaries":[{"book":"Pichler: Auswanderer","title":"Rückwanderung der Familie Bohle aus Washington nach Dornbirn","summary":"Nach dem Tod von Ferdinand Bohle 1904 geben Bruder Josef Bohle und seine Frau Wilhelmine Böhler die Farm in Colton/Washington auf und kehren mit ihren in Amerika geborenen Kindern Helene, Bruno, Gertrud und Erwin nach Dornbirn zurück. Vor der Heimreise lassen sie die Kinder in Moscow/Idaho fotografieren. Das Beispiel zeigt, dass nicht alle Dornbirner Auswanderer in der Neuen Welt Fuß fassten – Rückwanderung war ein realer Ausweg."}],"id":"E011"},{"year":1907,"year_end":null,"date_precision":"year","title":"Arbeitersiedlung Buendlitten und Erwerb des Eulental-Betriebs","summary":"Die Firma F.M. Haemmerle erwarb das Industrieareal Eulental von der Firma Josef Andre Winder. Im selben Jahr wurde von Otto Mallaun die Arbeitersiedlung Buendlitten der Firma F.M. Haemmerle geplant. Die Siedlung wies fortschrittliche Grundrisse mit Kueche, Wohnraum, Schlafraum und Schuppen mit Abort auf und galt als lokale Abwandlung des englischen Reihenhaustypus. Karl Drexel wurde in die Dornbirner Gemeindevertretung gewaehlt, in den Reichsrat zog er ebenfalls 1907 ein.","people":["Otto Mallaun","Viktor Haemmerle","Karl Drexel"],"places":["Buendlitten","Eulental"],"category":"Industrie","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 45, 62"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Arbeitersiedlung Buendlitten und Erwerb des Eulental-Betriebs","summary":"Die Firma F.M. Haemmerle erwarb das Industrieareal Eulental von der Firma Josef Andre Winder. Im selben Jahr wurde von Otto Mallaun die Arbeitersiedlung Buendlitten der Firma F.M. Haemmerle geplant. Die Siedlung wies fortschrittliche Grundrisse mit Kueche, Wohnraum, Schlafraum und Schuppen mit Abort auf und galt als lokale Abwandlung des englischen Reihenhaustypus. Karl Drexel wurde in die Dornbirner Gemeindevertretung gewaehlt, in den Reichsrat zog er ebenfalls 1907 ein."}],"id":"E012"},{"year":1907,"year_end":null,"date_precision":"year","title":"Ruesch-Ganahl uebernimmt Brandstaette Winder am Boden","summary":"1907 uebernahm die Vereinigte Maschinenfabrik J. Ig. Ruesch-Ganahl die Brandstaette der Spinnerei Winder am Boden samt den zwei betriebsfaehigen Turbinen. Das Erdgeschoss wurde zum E-Werk umgebaut, das Fabriksgelaende Schmelzhuetten mit Strom versorgte. Zusaetzlich wurde eine Versuchsstation fuer Turbinen und Pumpen eingerichtet.","people":["Josef Ignaz Ruesch"],"places":["Dornbirn","Parzelle Boden","Schmelzhuetten"],"category":"Industrie","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 41"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Ruesch-Ganahl uebernimmt Brandstaette Winder am Boden","summary":"1907 uebernahm die Vereinigte Maschinenfabrik J. Ig. Ruesch-Ganahl die Brandstaette der Spinnerei Winder am Boden samt den zwei betriebsfaehigen Turbinen. Das Erdgeschoss wurde zum E-Werk umgebaut, das Fabriksgelaende Schmelzhuetten mit Strom versorgte. Zusaetzlich wurde eine Versuchsstation fuer Turbinen und Pumpen eingerichtet."}],"id":"E013"},{"year":1908,"year_end":1910,"date_precision":"year_range","title":"Bau der Villa Viktor Haemmerle","summary":"Viktor Haemmerle liess sich 1908 bis 1910 eine grosse Villa oberhalb der Villa seines Bruders Guntram an der Dr.-Waibel-Strasse bauen. Damit setzte sich die Entwicklung des Villenviertels zwischen Oberdorf und Markt fort, das anstelle der ehemaligen Weingaerten entstand. Die Bauten waren von grosszuegig angelegten Parks umgeben.","people":["Viktor Haemmerle"],"places":["Markt","Dr.-Waibel-Strasse"],"category":"Bauten","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 53"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Bau der Villa Viktor Haemmerle","summary":"Viktor Haemmerle liess sich 1908 bis 1910 eine grosse Villa oberhalb der Villa seines Bruders Guntram an der Dr.-Waibel-Strasse bauen. Damit setzte sich die Entwicklung des Villenviertels zwischen Oberdorf und Markt fort, das anstelle der ehemaligen Weingaerten entstand. Die Bauten waren von grosszuegig angelegten Parks umgeben."}],"id":"E014"},{"year":1908,"year_end":null,"date_precision":"year","title":"Tod von Buergermeister Johann Georg Waibel","summary":"Im Jahr 1908 starb der langjaehrige Buergermeister Dr. Johann Georg Waibel (1828-1908). Waibel war seit 1869 ununterbrochen Buergermeister, gehoerte dem Landtag seit 1870 und war 1878 bis 1897 Reichsratsmitglied. Unter ihm wurde das Spital ausgebaut, das Kraftwerk Ebensand errichtet, die Elektrische Bahn Dornbirn-Lustenau gebaut und das Wasserwerk vorbereitet. Im selben Jahr wurde das Konstitutionell katholische Buergerkasino in die Christlichsoziale Partei von Dornbirn umbenannt.","people":["Johann Georg Waibel"],"places":["Dornbirn"],"category":"Persönlichkeit","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 56-59"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Tod von Buergermeister Johann Georg Waibel","summary":"Im Jahr 1908 starb der langjaehrige Buergermeister Dr. Johann Georg Waibel (1828-1908). Waibel war seit 1869 ununterbrochen Buergermeister, gehoerte dem Landtag seit 1870 und war 1878 bis 1897 Reichsratsmitglied. Unter ihm wurde das Spital ausgebaut, das Kraftwerk Ebensand errichtet, die Elektrische Bahn Dornbirn-Lustenau gebaut und das Wasserwerk vorbereitet. Im selben Jahr wurde das Konstitutionell katholische Buergerkasino in die Christlichsoziale Partei von Dornbirn umbenannt."}],"id":"E015"},{"year":1909,"year_end":null,"date_precision":"year","title":"Alfons J. Rhomberg gibt US-Spirituosenhandel auf, Rückkehr nach Götzis","summary":"Die Prohibitions-Gesetzgebung in Iowa und bundesweit setzt Dornbirner Schnapshändler in Dubuque massiv unter Druck. Alfons J. Rhomberg (Jahrgang 1872), Mitinhaber der Firma 'Rhomberg Bros. Co, Distillers and Wholesale Liquor Dealers', verlässt die USA mit Frau Gebhardine Kopf und Sohn Armin und siedelt sich in Götzis an. Bruder Franz Martin sattelt vor Ort auf das Pelz- und Ledergeschäft 'Rhomberg Furs' um.","people":["Alfons J. Rhomberg","Franz Martin Rhomberg","Gebhardine Kopf"],"places":["Dubuque","Götzis","Dornbirn"],"category":"Wirtschaft","sources":["Pichler: Auswanderer"],"page_hints":["Pichler: Auswanderer S. 29-30"],"alt_titles":[],"source_summaries":[{"book":"Pichler: Auswanderer","title":"Alfons J. Rhomberg gibt US-Spirituosenhandel auf, Rückkehr nach Götzis","summary":"Die Prohibitions-Gesetzgebung in Iowa und bundesweit setzt Dornbirner Schnapshändler in Dubuque massiv unter Druck. Alfons J. Rhomberg (Jahrgang 1872), Mitinhaber der Firma 'Rhomberg Bros. Co, Distillers and Wholesale Liquor Dealers', verlässt die USA mit Frau Gebhardine Kopf und Sohn Armin und siedelt sich in Götzis an. Bruder Franz Martin sattelt vor Ort auf das Pelz- und Ledergeschäft 'Rhomberg Furs' um."}],"id":"E016"},{"year":1909,"year_end":null,"date_precision":"year","title":"Fusion Ruesch mit Ganahl zur Aktiengesellschaft","summary":"Einer Krise zu Beginn des 20. Jahrhunderts begegnete die Maschinenfabrik Ruesch 1909 durch Fusionierung mit der Firma Ganahl in Feldkirch und durch Umwandlung in eine Aktiengesellschaft. Das Unternehmen baute Kraftwerksanlagen samt Wasserfassungen, Rohrleitungen, Regulierungen und Turbinen in der gesamten Monarchie.","people":["Josef Ignaz Ruesch","Ganahl"],"places":["Dornbirn","Feldkirch"],"category":"Industrie","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 60"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Fusion Ruesch mit Ganahl zur Aktiengesellschaft","summary":"Einer Krise zu Beginn des 20. Jahrhunderts begegnete die Maschinenfabrik Ruesch 1909 durch Fusionierung mit der Firma Ganahl in Feldkirch und durch Umwandlung in eine Aktiengesellschaft. Das Unternehmen baute Kraftwerksanlagen samt Wasserfassungen, Rohrleitungen, Regulierungen und Turbinen in der gesamten Monarchie."}],"id":"E017"},{"year":1909,"year_end":null,"date_precision":"year","title":"Neubau des Alpriesewegs","summary":"Mit dem Bau eines neuen Alpriesewegs vom Guetle bis zur Rappenlochbruecke begann eine systematische Erschliessung der Berggebiete fuer den Holztransport. Da die alten Wege oft grosse Gegensteigungen hatten, wurden in den folgenden Jahren neue Wegnetze ausgebaut, um die Forstnutzung zu erleichtern.","people":[],"places":["Guetle","Rappenloch"],"category":"Verkehr","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 51"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Neubau des Alpriesewegs","summary":"Mit dem Bau eines neuen Alpriesewegs vom Guetle bis zur Rappenlochbruecke begann eine systematische Erschliessung der Berggebiete fuer den Holztransport. Da die alten Wege oft grosse Gegensteigungen hatten, wurden in den folgenden Jahren neue Wegnetze ausgebaut, um die Forstnutzung zu erleichtern."}],"id":"E018"},{"year":1909,"year_end":null,"date_precision":"year","title":"Tod des Brigadegenerals Josef A. Bobleter in New Ulm/Minnesota","summary":"Josef Anton Bobleter (* 1846 Dornbirn-Haselstauden, Sohn des 1853 nach Dubuque ausgewanderten Malers Johann Bobleter) stirbt am 2. Juli 1909. Vom mittellosen Hirtenbub hatte er es zum Bankdirektor, Zeitungsherausgeber, Finanzminister (Schatzmeister) des Staates Minnesota und vor allem zum Brigadegeneral der von ihm aufgebauten Nationalgarde von Minnesota gebracht. Die Stadt New Ulm erklärt seinen Begräbnistag zum allgemeinen Trauertag mit geschlossenen Geschäften – eine seltene Ehre.","people":["Josef Anton Bobleter","Johann Bobleter"],"places":["New Ulm","Haselstauden","Dubuque"],"category":"Persönlichkeit","sources":["Pichler: Auswanderer"],"page_hints":["Pichler: Auswanderer S. 56-57"],"alt_titles":[],"source_summaries":[{"book":"Pichler: Auswanderer","title":"Tod des Brigadegenerals Josef A. Bobleter in New Ulm/Minnesota","summary":"Josef Anton Bobleter (* 1846 Dornbirn-Haselstauden, Sohn des 1853 nach Dubuque ausgewanderten Malers Johann Bobleter) stirbt am 2. Juli 1909. Vom mittellosen Hirtenbub hatte er es zum Bankdirektor, Zeitungsherausgeber, Finanzminister (Schatzmeister) des Staates Minnesota und vor allem zum Brigadegeneral der von ihm aufgebauten Nationalgarde von Minnesota gebracht. Die Stadt New Ulm erklärt seinen Begräbnistag zum allgemeinen Trauertag mit geschlossenen Geschäften – eine seltene Ehre."}],"id":"E019"},{"year":1910,"year_end":null,"date_precision":"year","title":"Giesserstreik bei Ruesch-Ganahl - laengster Streik Vorarlbergs","summary":"Der Streik der Giesser im Jahre 1910 bei Ruesch-Ganahl im Kampf um hoehere Loehne dauerte 13 Wochen und war der laengste Streik in Vorarlbergs Geschichte. Er zeigt die soziale Spannung in der industriellen Schwerarbeit der Eisengiesserei zur Hochzeit der Dornbirner Industrie.","people":["Josef Ignaz Ruesch"],"places":["Dornbirn","Schmelzhuetten"],"category":"Soziales","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 60"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Giesserstreik bei Ruesch-Ganahl - laengster Streik Vorarlbergs","summary":"Der Streik der Giesser im Jahre 1910 bei Ruesch-Ganahl im Kampf um hoehere Loehne dauerte 13 Wochen und war der laengste Streik in Vorarlbergs Geschichte. Er zeigt die soziale Spannung in der industriellen Schwerarbeit der Eisengiesserei zur Hochzeit der Dornbirner Industrie."}],"id":"E020"},{"year":1910,"year_end":null,"date_precision":"year","title":"Grosser Streik der Eisengiesser in den Ruschwerken","summary":"Vom 25. Juli bis 12. Oktober 1910 fand in den Vereinigten Maschinenfabriken Ruesch-Ganahl A.-G. ein 91 Tage andauernder Streik der Eisengiesser statt. Anlass waren gescheiterte Tarifverhandlungen, der Arbeitskampf entwickelte sich zur Machtprobe zwischen Arbeitern und Industriellen, die in ganz Vorarlberg beobachtet wurde. Die Arbeiter erreichten die Wiedereinstellung aller Streikenden, eine 10-prozentige Lohnerhoehung und Verbesserungen der Heizung und Lueftung in der Giessereihalle. Wenige Tage spaeter legten auch die Dornbirner Holzarbeiter fuer elf Wochen die Arbeit nieder.","people":[],"places":["Dornbirn","Ruschwerke"],"category":"Wirtschaft","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 67-68"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Grosser Streik der Eisengiesser in den Ruschwerken","summary":"Vom 25. Juli bis 12. Oktober 1910 fand in den Vereinigten Maschinenfabriken Ruesch-Ganahl A.-G. ein 91 Tage andauernder Streik der Eisengiesser statt. Anlass waren gescheiterte Tarifverhandlungen, der Arbeitskampf entwickelte sich zur Machtprobe zwischen Arbeitern und Industriellen, die in ganz Vorarlberg beobachtet wurde. Die Arbeiter erreichten die Wiedereinstellung aller Streikenden, eine 10-prozentige Lohnerhoehung und Verbesserungen der Heizung und Lueftung in der Giessereihalle. Wenige Tage spaeter legten auch die Dornbirner Holzarbeiter fuer elf Wochen die Arbeit nieder."}],"id":"E021"},{"year":1910,"year_end":null,"date_precision":"year","title":"Politischer Machtwechsel: Christlich-Soziale uebernehmen Dornbirn","summary":"Bei den Gemeinderatswahlen am 6. April 1910 errangen die Christlich-Sozialen unter Engelbert Luger einen ueberzeugenden Sieg und beendeten die ueber 40-jaehrige Dominanz der liberalen Partei. Mit 28 von 42 Sitzen wurde Engelbert Luger neuer Buergermeister, die Sozialdemokraten zogen erstmals mit vier Mandaten ein. Die Volkszaehlung ergab 16.219 Einwohner, das Denkmal des verstorbenen Buergermeisters Dr. Johann Georg Waibel wurde enthuellt, und Kirchenchor St. Sebastian im Oberdorf wurde gegruendet. Damit begann eine bis heute andauernde Vorherrschaft der Konservativen in Dornbirn.","people":["Engelbert Luger","Hermann Leibfried"],"places":["Dornbirn"],"category":"Politik","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 66-67"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Politischer Machtwechsel: Christlich-Soziale uebernehmen Dornbirn","summary":"Bei den Gemeinderatswahlen am 6. April 1910 errangen die Christlich-Sozialen unter Engelbert Luger einen ueberzeugenden Sieg und beendeten die ueber 40-jaehrige Dominanz der liberalen Partei. Mit 28 von 42 Sitzen wurde Engelbert Luger neuer Buergermeister, die Sozialdemokraten zogen erstmals mit vier Mandaten ein. Die Volkszaehlung ergab 16.219 Einwohner, das Denkmal des verstorbenen Buergermeisters Dr. Johann Georg Waibel wurde enthuellt, und Kirchenchor St. Sebastian im Oberdorf wurde gegruendet. Damit begann eine bis heute andauernde Vorherrschaft der Konservativen in Dornbirn."}],"id":"E022"},{"year":1913,"year_end":1914,"date_precision":"year_range","title":"Ignaz Ruesch tritt zurueck - Firma in Schwierigkeiten","summary":"1913/14 trat Ignaz Ruesch von der Geschaeftsleitung der Ruesch-Ganahl AG zurueck. Die Firma geriet in finanzielle Schwierigkeiten. Den Ersten Weltkrieg ueberlebte sie jedoch als Ruestungsbetrieb: Unter Militaeraufsicht wurden Granaten und Schrapnellkoepfe erzeugt.","people":["Ignaz Ruesch"],"places":["Dornbirn"],"category":"Industrie","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 60"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Ignaz Ruesch tritt zurueck - Firma in Schwierigkeiten","summary":"1913/14 trat Ignaz Ruesch von der Geschaeftsleitung der Ruesch-Ganahl AG zurueck. Die Firma geriet in finanzielle Schwierigkeiten. Den Ersten Weltkrieg ueberlebte sie jedoch als Ruestungsbetrieb: Unter Militaeraufsicht wurden Granaten und Schrapnellkoepfe erzeugt."}],"id":"E023"},{"year":1914,"year_end":1918,"date_precision":"year_range","title":"Erster Weltkrieg fordert 596 Gefallene und Vermisste","summary":"Im Ersten Weltkrieg verlor Dornbirn rund 596 Soldaten als Gefallene und Vermisste. Zudem starben durch die katastrophale Lebensmittelversorgung viele weitere Dornbirner. Ab Fruehjahr 1915 wurden die Lebensmittel spuerbar knapp, ab 1917 sprach man vom Zusammenbruch der Ernaehrungswirtschaft. Die Stadt richtete Wirtschaftsraete, Notreservespitaeler und stadteigene Frueechteverwertung ein. 1918 wurden die Schulferien vorzeitig ausgerufen, damit die Schulkinder den Hunger durch laenger Schlafen besser aushielten.","people":[],"places":["Dornbirn"],"category":"Krieg","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 69-71"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Erster Weltkrieg fordert 596 Gefallene und Vermisste","summary":"Im Ersten Weltkrieg verlor Dornbirn rund 596 Soldaten als Gefallene und Vermisste. Zudem starben durch die katastrophale Lebensmittelversorgung viele weitere Dornbirner. Ab Fruehjahr 1915 wurden die Lebensmittel spuerbar knapp, ab 1917 sprach man vom Zusammenbruch der Ernaehrungswirtschaft. Die Stadt richtete Wirtschaftsraete, Notreservespitaeler und stadteigene Frueechteverwertung ein. 1918 wurden die Schulferien vorzeitig ausgerufen, damit die Schulkinder den Hunger durch laenger Schlafen besser aushielten."}],"id":"E024"},{"year":1914,"year_end":1918,"date_precision":"year_range","title":"Ruesch-Ganahl als Ruestungsbetrieb im Ersten Weltkrieg","summary":"Im Ersten Weltkrieg ueberlebte die in Schwierigkeiten geratene Maschinenfabrik Ruesch-Ganahl als Ruestungsbetrieb. Unter Militaeraufsicht wurden Granaten und Schrapnellkoepfe erzeugt. Damit konnte das Unternehmen die Kriegsjahre wirtschaftlich ueberbruecken.","people":[],"places":["Dornbirn"],"category":"Krieg","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 60"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Ruesch-Ganahl als Ruestungsbetrieb im Ersten Weltkrieg","summary":"Im Ersten Weltkrieg ueberlebte die in Schwierigkeiten geratene Maschinenfabrik Ruesch-Ganahl als Ruestungsbetrieb. Unter Militaeraufsicht wurden Granaten und Schrapnellkoepfe erzeugt. Damit konnte das Unternehmen die Kriegsjahre wirtschaftlich ueberbruecken."}],"id":"E025"},{"year":1914,"year_end":null,"date_precision":"year","title":"Spatenstich Boedelestrasse und Notreservespital","summary":"Am 29. Dezember 1914 erfolgte der Spatenstich fuer das erste Teilstueck der Boedelestrasse nach Watzenegg. Der Strassenbau diente als Notstandsprojekt zur Arbeitsbeschaffung und sollte den Wintersportplatz Boedele erschliessen, spaeter wurden auch russische Kriegsgefangene eingesetzt. Ebenfalls im Dezember 1914 wurde im Maedchenheim der Textilfirma F.M. Haemmerle eine vom Roten Kreuz eingerichtete Pflegestelle mit achtzig Betten fuer verwundete Soldaten eroeffnet.","people":[],"places":["Boedele","Watzenegg"],"category":"Bauten","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 68-69"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Spatenstich Boedelestrasse und Notreservespital","summary":"Am 29. Dezember 1914 erfolgte der Spatenstich fuer das erste Teilstueck der Boedelestrasse nach Watzenegg. Der Strassenbau diente als Notstandsprojekt zur Arbeitsbeschaffung und sollte den Wintersportplatz Boedele erschliessen, spaeter wurden auch russische Kriegsgefangene eingesetzt. Ebenfalls im Dezember 1914 wurde im Maedchenheim der Textilfirma F.M. Haemmerle eine vom Roten Kreuz eingerichtete Pflegestelle mit achtzig Betten fuer verwundete Soldaten eroeffnet."}],"id":"E026"},{"year":1914,"year_end":null,"date_precision":"year","title":"Tod des Kirchenmalers Johann Karl Bröll in Dubuque","summary":"Johann Karl Bröll (* 1879 Dornbirn), Gründer und Chef der 'Dubuque Statuary and Ornamental Company', stirbt am 12. März 1914 in Clinton bei Dubuque. Seine Firma hatte zahlreiche Kirchen unterschiedlicher Konfessionen in Iowa mit Statuen und Fresken ausgestattet. Vor seiner Auswanderung hatte Bröll an den Akademien von Wien und München studiert – ein Beispiel für die zweite Auswanderergeneration, die das amerikanische Kunsthandwerk prägte.","people":["Johann Karl Bröll"],"places":["Dubuque","Clinton","Dornbirn"],"category":"Kultur","sources":["Pichler: Auswanderer"],"page_hints":["Pichler: Auswanderer S. 38"],"alt_titles":[],"source_summaries":[{"book":"Pichler: Auswanderer","title":"Tod des Kirchenmalers Johann Karl Bröll in Dubuque","summary":"Johann Karl Bröll (* 1879 Dornbirn), Gründer und Chef der 'Dubuque Statuary and Ornamental Company', stirbt am 12. März 1914 in Clinton bei Dubuque. Seine Firma hatte zahlreiche Kirchen unterschiedlicher Konfessionen in Iowa mit Statuen und Fresken ausgestattet. Vor seiner Auswanderung hatte Bröll an den Akademien von Wien und München studiert – ein Beispiel für die zweite Auswanderergeneration, die das amerikanische Kunsthandwerk prägte."}],"id":"E027"},{"year":1916,"year_end":null,"date_precision":"year","title":"Aufloesung des Notreservespitals","summary":"Am 15. November 1916 wurde das Notreservespital in der Realschule, dem Arbeiterheim und dem Waisenhaus mit rund 300 Verwundeten wieder aufgeloest. Offiziell wurden keine Gruende genannt, der eklatante Mangel an einfachsten Gegenstaenden wie Kissen, Matratzen, Betten und Waschschuesseln duerfte aber wesentlich dazu beigetragen haben.","people":[],"places":["Dornbirn"],"category":"Krieg","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 69"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Aufloesung des Notreservespitals","summary":"Am 15. November 1916 wurde das Notreservespital in der Realschule, dem Arbeiterheim und dem Waisenhaus mit rund 300 Verwundeten wieder aufgeloest. Offiziell wurden keine Gruende genannt, der eklatante Mangel an einfachsten Gegenstaenden wie Kissen, Matratzen, Betten und Waschschuesseln duerfte aber wesentlich dazu beigetragen haben."}],"id":"E028"},{"year":1917,"year_end":1919,"date_precision":"year_range","title":"Rancher Martin Wehinger wegen 'Verhetzung' in Montana verurteilt","summary":"Im Ersten Weltkrieg gerät der Rancher Martin Wehinger (* 1860 Dornbirn) in Miles City/Montana ins Visier eines patriotischen Staatsanwalts, nachdem er Frächtern empfohlen hatte, deutsche Zeitungen zu lesen, um die Wahrheit über den Krieg zu erfahren. Er wird wegen 'Verhetzung' zu drei Jahren Haft verurteilt und sitzt 18 Monate ab. Zu Weihnachten 1919 kommt er als kranker, schwacher Mann heim. Wenige Monate später erliegt er am 12. April 1920 einem Beckenbruch nach einem Hufschlag.","people":["Martin Wehinger","Michael Wehinger"],"places":["Miles City","Dornbirn"],"category":"Krieg","sources":["Pichler: Auswanderer"],"page_hints":["Pichler: Auswanderer S. 42"],"alt_titles":[],"source_summaries":[{"book":"Pichler: Auswanderer","title":"Rancher Martin Wehinger wegen 'Verhetzung' in Montana verurteilt","summary":"Im Ersten Weltkrieg gerät der Rancher Martin Wehinger (* 1860 Dornbirn) in Miles City/Montana ins Visier eines patriotischen Staatsanwalts, nachdem er Frächtern empfohlen hatte, deutsche Zeitungen zu lesen, um die Wahrheit über den Krieg zu erfahren. Er wird wegen 'Verhetzung' zu drei Jahren Haft verurteilt und sitzt 18 Monate ab. Zu Weihnachten 1919 kommt er als kranker, schwacher Mann heim. Wenige Monate später erliegt er am 12. April 1920 einem Beckenbruch nach einem Hufschlag."}],"id":"E029"},{"year":1919,"year_end":null,"date_precision":"year","title":"Viehzug-Beschlagnahme und erste Wahl einer Frau","summary":"An einem Sonntag im Februar 1919 stuermten hunderte Dornbirner zum Bahnhof und beschlagnahmten einen mit Vorarlberger Vieh beladenen Gueterzug, der fuer Innerouml;sterreich bestimmt war. Die Tiere wurden in die staedtischen Markthallen gefuehrt. Bei der folgenden Kundgebung auf dem Marktplatz versammelten sich rund 4.000 Menschen. Im Mai 1919 fand erstmals eine Gemeindevertretungswahl unter allgemeinem Frauenwahlrecht statt, gewaehlt wurde mit Fani Maetzler die erste Frau in die Gemeindevertretung (SPOuml;).","people":["Fani Maetzler","Anton Linder"],"places":["Dornbirn","Bahnhof Dornbirn","Marktplatz"],"category":"Politik","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 70-71"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Viehzug-Beschlagnahme und erste Wahl einer Frau","summary":"An einem Sonntag im Februar 1919 stuermten hunderte Dornbirner zum Bahnhof und beschlagnahmten einen mit Vorarlberger Vieh beladenen Gueterzug, der fuer Innerouml;sterreich bestimmt war. Die Tiere wurden in die staedtischen Markthallen gefuehrt. Bei der folgenden Kundgebung auf dem Marktplatz versammelten sich rund 4.000 Menschen. Im Mai 1919 fand erstmals eine Gemeindevertretungswahl unter allgemeinem Frauenwahlrecht statt, gewaehlt wurde mit Fani Maetzler die erste Frau in die Gemeindevertretung (SPOuml;)."}],"id":"E030"},{"year":1920,"year_end":null,"date_precision":"year","title":"'Ölfund' auf Rhomberg Hill in Carrollton/Missouri sorgt für Furore","summary":"Eine lokale Zeitung in Carrollton/Missouri verbreitet 1920 die Meldung, auf dem 'Rhomberg Hill' – benannt nach dem aus Dornbirn ausgewanderten Brauer Hieronimus Rhomberg (* 1832) – sei Öl gefunden worden. Die Nachricht macht in ganz Amerika die Runde. In Wirklichkeit war jemandem ein Fass Öl ausgeronnen; der Wunsch wurde zum Vater einer kurzlebigen Ölquellen-Hoffnung. Eine kuriose Episode der transatlantischen Dornbirner Spurensuche.","people":["Hieronimus Rhomberg"],"places":["Carrollton","Dornbirn"],"category":"Wirtschaft","sources":["Pichler: Auswanderer"],"page_hints":["Pichler: Auswanderer S. 30"],"alt_titles":[],"source_summaries":[{"book":"Pichler: Auswanderer","title":"'Ölfund' auf Rhomberg Hill in Carrollton/Missouri sorgt für Furore","summary":"Eine lokale Zeitung in Carrollton/Missouri verbreitet 1920 die Meldung, auf dem 'Rhomberg Hill' – benannt nach dem aus Dornbirn ausgewanderten Brauer Hieronimus Rhomberg (* 1832) – sei Öl gefunden worden. Die Nachricht macht in ganz Amerika die Runde. In Wirklichkeit war jemandem ein Fass Öl ausgeronnen; der Wunsch wurde zum Vater einer kurzlebigen Ölquellen-Hoffnung. Eine kuriose Episode der transatlantischen Dornbirner Spurensuche."}],"id":"E031"},{"year":1921,"year_end":1927,"date_precision":"year_range","title":"Bau der Ebniterstrasse","summary":"Die Ebniterstrasse wurde zwischen 1921 und 1927 als grosses Beschaeftigungsprojekt mit Hilfe der Arbeitslosenfuersorge gebaut. Sie erschloss das hochgelegene Bergdorf Ebnit und ermoeglichte ueber die Strassen auch den Transport von Wald- und Alpenprodukten ins Rheintal. Die hohe Schuldenlast aus dem Strassenbau und eine Brandkatastrophe fuehrten 1932 zum Anschluss Ebnits an Dornbirn.","people":[],"places":["Ebnit"],"category":"Verkehr","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 73"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Bau der Ebniterstrasse","summary":"Die Ebniterstrasse wurde zwischen 1921 und 1927 als grosses Beschaeftigungsprojekt mit Hilfe der Arbeitslosenfuersorge gebaut. Sie erschloss das hochgelegene Bergdorf Ebnit und ermoeglichte ueber die Strassen auch den Transport von Wald- und Alpenprodukten ins Rheintal. Die hohe Schuldenlast aus dem Strassenbau und eine Brandkatastrophe fuehrten 1932 zum Anschluss Ebnits an Dornbirn."}],"id":"E032"},{"year":1921,"year_end":null,"date_precision":"year","title":"Stilllegung der Dampfmaschine bei F.M. Rhomberg Schmelzhuetten","summary":"Die 1858 von Gotthilf Kuhn in Stuttgart gebaute Balanciermaschine mit 12 PS bei 5,5 atue war in der Weberei F.M. Rhomberg Schmelzhuetten bis 1921 in Betrieb. Sie hatte gemeinsam mit einer Wasserturbine auf die Fabriktransmission gearbeitet und ueberbrueckte wasserarme Zeiten. Heute ist sie als technikgeschichtliches Juwel auf dem Gelaende der Zumtobel AG restauriert.","people":[],"places":["Dornbirn","Schmelzhuetten"],"category":"Industrie","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 70"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Stilllegung der Dampfmaschine bei F.M. Rhomberg Schmelzhuetten","summary":"Die 1858 von Gotthilf Kuhn in Stuttgart gebaute Balanciermaschine mit 12 PS bei 5,5 atue war in der Weberei F.M. Rhomberg Schmelzhuetten bis 1921 in Betrieb. Sie hatte gemeinsam mit einer Wasserturbine auf die Fabriktransmission gearbeitet und ueberbrueckte wasserarme Zeiten. Heute ist sie als technikgeschichtliches Juwel auf dem Gelaende der Zumtobel AG restauriert."}],"id":"E033"},{"year":1922,"year_end":null,"date_precision":"year","title":"Sohn des Wirts Karl Winsauer stirbt als Feuerwehrmann in Milwaukee","summary":"Karl Winsauer (* 1855 Dornbirn) war in Milwaukee/Wisconsin als Wirt und Präsident des österreichischen Krankenunterstützungsvereins 'Edelweiss' tätig. 1922 kommt einer seiner fünf Söhne als Feuerwehrmann in Milwaukee bei einem Einsatz ums Leben. Die Episode steht für die Verankerung der zweiten Auswanderergeneration im öffentlichen Dienst amerikanischer Städte.","people":["Karl Winsauer"],"places":["Milwaukee","Dornbirn"],"category":"Soziales","sources":["Pichler: Auswanderer"],"page_hints":["Pichler: Auswanderer S. 29"],"alt_titles":[],"source_summaries":[{"book":"Pichler: Auswanderer","title":"Sohn des Wirts Karl Winsauer stirbt als Feuerwehrmann in Milwaukee","summary":"Karl Winsauer (* 1855 Dornbirn) war in Milwaukee/Wisconsin als Wirt und Präsident des österreichischen Krankenunterstützungsvereins 'Edelweiss' tätig. 1922 kommt einer seiner fünf Söhne als Feuerwehrmann in Milwaukee bei einem Einsatz ums Leben. Die Episode steht für die Verankerung der zweiten Auswanderergeneration im öffentlichen Dienst amerikanischer Städte."}],"id":"E034"},{"year":1922,"year_end":null,"date_precision":"year","title":"Textilarbeiter-Demonstration in der Hyperinflation","summary":"Im August 1922 verdoppelten sich die Verbraucherpreise in nur einem Monat. Rund 2.500 Dornbirner Textilarbeiterinnen und -arbeiter demonstrierten in einem grossen Protestmarsch gegen die galoppierende Inflation. Erst im Spaetsommer endete die Inflation mit der Voelkerbundanleihe und der vorbereitenden Stabilisierung. Ende 1924 wurde der Schilling eingefuehrt (10.000 Kronen = 1 Schilling).","people":[],"places":["Dornbirn"],"category":"Wirtschaft","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 71-72"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Textilarbeiter-Demonstration in der Hyperinflation","summary":"Im August 1922 verdoppelten sich die Verbraucherpreise in nur einem Monat. Rund 2.500 Dornbirner Textilarbeiterinnen und -arbeiter demonstrierten in einem grossen Protestmarsch gegen die galoppierende Inflation. Erst im Spaetsommer endete die Inflation mit der Voelkerbundanleihe und der vorbereitenden Stabilisierung. Ende 1924 wurde der Schilling eingefuehrt (10.000 Kronen = 1 Schilling)."}],"id":"E035"},{"year":1923,"year_end":1924,"date_precision":"year_range","title":"Achregulierung und Hochwasserschutz","summary":"Die Achregulierung in den Jahren 1923/24 war eines der grossen Beschaeftigungsprojekte mit Hilfe der Arbeitslosenfuersorge. Im selben Jahr 1923 wurde der Rechen der Dornbirner Ach, der zur Holzfloesserei diente, von einem Hochwasser weggerissen. Er wurde nicht mehr aufgebaut, da das ausgebaute Wegenetz die gefaehrliche Floesserei ueberfluessig gemacht hatte. Karl Drexel wurde im selben Jahr 1923 in den Nationalrat gewaehlt.","people":["Karl Drexel"],"places":["Dornbirn"],"category":"Natur","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 27, 73"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Achregulierung und Hochwasserschutz","summary":"Die Achregulierung in den Jahren 1923/24 war eines der grossen Beschaeftigungsprojekte mit Hilfe der Arbeitslosenfuersorge. Im selben Jahr 1923 wurde der Rechen der Dornbirner Ach, der zur Holzfloesserei diente, von einem Hochwasser weggerissen. Er wurde nicht mehr aufgebaut, da das ausgebaute Wegenetz die gefaehrliche Floesserei ueberfluessig gemacht hatte. Karl Drexel wurde im selben Jahr 1923 in den Nationalrat gewaehlt."}],"id":"E036"},{"year":1923,"year_end":null,"date_precision":"year","title":"Armin Thurnher emigriert als Parkdirektor nach San Marino/Kalifornien","summary":"Der Gärtnerssohn Armin Thurnher (1892-1977) aus Dornbirn erhält nach seiner Rückkehr aus sechsjähriger Kriegsgefangenschaft in Sibirien das Angebot, Parkdirektor von San Marino bei Los Angeles zu werden. 1923 verlässt er mit seiner jungen Frau Erna Haag aus Hohenems Europa. Erna Thurnher wird selbst eine bekannte Floristin in Kalifornien. Eine späte, individuelle Auswanderung mit beruflichem Anlass.","people":["Armin Thurnher","Erna Haag"],"places":["San Marino","Dornbirn","Hohenems"],"category":"Migration","sources":["Pichler: Auswanderer"],"page_hints":["Pichler: Auswanderer S. 55"],"alt_titles":[],"source_summaries":[{"book":"Pichler: Auswanderer","title":"Armin Thurnher emigriert als Parkdirektor nach San Marino/Kalifornien","summary":"Der Gärtnerssohn Armin Thurnher (1892-1977) aus Dornbirn erhält nach seiner Rückkehr aus sechsjähriger Kriegsgefangenschaft in Sibirien das Angebot, Parkdirektor von San Marino bei Los Angeles zu werden. 1923 verlässt er mit seiner jungen Frau Erna Haag aus Hohenems Europa. Erna Thurnher wird selbst eine bekannte Floristin in Kalifornien. Eine späte, individuelle Auswanderung mit beruflichem Anlass."}],"id":"E037"},{"year":1923,"year_end":null,"date_precision":"year","title":"Gruendung der Muellerbachgenossenschaft","summary":"Die Muellerbachgenossenschaft wurde 1923 als Wasserwerksgemeinschaft in das Wasserbuch der BH Feldkirch eingetragen. Die zwoelf wassernutzungsberechtigten Mitglieder sind laut 1925 genehmigten Statuten zu einer maximalen Wassermenge von 1850 l/s berechtigt. Im selben Jahr wurden auch die Kleinkraftwerke Jakob Mayer (Saegebetrieb Schmelzhuetten) und Zumtobel AG Schmelzhuetten gegruendet.","people":[],"places":["Dornbirn","Schmelzhuetten"],"category":"Wirtschaft","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 44"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Gruendung der Muellerbachgenossenschaft","summary":"Die Muellerbachgenossenschaft wurde 1923 als Wasserwerksgemeinschaft in das Wasserbuch der BH Feldkirch eingetragen. Die zwoelf wassernutzungsberechtigten Mitglieder sind laut 1925 genehmigten Statuten zu einer maximalen Wassermenge von 1850 l/s berechtigt. Im selben Jahr wurden auch die Kleinkraftwerke Jakob Mayer (Saegebetrieb Schmelzhuetten) und Zumtobel AG Schmelzhuetten gegruendet."}],"id":"E038"},{"year":1924,"year_end":null,"date_precision":"year","title":"Tod der Pionierin Anna Maria Hefel (geb. Blaser) in Dubuque","summary":"Anna Maria Hefel, geborene Blaser (* 7.5.1847 Dornbirn), stirbt am 6. September 1924 in Dubuque/Iowa. 1871 hatte sie mit ihrem Mann Josef Hefel den Schritt in die Neue Welt gewagt, eine Farm aufgebaut und neun Kinder grossgezogen. Heute leben rund 100 Namensträger 'Hefel' in Dubuque, fast alle direkt von diesem Pionierpaar abstammend – keine Dornbirner Familie hat in Dubuque eine grössere Nachkommenschaft hinterlassen.","people":["Anna Maria Hefel","Josef Hefel"],"places":["Dubuque","Dornbirn"],"category":"Migration","sources":["Pichler: Auswanderer"],"page_hints":["Pichler: Auswanderer S. 40-41"],"alt_titles":[],"source_summaries":[{"book":"Pichler: Auswanderer","title":"Tod der Pionierin Anna Maria Hefel (geb. Blaser) in Dubuque","summary":"Anna Maria Hefel, geborene Blaser (* 7.5.1847 Dornbirn), stirbt am 6. September 1924 in Dubuque/Iowa. 1871 hatte sie mit ihrem Mann Josef Hefel den Schritt in die Neue Welt gewagt, eine Farm aufgebaut und neun Kinder grossgezogen. Heute leben rund 100 Namensträger 'Hefel' in Dubuque, fast alle direkt von diesem Pionierpaar abstammend – keine Dornbirner Familie hat in Dubuque eine grössere Nachkommenschaft hinterlassen."}],"id":"E039"},{"year":1925,"year_end":null,"date_precision":"year","title":"Ingenieur Josef Ehrhart wandert von Ruesch ab","summary":"Als der herausragende Ingenieur Josef Ehrhart 1925 zur Konkurrenzfirma abwanderte, ging der Turbinenbau der Maschinenfabrik Ruesch-Ganahl seinem Ende entgegen. Es war ein Schluesselereignis fuer den Niedergang des Turbinenbaus im Schmelzhuetten-Areal.","people":["Josef Ehrhart"],"places":["Dornbirn"],"category":"Industrie","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 60"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Ingenieur Josef Ehrhart wandert von Ruesch ab","summary":"Als der herausragende Ingenieur Josef Ehrhart 1925 zur Konkurrenzfirma abwanderte, ging der Turbinenbau der Maschinenfabrik Ruesch-Ganahl seinem Ende entgegen. Es war ein Schluesselereignis fuer den Niedergang des Turbinenbaus im Schmelzhuetten-Areal."}],"id":"E040"},{"year":1926,"year_end":null,"date_precision":"year","title":"Tod von Buergermeister Engelbert Luger","summary":"Im Jahr 1926 verstarb der Dornbirner Buergermeister Engelbert Luger (1861-1926), der seit 1910 die Geschicke der Stadt geleitet hatte. Ihm folgte als Buergermeister der christlich-soziale Lehrer Josef Ruef (1882-1934) nach. Im selben Jahr setzte durch Wuestenrot in Dornbirn ein richtiger Bauboom bei Eigenheimen ein.","people":["Engelbert Luger","Josef Ruef"],"places":["Dornbirn"],"category":"Persönlichkeit","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 71-72"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Tod von Buergermeister Engelbert Luger","summary":"Im Jahr 1926 verstarb der Dornbirner Buergermeister Engelbert Luger (1861-1926), der seit 1910 die Geschicke der Stadt geleitet hatte. Ihm folgte als Buergermeister der christlich-soziale Lehrer Josef Ruef (1882-1934) nach. Im selben Jahr setzte durch Wuestenrot in Dornbirn ein richtiger Bauboom bei Eigenheimen ein."}],"id":"E041"},{"year":1927,"year_end":null,"date_precision":"year","title":"Bau der Shedhalle in der ehemaligen Spinnfabrik Saegen","summary":"1927 folgte der Bau der Shedhalle der F.M. Haemmerle-Weberei in der ehemaligen Spinnfabrik Saegen am Werkskanal. Die Inbetriebnahme erfolgte 1936. 1961 stand hier der groesste Websaal Oesterreichs. Das Gebaeude wurde spaeter zur Fachhochschule Vorarlberg umgewandelt.","people":[],"places":["Dornbirn","Saegen"],"category":"Industrie","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 50"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Bau der Shedhalle in der ehemaligen Spinnfabrik Saegen","summary":"1927 folgte der Bau der Shedhalle der F.M. Haemmerle-Weberei in der ehemaligen Spinnfabrik Saegen am Werkskanal. Die Inbetriebnahme erfolgte 1936. 1961 stand hier der groesste Websaal Oesterreichs. Das Gebaeude wurde spaeter zur Fachhochschule Vorarlberg umgewandelt."}],"id":"E042"},{"year":1927,"year_end":null,"date_precision":"year","title":"Einrichtung der oeffentlichen Wasserversorgung","summary":"Erst im Jahr 1927 wurde in Dornbirn die oeffentliche Wasserversorgung eingerichtet. Bis dahin holten die Menschen ihr Trinkwasser aus hunderten Brunnen vor den Haeusern, deren Wasserqualitaet bei Trockenheit oder Regen stark schwankte. Dies hatte zur hohen Saeuglingssterblichkeit beigetragen, 1910 waren 22 Prozent aller Todesfaelle Saeuglinge.","people":[],"places":["Dornbirn"],"category":"Stadtentwicklung","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 65"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Einrichtung der oeffentlichen Wasserversorgung","summary":"Erst im Jahr 1927 wurde in Dornbirn die oeffentliche Wasserversorgung eingerichtet. Bis dahin holten die Menschen ihr Trinkwasser aus hunderten Brunnen vor den Haeusern, deren Wasserqualitaet bei Trockenheit oder Regen stark schwankte. Dies hatte zur hohen Saeuglingssterblichkeit beigetragen, 1910 waren 22 Prozent aller Todesfaelle Saeuglinge."}],"id":"E043"},{"year":1927,"year_end":null,"date_precision":"year","title":"Erste Naturkundeausstellung von Siegfried Fussenegger","summary":"Bereits 1927 hatte der Fabrikant und Sammler Siegfried Fussenegger (1894-1966) im alten Rathaus von Dornbirn seine geologische Sammlung und einen Teil seiner botanischen Sammlung ausgestellt. Diese Initiative gilt als Gruendungsimpuls fuer das spaetere Naturmuseum inatura.","people":["Siegfried Fussenegger"],"places":["Dornbirn","Marktstrasse"],"category":"Kultur","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 62"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Erste Naturkundeausstellung von Siegfried Fussenegger","summary":"Bereits 1927 hatte der Fabrikant und Sammler Siegfried Fussenegger (1894-1966) im alten Rathaus von Dornbirn seine geologische Sammlung und einen Teil seiner botanischen Sammlung ausgestellt. Diese Initiative gilt als Gruendungsimpuls fuer das spaetere Naturmuseum inatura."}],"id":"E044"},{"year":1928,"year_end":null,"date_precision":"year","title":"Max Wehinger kauft Ruesch-Ganahl AG","summary":"1928 kaufte der Dornbirner Max Wehinger das verschuldete Unternehmen Ruesch-Ganahl. Die Ertragslage blieb trotz vieler Auftraege unbefriedigend. Im selben Jahr uebersiedelte das Bauunternehmen Josef Anton Fussenegger vom Gechelbach an die Guetlestrasse, wo heute der staedtische Bauhof steht.","people":["Max Wehinger","Josef Anton Fussenegger"],"places":["Dornbirn","Guetlestrasse"],"category":"Industrie","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 60"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Max Wehinger kauft Ruesch-Ganahl AG","summary":"1928 kaufte der Dornbirner Max Wehinger das verschuldete Unternehmen Ruesch-Ganahl. Die Ertragslage blieb trotz vieler Auftraege unbefriedigend. Im selben Jahr uebersiedelte das Bauunternehmen Josef Anton Fussenegger vom Gechelbach an die Guetlestrasse, wo heute der staedtische Bauhof steht."}],"id":"E045"},{"year":1929,"year_end":null,"date_precision":"year","title":"Beginn der Weltwirtschaftskrise und Massenarbeitslosigkeit","summary":"Im Jahr 1929 setzte als Folge der Weltwirtschaftskrise eine starke Arbeitslosigkeit in Dornbirn ein, die 1931 ihren Hoehepunkt erreichte. Die Preise fuer landwirtschaftliche Produkte fielen um 30 bis 50 Prozent, der Konsum brach ein. Wer noch einen Arbeitsplatz besass, wurde daran erinnert, dass dreissig andere darauf warten wuerden. Teilweise drueckte Kurzarbeit die ohnehin niedrigen Loehne. Bei den Gemeinderatswahlen verlor die CSP die absolute Mehrheit.","people":[],"places":["Dornbirn"],"category":"Wirtschaft","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 71-73"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Beginn der Weltwirtschaftskrise und Massenarbeitslosigkeit","summary":"Im Jahr 1929 setzte als Folge der Weltwirtschaftskrise eine starke Arbeitslosigkeit in Dornbirn ein, die 1931 ihren Hoehepunkt erreichte. Die Preise fuer landwirtschaftliche Produkte fielen um 30 bis 50 Prozent, der Konsum brach ein. Wer noch einen Arbeitsplatz besass, wurde daran erinnert, dass dreissig andere darauf warten wuerden. Teilweise drueckte Kurzarbeit die ohnehin niedrigen Loehne. Bei den Gemeinderatswahlen verlor die CSP die absolute Mehrheit."}],"id":"E046"},{"year":1930,"year_end":1939,"date_precision":"decade","title":"Grosses Farmensterben trifft Dornbirner Nachkommen im Dubuque County","summary":"In den 1930er Jahren werden zahlreiche Farmen der Dornbirner Auswanderer-Nachkommen rund um Dubuque/Iowa vom amerikanischen 'großen Farmensterben' erfasst. Die Kinder und Enkel der Pioniere wenden sich neuen Beschäftigungen zu. Heute (Stand Pichler 2012) gibt es kaum mehr Farmer mit Dornbirner Wurzeln im Dubuque County. Damit endet faktisch die agrarische Phase der Dornbirner Präsenz im Mittleren Westen.","people":[],"places":["Dubuque","Dornbirn"],"category":"Wirtschaft","sources":["Pichler: Auswanderer"],"page_hints":["Pichler: Auswanderer S. 41"],"alt_titles":[],"source_summaries":[{"book":"Pichler: Auswanderer","title":"Grosses Farmensterben trifft Dornbirner Nachkommen im Dubuque County","summary":"In den 1930er Jahren werden zahlreiche Farmen der Dornbirner Auswanderer-Nachkommen rund um Dubuque/Iowa vom amerikanischen 'großen Farmensterben' erfasst. Die Kinder und Enkel der Pioniere wenden sich neuen Beschäftigungen zu. Heute (Stand Pichler 2012) gibt es kaum mehr Farmer mit Dornbirner Wurzeln im Dubuque County. Damit endet faktisch die agrarische Phase der Dornbirner Präsenz im Mittleren Westen."}],"id":"E047"},{"year":1930,"year_end":null,"date_precision":"year","title":"Letzte Welle: Alexander Amann wandert von Dornbirn nach Michigan aus","summary":"Alexander Amann (* 21.4.1908 Sulz, wohnhaft Dornbirn) trifft am 26.9.1930 in New York ein und lässt sich mit Frau Paula Stadelmann in Ann Arbor/Michigan nieder. Die späten 1920er und frühen 1930er Jahre sehen nur noch vereinzelte Einzelauswanderungen aus Dornbirn – die Anschlussjahre 1938 bilden den faktischen Endpunkt der von Pichler erfassten Auswandererbewegung. 1951 macht die Familie Amann einen ersten gemeinsamen Heimatbesuch.","people":["Alexander Amann","Paula Stadelmann"],"places":["Ann Arbor","Dornbirn"],"category":"Migration","sources":["Pichler: Auswanderer"],"page_hints":["Pichler: Auswanderer S. 62"],"alt_titles":[],"source_summaries":[{"book":"Pichler: Auswanderer","title":"Letzte Welle: Alexander Amann wandert von Dornbirn nach Michigan aus","summary":"Alexander Amann (* 21.4.1908 Sulz, wohnhaft Dornbirn) trifft am 26.9.1930 in New York ein und lässt sich mit Frau Paula Stadelmann in Ann Arbor/Michigan nieder. Die späten 1920er und frühen 1930er Jahre sehen nur noch vereinzelte Einzelauswanderungen aus Dornbirn – die Anschlussjahre 1938 bilden den faktischen Endpunkt der von Pichler erfassten Auswandererbewegung. 1951 macht die Familie Amann einen ersten gemeinsamen Heimatbesuch."}],"id":"E048"},{"year":1930,"year_end":null,"date_precision":"year","title":"Pruefstelle fuer Garne und Gespinste an der Textilschule","summary":"1930 wurde an der Dornbirner Stickereifachschule eine Pruefstelle zur mechanisch-technischen Erprobung von Garnen und Gespinsten eingerichtet. Dies war die Geburtsstunde der spaeteren Versuchsanstalt fuer Textil und Chemie. Geprueft wurden Qualitaet und Schadstoffgehalt von Textilien und Rohstoffen.","people":[],"places":["Dornbirn"],"category":"Bildung","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 22"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Pruefstelle fuer Garne und Gespinste an der Textilschule","summary":"1930 wurde an der Dornbirner Stickereifachschule eine Pruefstelle zur mechanisch-technischen Erprobung von Garnen und Gespinsten eingerichtet. Dies war die Geburtsstunde der spaeteren Versuchsanstalt fuer Textil und Chemie. Geprueft wurden Qualitaet und Schadstoffgehalt von Textilien und Rohstoffen."}],"id":"E049"},{"year":1930,"year_end":1939,"date_precision":"decade","title":"Viktor Haemmerle wird NS-Unterstuetzer","summary":"In den Dreissigerjahren des 20. Jahrhunderts wurde Viktor Haemmerle (1855-1946) mit seinen grossdeutschen Gesinnungsgenossen zum aktiven Unterstuetzer der nationalsozialistischen Bewegung. Der zweitaeltste Sohn des Gruenders Franz Martin Haemmerle hatte zuvor als Liberaler in der Gemeindevertretung gewirkt und eine zentrale gesellschaftliche Rolle in Dornbirn gespielt.","people":["Viktor Haemmerle"],"places":["Dornbirn"],"category":"NS-Zeit","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 37"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Viktor Haemmerle wird NS-Unterstuetzer","summary":"In den Dreissigerjahren des 20. Jahrhunderts wurde Viktor Haemmerle (1855-1946) mit seinen grossdeutschen Gesinnungsgenossen zum aktiven Unterstuetzer der nationalsozialistischen Bewegung. Der zweitaeltste Sohn des Gruenders Franz Martin Haemmerle hatte zuvor als Liberaler in der Gemeindevertretung gewirkt und eine zentrale gesellschaftliche Rolle in Dornbirn gespielt."}],"id":"E050"},{"year":1932,"year_end":null,"date_precision":"year","title":"Eingemeindung von Ebnit nach Hochwasser- und Brandkatastrophe","summary":"Im Jahr 1932 wurde Ebnit nach einer Brandkatastrophe und aufgrund der erdrueckenden Schuldenlast aus dem Strassenbau an Dornbirn angeschlossen und damit eingemeindet. Im selben Jahr 1932 verursachte ein Hochwasser umfangreiche Schaeden, deren Beseitigung als Beschaeftigungsprojekt mit Hilfe der Arbeitslosenfuersorge durchgefuehrt wurde.","people":[],"places":["Ebnit","Dornbirn"],"category":"Stadtentwicklung","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 73, 115"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Eingemeindung von Ebnit nach Hochwasser- und Brandkatastrophe","summary":"Im Jahr 1932 wurde Ebnit nach einer Brandkatastrophe und aufgrund der erdrueckenden Schuldenlast aus dem Strassenbau an Dornbirn angeschlossen und damit eingemeindet. Im selben Jahr 1932 verursachte ein Hochwasser umfangreiche Schaeden, deren Beseitigung als Beschaeftigungsprojekt mit Hilfe der Arbeitslosenfuersorge durchgefuehrt wurde."}],"id":"E051"},{"year":1932,"year_end":null,"date_precision":"year","title":"Gruendung der Erich Gasser GesmbH Kinderbekleidung","summary":"1932 wurde das Dornbirner Textilunternehmen Erich Gasser GesmbH gegruendet, das sich auf Kinderbekleidung spezialisierte. Mit etwa 100 Mitarbeitern wurde es ab 1985 zum Textilveredler und verlagerte schliesslich 2010 seinen Standort nach Rankweil, wo es mit der Firma Kunert fusionierte.","people":["Erich Gasser"],"places":["Dornbirn"],"category":"Industrie","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 14"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Gruendung der Erich Gasser GesmbH Kinderbekleidung","summary":"1932 wurde das Dornbirner Textilunternehmen Erich Gasser GesmbH gegruendet, das sich auf Kinderbekleidung spezialisierte. Mit etwa 100 Mitarbeitern wurde es ab 1985 zum Textilveredler und verlagerte schliesslich 2010 seinen Standort nach Rankweil, wo es mit der Firma Kunert fusionierte."}],"id":"E052"},{"year":1933,"year_end":null,"date_precision":"year","title":"Beginn der austrofaschistischen Diktatur und NSDAP-Verbot","summary":"Bundeskanzler Engelbert Dollfuss verhinderte 1933 ein weiteres Zusammentreten des Parlaments und regierte mittels Notverordnungen. Im Maerz durchsuchten Gendarmerie und Militaer das sozialdemokratische Arbeiterheim und die Wohnung von Anton Linder. Im Juni wurde die NSDAP verboten, sie agierte fortan aus dem Untergrund. Als Dollfuss im Juni 1933 Dornbirn besuchte, verwandelte eine Menschenmenge mit Heil-Hitler-Rufen den Empfang in eine Nazi-Kundgebung. Es folgten Sprengstoffanschlaege gegen Strommasten, Eisenbahnlinie und Privathaeuser, Ausgangssperren und Militaereinquartierungen.","people":["Engelbert Dollfuss","Anton Linder"],"places":["Dornbirn"],"category":"Politik","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 73-74"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Beginn der austrofaschistischen Diktatur und NSDAP-Verbot","summary":"Bundeskanzler Engelbert Dollfuss verhinderte 1933 ein weiteres Zusammentreten des Parlaments und regierte mittels Notverordnungen. Im Maerz durchsuchten Gendarmerie und Militaer das sozialdemokratische Arbeiterheim und die Wohnung von Anton Linder. Im Juni wurde die NSDAP verboten, sie agierte fortan aus dem Untergrund. Als Dollfuss im Juni 1933 Dornbirn besuchte, verwandelte eine Menschenmenge mit Heil-Hitler-Rufen den Empfang in eine Nazi-Kundgebung. Es folgten Sprengstoffanschlaege gegen Strommasten, Eisenbahnlinie und Privathaeuser, Ausgangssperren und Militaereinquartierungen."}],"id":"E053"},{"year":1933,"year_end":1934,"date_precision":"year_range","title":"Sanierung des Landgrabens","summary":"1933/34 wurde der Landgraben saniert, um die Entwässerung der Dornbirner Riedflächen weiter voranzutreiben. Diese Maßnahme war Teil einer umfassenden Entwässerungskampagne, die ehemals extensiv genutzte Streuwiesen in landwirtschaftliche Intensivflächen verwandelte. Wertvolle Feuchtlebensräume gingen dadurch verloren.","people":[],"places":["Dornbirn"],"category":"Stadtentwicklung","sources":["Friebe: Naturraum"],"page_hints":["Friebe: Naturraum S. 80"],"alt_titles":[],"source_summaries":[{"book":"Friebe: Naturraum","title":"Sanierung des Landgrabens","summary":"1933/34 wurde der Landgraben saniert, um die Entwässerung der Dornbirner Riedflächen weiter voranzutreiben. Diese Maßnahme war Teil einer umfassenden Entwässerungskampagne, die ehemals extensiv genutzte Streuwiesen in landwirtschaftliche Intensivflächen verwandelte. Wertvolle Feuchtlebensräume gingen dadurch verloren."}],"id":"E054"},{"year":1934,"year_end":null,"date_precision":"year","title":"Februarkaempfe, Tod Ruef, Regierungskommissaer und Staendestaat","summary":"Anfang des Jahres, am 4. Jaenner 1934, starb Buergermeister Josef Ruef. Nach geschlossenem Ruecktritt aller christlich-sozialen Gemeindevertreter und der Ersatzleute waren Neuwahlen noetig. Da Wahlen jedoch generell unzulaessig waren, setzte die Landesregierung am 28. Februar den bisherigen Stadtsekretaer Ludwig Rinderer als Regierungskommissaer ein. Die Februarkaempfe fuehrten zu Verhaftungen von acht Dornbirner SDAP-Funktionaeren. Im Juli 1934 wurde Dollfuss bei einem Putschversuch der Nationalsozialisten getoetet. Im Dezember 1934 wurde Rinderer durch den ständestaatlichen Gemeindetag zum Buergermeister gewaehlt.","people":["Josef Ruef","Ludwig Rinderer","Engelbert Dollfuss","Kurt Schuschnigg"],"places":["Dornbirn"],"category":"Politik","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 74-75"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Februarkaempfe, Tod Ruef, Regierungskommissaer und Staendestaat","summary":"Anfang des Jahres, am 4. Jaenner 1934, starb Buergermeister Josef Ruef. Nach geschlossenem Ruecktritt aller christlich-sozialen Gemeindevertreter und der Ersatzleute waren Neuwahlen noetig. Da Wahlen jedoch generell unzulaessig waren, setzte die Landesregierung am 28. Februar den bisherigen Stadtsekretaer Ludwig Rinderer als Regierungskommissaer ein. Die Februarkaempfe fuehrten zu Verhaftungen von acht Dornbirner SDAP-Funktionaeren. Im Juli 1934 wurde Dollfuss bei einem Putschversuch der Nationalsozialisten getoetet. Im Dezember 1934 wurde Rinderer durch den ständestaatlichen Gemeindetag zum Buergermeister gewaehlt."}],"id":"E055"},{"year":1935,"year_end":null,"date_precision":"year","title":"Ehrenbuergerschaft fuer Viktor Haemmerle und Karl Drexel","summary":"Im Jahr 1935 wurden gleich zwei Persoenlichkeiten zu Ehrenbuergern Dornbirns ernannt: der Industrielle Viktor Haemmerle und Praelat Dr. Karl Drexel. Im selben Jahr begingen rund 3.500 Menschen den ersten Jahrestag der Ermordung von Kanzler Dollfuss mit einer Kundgebung auf dem Dollfussplatz, wie der Rathausplatz damals hiess.","people":["Viktor Haemmerle","Karl Drexel"],"places":["Dornbirn"],"category":"Persönlichkeit","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 75"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Ehrenbuergerschaft fuer Viktor Haemmerle und Karl Drexel","summary":"Im Jahr 1935 wurden gleich zwei Persoenlichkeiten zu Ehrenbuergern Dornbirns ernannt: der Industrielle Viktor Haemmerle und Praelat Dr. Karl Drexel. Im selben Jahr begingen rund 3.500 Menschen den ersten Jahrestag der Ermordung von Kanzler Dollfuss mit einer Kundgebung auf dem Dollfussplatz, wie der Rathausplatz damals hiess."}],"id":"E056"},{"year":1936,"year_end":null,"date_precision":"year","title":"Inbetriebnahme der Shedhalle in Saegen","summary":"1936 erfolgte die Inbetriebnahme der 1927 erbauten Shedhalle der F.M. Haemmerle-Weberei in Saegen. Die Halle wurde Teil des bedeutenden Textilstandorts, der 1961 den groessten Websaal Oesterreichs beherbergte.","people":[],"places":["Dornbirn","Saegen"],"category":"Industrie","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 50"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Inbetriebnahme der Shedhalle in Saegen","summary":"1936 erfolgte die Inbetriebnahme der 1927 erbauten Shedhalle der F.M. Haemmerle-Weberei in Saegen. Die Halle wurde Teil des bedeutenden Textilstandorts, der 1961 den groessten Websaal Oesterreichs beherbergte."}],"id":"E057"},{"year":1936,"year_end":1937,"date_precision":"year_range","title":"Regulierung der Dornbirner Ach und ihrer Zuflüsse","summary":"1936/37 wurde die Dornbirner Ach gemeinsam mit ihren Zuflüssen reguliert. Die Regulierung ermöglichte eine effizientere Entwässerung der angrenzenden Riedflächen und beschleunigte die Umwandlung extensiv genutzter Streuwiesen in landwirtschaftliche Intensivflächen. Heute werden viele der damals entwässerten Flächen als besonders schutzwürdig eingestuft.","people":[],"places":["Dornbirn"],"category":"Stadtentwicklung","sources":["Friebe: Naturraum"],"page_hints":["Friebe: Naturraum S. 80"],"alt_titles":[],"source_summaries":[{"book":"Friebe: Naturraum","title":"Regulierung der Dornbirner Ach und ihrer Zuflüsse","summary":"1936/37 wurde die Dornbirner Ach gemeinsam mit ihren Zuflüssen reguliert. Die Regulierung ermöglichte eine effizientere Entwässerung der angrenzenden Riedflächen und beschleunigte die Umwandlung extensiv genutzter Streuwiesen in landwirtschaftliche Intensivflächen. Heute werden viele der damals entwässerten Flächen als besonders schutzwürdig eingestuft."}],"id":"E058"},{"year":1937,"year_end":null,"date_precision":"year","title":"Alfons Mayer uebernimmt Saege am Muellerbach","summary":"Alfons Mayer hatte 1937 die Saege bereits von Josef Anton Mayer uebernommen und ersetzte die Wasserraeder durch eine Francis-Turbine mit stehender Welle und Leitschaufelregulierung. Die Kraft wurde ueber Kegelradgetriebe auf die Saegegatter uebertragen. Das Saegewerk Mayer am Muellerbach ist das wohl letzte aktive Saegewerk dieser Art in Dornbirn.","people":["Alfons Mayer","Josef Anton Mayer"],"places":["Dornbirn","Schmelzhuetten"],"category":"Wirtschaft","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 56"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Alfons Mayer uebernimmt Saege am Muellerbach","summary":"Alfons Mayer hatte 1937 die Saege bereits von Josef Anton Mayer uebernommen und ersetzte die Wasserraeder durch eine Francis-Turbine mit stehender Welle und Leitschaufelregulierung. Die Kraft wurde ueber Kegelradgetriebe auf die Saegegatter uebertragen. Das Saegewerk Mayer am Muellerbach ist das wohl letzte aktive Saegewerk dieser Art in Dornbirn."}],"id":"E059"},{"year":1938,"year_end":null,"date_precision":"year","title":"Anschluss-Jahr 1938 markiert Ende der Dornbirner USA-Auswanderung","summary":"Mit 1938 endet der von Meinrad Pichler erfasste Untersuchungszeitraum 1800–1938. Der 'Anschluss' Österreichs an Hitler-Deutschland und die anschliessenden Kriegsjahre lassen die freie Auswanderung in die USA versiegen. Vorher noch verlassen einzelne, oft in religiösem Kontext stehende Frauen wie die Ordensschwester Amalia Amann (1932, ins St. John Convent in Wakpeton/North Dakota) das Land. Eine eigene Auswanderungs-Etappe schliesst sich.","people":["Amalia Amann"],"places":["Dornbirn","Wakpeton"],"category":"NS-Zeit","sources":["Pichler: Auswanderer"],"page_hints":["Pichler: Auswanderer S. 9, S. 62"],"alt_titles":[],"source_summaries":[{"book":"Pichler: Auswanderer","title":"Anschluss-Jahr 1938 markiert Ende der Dornbirner USA-Auswanderung","summary":"Mit 1938 endet der von Meinrad Pichler erfasste Untersuchungszeitraum 1800–1938. Der 'Anschluss' Österreichs an Hitler-Deutschland und die anschliessenden Kriegsjahre lassen die freie Auswanderung in die USA versiegen. Vorher noch verlassen einzelne, oft in religiösem Kontext stehende Frauen wie die Ordensschwester Amalia Amann (1932, ins St. John Convent in Wakpeton/North Dakota) das Land. Eine eigene Auswanderungs-Etappe schliesst sich."}],"id":"E060"},{"year":1938,"year_end":null,"date_precision":"year","title":"Gruendung der Baeckerei Oelz in der Marktstrasse","summary":"1938 begann in der Dornbirner Marktstrasse die Bäckerei, aus der die spaetere Firma Rudolf Oelz, Meisterbaecker GmbH hervorging. Sie sollte spaeter zur bekanntesten Backwarenmarke Oesterreichs werden und ab den 1980er-Jahren das ehemalige Textilfabriksareal Juchen nachnutzen.","people":["Rudolf Oelz"],"places":["Dornbirn","Marktstrasse"],"category":"Wirtschaft","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 49"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Gruendung der Baeckerei Oelz in der Marktstrasse","summary":"1938 begann in der Dornbirner Marktstrasse die Bäckerei, aus der die spaetere Firma Rudolf Oelz, Meisterbaecker GmbH hervorging. Sie sollte spaeter zur bekanntesten Backwarenmarke Oesterreichs werden und ab den 1980er-Jahren das ehemalige Textilfabriksareal Juchen nachnutzen."}],"id":"E061"},{"year":1938,"year_end":null,"date_precision":"year","title":"Nationalsozialistische Machtuebernahme und Verfolgung der Familie Turteltaub","summary":"Am 6. Maerz 1938 marschierten 3.000 verbotene Nationalsozialisten in geschlossener Formation durch das Stadtzentrum. Am Abend des 11. Maerz 1938 uebernahmen die Nationalsozialisten die Macht in Dornbirn. Tausende zogen mit Fackelumzug durch die Strassen. Hatler Nazis riefen vor dem Haus der einzigen juedischen Familie in der Lustenauerstrasse Henkt die Juden. Die Familie Edmund und Gertrude Turteltaub mit ihren Kindern Hans (13) und Walter (9) wurde spaeter 1944 im KZ Auschwitz-Birkenau ermordet. Die Saeuglings-Fuersorgeschwester Selma Mitterdorf erhaengte sich aus Angst, als Juedin erkannt zu werden. Erste Gegner wie Hugo Lunardon (gest. 1940 in Mauthausen) wurden verhaftet.","people":["Edmund Turteltaub","Gertrude Turteltaub","Hans Turteltaub","Walter Turteltaub","Selma Mitterdorf","Hugo Lunardon","Adolf Hitler"],"places":["Dornbirn","Lustenauerstrasse","Marktplatz"],"category":"NS-Zeit","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 75-76"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Nationalsozialistische Machtuebernahme und Verfolgung der Familie Turteltaub","summary":"Am 6. Maerz 1938 marschierten 3.000 verbotene Nationalsozialisten in geschlossener Formation durch das Stadtzentrum. Am Abend des 11. Maerz 1938 uebernahmen die Nationalsozialisten die Macht in Dornbirn. Tausende zogen mit Fackelumzug durch die Strassen. Hatler Nazis riefen vor dem Haus der einzigen juedischen Familie in der Lustenauerstrasse Henkt die Juden. Die Familie Edmund und Gertrude Turteltaub mit ihren Kindern Hans (13) und Walter (9) wurde spaeter 1944 im KZ Auschwitz-Birkenau ermordet. Die Saeuglings-Fuersorgeschwester Selma Mitterdorf erhaengte sich aus Angst, als Juedin erkannt zu werden. Erste Gegner wie Hugo Lunardon (gest. 1940 in Mauthausen) wurden verhaftet."}],"id":"E062"},{"year":1939,"year_end":null,"date_precision":"year","title":"Angelobung von NS-Buergermeister Paul Waibel und Rathauserweiterung","summary":"Im Maerz 1939 erfolgte die Angelobung von SS-Untersturmfuehrer Dr. Paul Waibel (1902-1994) als Buergermeister mit Beigeordneten Josef Dreher, Toni Thurnher und Pepe Maehr. Bereits im Juni hatte der neue Buergermeister einen Architektenwettbewerb fuer eine Rathauserweiterung mit Volkshalle ausgeschrieben. Tatsaechlich wurde nur das Rathaus nach Plaenen von Hugo Wank vergroessert. Der Aushub begann 1939, das Haus wurde 1941 fertiggestellt. Im selben Jahr 1939 begann der Zweite Weltkrieg, Suedtiroler Umsiedler kamen nach Dornbirn, fuer die die VOGEWOSI Siedlungen in Sala, Kehlen, Egeten und Ruettenersch baute.","people":["Paul Waibel","Hugo Wank","Josef Dreher"],"places":["Dornbirn","Sala","Kehlen","Egeten"],"category":"NS-Zeit","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 77-78"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Angelobung von NS-Buergermeister Paul Waibel und Rathauserweiterung","summary":"Im Maerz 1939 erfolgte die Angelobung von SS-Untersturmfuehrer Dr. Paul Waibel (1902-1994) als Buergermeister mit Beigeordneten Josef Dreher, Toni Thurnher und Pepe Maehr. Bereits im Juni hatte der neue Buergermeister einen Architektenwettbewerb fuer eine Rathauserweiterung mit Volkshalle ausgeschrieben. Tatsaechlich wurde nur das Rathaus nach Plaenen von Hugo Wank vergroessert. Der Aushub begann 1939, das Haus wurde 1941 fertiggestellt. Im selben Jahr 1939 begann der Zweite Weltkrieg, Suedtiroler Umsiedler kamen nach Dornbirn, fuer die die VOGEWOSI Siedlungen in Sala, Kehlen, Egeten und Ruettenersch baute."}],"id":"E063"},{"year":1939,"year_end":1945,"date_precision":"year_range","title":"Ruesch-Werke als Ruestungsbetrieb mit Zwangsarbeit","summary":"Im Zweiten Weltkrieg retteten Zwangsarbeit und Ruestungsindustrie die Firma Ruesch. Nachdem Max Wehinger den Betrieb unter Nazi-Druck an die grossen Textilfirmen F.M. Rhomberg und F.M. Haemmerle verkaufen musste, gab es Ruestungsauftraege von Marine und Wehrmacht. 145 Kriegsgefangene, meist Franzosen und Russen, wurden 1942/43 in einem Lager in der Jahngasse interniert und arbeiteten in zwei Schichten fuer die Kriegsproduktion.","people":["Max Wehinger"],"places":["Dornbirn","Jahngasse"],"category":"NS-Zeit","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 60"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Ruesch-Werke als Ruestungsbetrieb mit Zwangsarbeit","summary":"Im Zweiten Weltkrieg retteten Zwangsarbeit und Ruestungsindustrie die Firma Ruesch. Nachdem Max Wehinger den Betrieb unter Nazi-Druck an die grossen Textilfirmen F.M. Rhomberg und F.M. Haemmerle verkaufen musste, gab es Ruestungsauftraege von Marine und Wehrmacht. 145 Kriegsgefangene, meist Franzosen und Russen, wurden 1942/43 in einem Lager in der Jahngasse interniert und arbeiteten in zwei Schichten fuer die Kriegsproduktion."}],"id":"E064"},{"year":1939,"year_end":null,"date_precision":"year","title":"Schau der Naturgeschichte Vorarlbergs in der Stierhalle","summary":"Seit 1939 war die Schau der Naturgeschichte Vorarlbergs in der Stierhalle am Viehmarktplatz zu sehen gewesen. Sie ging auf die geologische und botanische Sammlung von Siegfried Fussenegger zurueck und war Vorlaeufer der spaeteren Vorarlberger Naturschau und der heutigen inatura.","people":["Siegfried Fussenegger"],"places":["Dornbirn","Viehmarktplatz"],"category":"Kultur","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 62"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Schau der Naturgeschichte Vorarlbergs in der Stierhalle","summary":"Seit 1939 war die Schau der Naturgeschichte Vorarlbergs in der Stierhalle am Viehmarktplatz zu sehen gewesen. Sie ging auf die geologische und botanische Sammlung von Siegfried Fussenegger zurueck und war Vorlaeufer der spaeteren Vorarlberger Naturschau und der heutigen inatura."}],"id":"E065"},{"year":1939,"year_end":1945,"date_precision":"year_range","title":"Zweiter Weltkrieg fordert 709 Gefallene und Vermisste","summary":"Der Zweite Weltkrieg forderte in Dornbirn ueber 709 gefallene und vermisste Soldaten. Bis zu einem Fuenftel der Bevoelkerung war zeitweise im Krieg, insgesamt rueckten 4.769 Dornbirner ein, deren Zahl sich mit der Einberufung der Standschuetzen im Oktober 1944 auf 5.789 Mann erhoehte. Die Zahl der Zwangsarbeiter erreichte gegen Kriegsende mit rund 7.700 den Hoechststand. Hingerichtet wurden auch lokale Widerstandskaempfer wie Wilhelm Himmer und Hilar Paterno (Mauthausen). Otto Wohlgenannt starb 1942 im KZ Flossenbuerg.","people":["Wilhelm Himmer","Hilar Paterno","Otto Wohlgenannt"],"places":["Dornbirn"],"category":"Krieg","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 77-78, 115"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Zweiter Weltkrieg fordert 709 Gefallene und Vermisste","summary":"Der Zweite Weltkrieg forderte in Dornbirn ueber 709 gefallene und vermisste Soldaten. Bis zu einem Fuenftel der Bevoelkerung war zeitweise im Krieg, insgesamt rueckten 4.769 Dornbirner ein, deren Zahl sich mit der Einberufung der Standschuetzen im Oktober 1944 auf 5.789 Mann erhoehte. Die Zahl der Zwangsarbeiter erreichte gegen Kriegsende mit rund 7.700 den Hoechststand. Hingerichtet wurden auch lokale Widerstandskaempfer wie Wilhelm Himmer und Hilar Paterno (Mauthausen). Otto Wohlgenannt starb 1942 im KZ Flossenbuerg."}],"id":"E066"},{"year":1940,"year_end":null,"date_precision":"year","title":"Buergermeisterwechsel zu Josef Dreher","summary":"Paul Waibel trat wegen Unstimmigkeiten mit Gauleiter Hofer 1940 in die Wehrmacht ein, ihm folgte Josef Dreher (1896-1963) als Buergermeister nach. Im selben Jahr starb Hugo Lunardon, der ehemalige Gendarmeriepostenkommandant, im Konzentrationslager Mauthausen. Nach dem militaerischen Sieg ueber Frankreich erreichte die Zustimmung der Bevoelkerung zum NS-Regime ihren Hoehepunkt.","people":["Josef Dreher","Paul Waibel","Hugo Lunardon"],"places":["Dornbirn"],"category":"NS-Zeit","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 76-78"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Buergermeisterwechsel zu Josef Dreher","summary":"Paul Waibel trat wegen Unstimmigkeiten mit Gauleiter Hofer 1940 in die Wehrmacht ein, ihm folgte Josef Dreher (1896-1963) als Buergermeister nach. Im selben Jahr starb Hugo Lunardon, der ehemalige Gendarmeriepostenkommandant, im Konzentrationslager Mauthausen. Nach dem militaerischen Sieg ueber Frankreich erreichte die Zustimmung der Bevoelkerung zum NS-Regime ihren Hoehepunkt."}],"id":"E067"},{"year":1941,"year_end":null,"date_precision":"year","title":"Pfarrerhebung Haselstauden und Fertigstellung Rathaus-Erweiterung","summary":"Im Jahr 1941 wurde Haselstauden zur eigenstaendigen Pfarre erhoben - spaeter als Oberdorf (1888) und Hatlerdorf (1896). Im selben Jahr wurde die Erweiterung des Rathauses nach Plaenen von Hugo Wank fertiggestellt. Der Haselstauder Ortsgruppenleiter Hans Breuss schrieb in einem Stimmungsbericht: Die alten Leute haben Angst, dass es Ihnen geht wie den Narischen von Valduna - ein Hinweis auf die NS-Krankenmorde.","people":["Hugo Wank","Hans Breuss"],"places":["Haselstauden","Dornbirn"],"category":"Religion","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 37, 77-78"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Pfarrerhebung Haselstauden und Fertigstellung Rathaus-Erweiterung","summary":"Im Jahr 1941 wurde Haselstauden zur eigenstaendigen Pfarre erhoben - spaeter als Oberdorf (1888) und Hatlerdorf (1896). Im selben Jahr wurde die Erweiterung des Rathauses nach Plaenen von Hugo Wank fertiggestellt. Der Haselstauder Ortsgruppenleiter Hans Breuss schrieb in einem Stimmungsbericht: Die alten Leute haben Angst, dass es Ihnen geht wie den Narischen von Valduna - ein Hinweis auf die NS-Krankenmorde."}],"id":"E068"},{"year":1944,"year_end":null,"date_precision":"year","title":"Ermordung der Familie Turteltaub in Auschwitz","summary":"Im Jahr 1944 wurden Hans (13 Jahre) und Walter Turteltaub (9 Jahre), die Kinder der einzigen juedischen Familie Dornbirns, in den Gaskammern des Konzentrationslagers Auschwitz-Birkenau ermordet. Auch ihre Eltern Edmund und Gertrude Turteltaub starben dort. Im Oktober 1944 wurden zudem die Standschuetzen als letztes Aufgebot einberufen, was die Zahl der eingerueckten Dornbirner auf 5.789 Mann erhoehte.","people":["Hans Turteltaub","Walter Turteltaub","Edmund Turteltaub","Gertrude Turteltaub"],"places":["Dornbirn","Auschwitz-Birkenau"],"category":"NS-Zeit","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 75-76"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Ermordung der Familie Turteltaub in Auschwitz","summary":"Im Jahr 1944 wurden Hans (13 Jahre) und Walter Turteltaub (9 Jahre), die Kinder der einzigen juedischen Familie Dornbirns, in den Gaskammern des Konzentrationslagers Auschwitz-Birkenau ermordet. Auch ihre Eltern Edmund und Gertrude Turteltaub starben dort. Im Oktober 1944 wurden zudem die Standschuetzen als letztes Aufgebot einberufen, was die Zahl der eingerueckten Dornbirner auf 5.789 Mann erhoehte."}],"id":"E069"},{"year":1944,"year_end":null,"date_precision":"year","title":"Nobelpreis für Medizin an Herbert Spencer Gasser","summary":"Herbert Spencer Gasser (1888-1963) erhält 1944 den Nobelpreis für Physiologie oder Medizin für seine Entdeckung der Funktionen der Nervenfasern. Sein Grossvater, der Schuhmacher Kaspar Gasser, war 1866 mit Frau Kreszenzia Hefel und dem 10-jährigen Sohn Hermann aus Dornbirn nach Dubuque ausgewandert. Hermann wurde Stadtarzt in Platteville/Wisconsin und benannte seinen Sohn nach dem englischen Sozialphilosophen Herbert Spencer. Als Leiter des Rockefeller Institute for Medical Research wurde Gasser zum berühmtesten Spross der Dornbirner Auswanderer.","people":["Herbert Spencer Gasser","Hermann Gasser","Kaspar Gasser","Kreszenzia Hefel"],"places":["Platteville","Dubuque","Dornbirn"],"category":"Persönlichkeit","sources":["Pichler: Auswanderer"],"page_hints":["Pichler: Auswanderer S. 54-55"],"alt_titles":[],"source_summaries":[{"book":"Pichler: Auswanderer","title":"Nobelpreis für Medizin an Herbert Spencer Gasser","summary":"Herbert Spencer Gasser (1888-1963) erhält 1944 den Nobelpreis für Physiologie oder Medizin für seine Entdeckung der Funktionen der Nervenfasern. Sein Grossvater, der Schuhmacher Kaspar Gasser, war 1866 mit Frau Kreszenzia Hefel und dem 10-jährigen Sohn Hermann aus Dornbirn nach Dubuque ausgewandert. Hermann wurde Stadtarzt in Plattevill

mietete Juchen-Gebaeude und die 16.000 m2 Grundflaeche.","people":[],"places":["Dornbirn","Hoechsterstrasse","Juchen"],"category":"Industrie","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 22"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Strickerei Maselli und Versuchsanstalt HTL","summary":"1985 wurde die Strickerei Maselli GmbH gegruendet, die aus dem Traditionsbetrieb Maeser hervorgegangen war. Im selben Jahr begann die Versuchsanstalt fuer Textil und Chemie ihre Arbeit in den Raeumlichkeiten der HTL Dornbirn. Erich Gasser wurde zum Textilveredler. Oelz erwarb das gemietete Juchen-Gebaeude und die 16.000 m2 Grundflaeche."}],"id":"E134"},{"year":1987,"year_end":null,"date_precision":"year","title":"Eroeffnung der Stadtstrasse und Gruendung Kunstraum Dornbirn","summary":"Im Jahr 1987 wurde die Eroeffnung der Stadtstrasse gefeiert, welche die Gradlinigkeit der maria-theresianischen Loesung auch im Zentrum Dornbirns fortfuehrte. Im selben Jahr 1987 entstand der Kunstraum Dornbirn als Institution zur Vermittlung von Kunst und Design. Ebenfalls 1987 erfolgte die Stilllegung der Hemdennaeherei Madrisa.","people":[],"places":["Dornbirn"],"category":"Stadtentwicklung","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 92, 101"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Eroeffnung der Stadtstrasse und Gruendung Kunstraum Dornbirn","summary":"Im Jahr 1987 wurde die Eroeffnung der Stadtstrasse gefeiert, welche die Gradlinigkeit der maria-theresianischen Loesung auch im Zentrum Dornbirns fortfuehrte. Im selben Jahr 1987 entstand der Kunstraum Dornbirn als Institution zur Vermittlung von Kunst und Design. Ebenfalls 1987 erfolgte die Stilllegung der Hemdennaeherei Madrisa."}],"id":"E135"},{"year":1987,"year_end":null,"date_precision":"year","title":"Messepark eroeffnet - Konkurs Madrisa","summary":"1987 wurde aus dem INTERSPAR das wesentlich vergroesserte und modernisierte Einkaufszentrum Messepark. Auf 42.000 m2 mit fast 21.000 m2 Verkaufsflaeche und 63 Einzelgeschaeften ist es bis heute das groesste Einkaufszentrum Vorarlbergs. Im selben Jahr folgte mit dem Konkurs des Hemdenerzeugers Madrisa ein weiterer schmerzhafter Schritt im Niedergang der Textilindustrie. Auch eine neue Backerei bei Oelz auf 3400 m2 wurde dazugebaut.","people":[],"places":["Dornbirn","Dornbirn-Sued"],"category":"Wirtschaft","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 76"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Messepark eroeffnet - Konkurs Madrisa","summary":"1987 wurde aus dem INTERSPAR das wesentlich vergroesserte und modernisierte Einkaufszentrum Messepark. Auf 42.000 m2 mit fast 21.000 m2 Verkaufsflaeche und 63 Einzelgeschaeften ist es bis heute das groesste Einkaufszentrum Vorarlbergs. Im selben Jahr folgte mit dem Konkurs des Hemdenerzeugers Madrisa ein weiterer schmerzhafter Schritt im Niedergang der Textilindustrie. Auch eine neue Backerei bei Oelz auf 3400 m2 wurde dazugebaut."}],"id":"E136"},{"year":1988,"year_end":null,"date_precision":"year","title":"Buntspinnerei Guetle - Denkmalschutz Juchen","summary":"Noch 1988 wurden in der Spinnerei Guetle mit 102 Beschaeftigten Effekt- und Buntgarne im Ausmass von 150 t pro Monat erzeugt. Hier liefen Rotorspinnmaschinen, Dref-Spinnstellen und Ringspindeln. Im selben Jahr wurde der geschindelte Ostteil des Fabriksgebaeudes der Spinnerei Juchen (1813) unter Denkmalschutz gestellt. Das Objekt wurde von der Stadt Dornbirn neu eingedeckt.","people":[],"places":["Dornbirn","Guetle","Juchen"],"category":"Industrie","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 30"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Buntspinnerei Guetle - Denkmalschutz Juchen","summary":"Noch 1988 wurden in der Spinnerei Guetle mit 102 Beschaeftigten Effekt- und Buntgarne im Ausmass von 150 t pro Monat erzeugt. Hier liefen Rotorspinnmaschinen, Dref-Spinnstellen und Ringspindeln. Im selben Jahr wurde der geschindelte Ostteil des Fabriksgebaeudes der Spinnerei Juchen (1813) unter Denkmalschutz gestellt. Das Objekt wurde von der Stadt Dornbirn neu eingedeckt."}],"id":"E137"},{"year":1988,"year_end":null,"date_precision":"year","title":"Erstes Impuls-Festival am Spielboden","summary":"Im Sommer 1988 begann Willi Pramstaller mit dem Impuls-Festival am Spielboden. Neben Konzerten spielte der Theater-Zirkus eine grosse Rolle, die Kleinkunst erhielt bei den folgenden Festivals immer groesseren Stellenwert. Das Impuls-Festival wurde spaeter durch das Origano-Festival ersetzt.","people":["Willi Pramstaller"],"places":["Dornbirn"],"category":"Kultur","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 100"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Erstes Impuls-Festival am Spielboden","summary":"Im Sommer 1988 begann Willi Pramstaller mit dem Impuls-Festival am Spielboden. Neben Konzerten spielte der Theater-Zirkus eine grosse Rolle, die Kleinkunst erhielt bei den folgenden Festivals immer groesseren Stellenwert. Das Impuls-Festival wurde spaeter durch das Origano-Festival ersetzt."}],"id":"E138"},{"year":1989,"year_end":null,"date_precision":"year","title":"Eroeffnung der Fussgaengerzone am Marktplatz","summary":"Im Jahr 1989 wurde die grosse Fussgaengerzone in der Stadtmitte am Marktplatz eroeffnet. Der Preis fuer das autofreie Zentrum war eine breite, neu erbaute Strasse quer durch die Stadt, die taeglich rund 22.000 Autos benuetzten. Die Bevoelkerung sprach anfangs kritisch von der oeden Sohm-Platte und einem steinernen Meer ohne Baum. Spaeter wurde die Fussgaengerzone aber gut angenommen, der Buergermeister Sohm fuehrte sein Wahlergebnis von 1990 auf diese Kritik zurueck.","people":["Rudolf Sohm"],"places":["Dornbirn","Marktplatz"],"category":"Stadtentwicklung","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 92, 107, 115"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Eroeffnung der Fussgaengerzone am Marktplatz","summary":"Im Jahr 1989 wurde die grosse Fussgaengerzone in der Stadtmitte am Marktplatz eroeffnet. Der Preis fuer das autofreie Zentrum war eine breite, neu erbaute Strasse quer durch die Stadt, die taeglich rund 22.000 Autos benuetzten. Die Bevoelkerung sprach anfangs kritisch von der oeden Sohm-Platte und einem steinernen Meer ohne Baum. Spaeter wurde die Fussgaengerzone aber gut angenommen, der Buergermeister Sohm fuehrte sein Wahlergebnis von 1990 auf diese Kritik zurueck."}],"id":"E139"},{"year":1989,"year_end":null,"date_precision":"year","title":"Zumtobel produziert Leuchten in New Jersey","summary":"1989 begann Zumtobel in New Jersey die Fertigung von Leuchten. Damit baute der Konzern seine US-Praesenz weiter aus. Im selben Jahr eroeffnete Oelz drei neue Produktionslinien am Juchen-Standort, mit Absatzmaerkten nun auch in der BRD und in der Schweiz.","people":[],"places":["Dornbirn"],"category":"Industrie","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 69"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Zumtobel produziert Leuchten in New Jersey","summary":"1989 begann Zumtobel in New Jersey die Fertigung von Leuchten. Damit baute der Konzern seine US-Praesenz weiter aus. Im selben Jahr eroeffnete Oelz drei neue Produktionslinien am Juchen-Standort, mit Absatzmaerkten nun auch in der BRD und in der Schweiz."}],"id":"E140"},{"year":1990,"year_end":null,"date_precision":"decade","title":"Bedeutender Fossilienfund Plattenwaldschicht in Ebnit","summary":"In den 1990er-Jahren lieferte ein Vorkommen der Plattenwaldschicht in Ebnit einen seltenen Fischwirbel sowie einen bisher in Vorarlberg unbekannten Ammoniten. Die Funde aus der Garschella-Formation trugen wesentlich zum Verständnis dieser komplexen Gesteinseinheit bei. Sie werden heute in der inatura, dem Naturkundemuseum Vorarlbergs, verwahrt.","people":[],"places":["Dornbirn","Ebnit"],"category":"Bildung","sources":["Friebe: Naturraum"],"page_hints":["Friebe: Naturraum S. 21"],"alt_titles":[],"source_summaries":[{"book":"Friebe: Naturraum","title":"Bedeutender Fossilienfund Plattenwaldschicht in Ebnit","summary":"In den 1990er-Jahren lieferte ein Vorkommen der Plattenwaldschicht in Ebnit einen seltenen Fischwirbel sowie einen bisher in Vorarlberg unbekannten Ammoniten. Die Funde aus der Garschella-Formation trugen wesentlich zum Verständnis dieser komplexen Gesteinseinheit bei. Sie werden heute in der inatura, dem Naturkundemuseum Vorarlbergs, verwahrt."}],"id":"E141"},{"year":1990,"year_end":null,"date_precision":"year","title":"Spinnerei Guetle wird stillgelegt","summary":"Nach der tiefgreifenden und europaweiten Textilkrise der Achtzigerjahre wurde 1990 die Spinnerei Guetle der F.M. Haemmerle stillgelegt. Die Produktion verlegte man aus Rationalisierungsgruenden in die wesentlich groessere F.M. Haemmerle-Spinnerei nach Feldkirch-Gisingen. Die Elektrizitaetsanlagen werden jedoch nach wie vor betrieben.","people":["Franz Martin Haemmerle"],"places":["Dornbirn","Guetle","Feldkirch-Gisingen"],"category":"Industrie","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 32"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Spinnerei Guetle wird stillgelegt","summary":"Nach der tiefgreifenden und europaweiten Textilkrise der Achtzigerjahre wurde 1990 die Spinnerei Guetle der F.M. Haemmerle stillgelegt. Die Produktion verlegte man aus Rationalisierungsgruenden in die wesentlich groessere F.M. Haemmerle-Spinnerei nach Feldkirch-Gisingen. Die Elektrizitaetsanlagen werden jedoch nach wie vor betrieben."}],"id":"E142"},{"year":1991,"year_end":null,"date_precision":"year","title":"Einfuehrung des Dornbirner Stadtbusses","summary":"Im Herbst 1991 nahm der Dornbirner Stadtbus den Betrieb auf, gestartet mit drei Durchmesserlinien, die sich alle dreissig Minuten in der Riedgasse zum Umsteige-Rendezvous trafen. Der rote Stadtbus wurde zu einem identitaetsstiftenden Symbol der Stadt, traegt keinerlei Werbeaufschriften und gehoert bildhaft der Buergerschaft. Spaeter wuchs das Angebot auf zehn Linien, die das gesamte Stadtgebiet durchziehen. Der Stadtbus hatte einen wesentlichen Anteil an der Stadtwerdung Dornbirns.","people":[],"places":["Dornbirn","Riedgasse"],"category":"Verkehr","sources":["Matt: Geschichte Dornbirns","Aberer: Stadtentwicklung"],"page_hints":["Matt: Geschichte Dornbirns S. 92, 115","Aberer: Stadtentwicklung S. 35"],"alt_titles":["Inbetriebnahme des Stadtbusses"],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Inbetriebnahme des Stadtbusses","summary":"Am 26. Oktober 1991 wurde mit dem Slogan Ar kut! - Geliyor! - Er kommt! in der Dornbirner Mundart und in tuerkischer Sprache die Inbetriebnahme des Stadtbusses angekuendigt. Begonnen wurde mit drei Linien, die am Tag der Eroeffnung bereits mehr als 10.000 Fahrgaeste zaehlten. Dornbirn hatte 40.735 Einwohner. Das mehrsprachige Plakat war auch eine wichtige Anerkennung der tuerkischen Migrantinnen und Migranten."},{"book":"Aberer: Stadtentwicklung","title":"Einfuehrung des Dornbirner Stadtbusses","summary":"Im Herbst 1991 nahm der Dornbirner Stadtbus den Betrieb auf, gestartet mit drei Durchmesserlinien, die sich alle dreissig Minuten in der Riedgasse zum Umsteige-Rendezvous trafen. Der rote Stadtbus wurde zu einem identitaetsstiftenden Symbol der Stadt, traegt keinerlei Werbeaufschriften und gehoert bildhaft der Buergerschaft. Spaeter wuchs das Angebot auf zehn Linien, die das gesamte Stadtgebiet durchziehen. Der Stadtbus hatte einen wesentlichen Anteil an der Stadtwerdung Dornbirns."}],"id":"E143"},{"year":1992,"year_end":1993,"date_precision":"year_range","title":"Conrad Sohm uebernimmt Liegenschaft Boden","summary":"Die Holding der Firma F.M. Haemmerle als Eigentuemerin verkaufte 1992/93 die Liegenschaft Boden an die H. Rothmeyer GmbH, welche das Gebaeude seither fuer das Nachtlokal mit Musikveranstaltungen Conrad Sohm nutzt. Eine der beiden Turbinen wurde anfaenglich zur Eigenerzeugung, spaeter zur Netzeinspeisung verwendet. Im Laufe der Jahre traten hier grosse Namen wie Joe Zawinul, Ike Turner, Miriam Makeba auf.","people":[],"places":["Dornbirn","Parzelle Boden"],"category":"Kultur","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 42"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Conrad Sohm uebernimmt Liegenschaft Boden","summary":"Die Holding der Firma F.M. Haemmerle als Eigentuemerin verkaufte 1992/93 die Liegenschaft Boden an die H. Rothmeyer GmbH, welche das Gebaeude seither fuer das Nachtlokal mit Musikveranstaltungen Conrad Sohm nutzt. Eine der beiden Turbinen wurde anfaenglich zur Eigenerzeugung, spaeter zur Netzeinspeisung verwendet. Im Laufe der Jahre traten hier grosse Namen wie Joe Zawinul, Ike Turner, Miriam Makeba auf."}],"id":"E144"},{"year":1992,"year_end":null,"date_precision":"year","title":"Verbundsystem der Dornbirner Buechereien","summary":"Seit 1992 arbeiten alle acht Dornbirner Buechereien zusammen. Das Dornbirner Buechereiwesen erhielt durch dieses Verbundsystem Modellcharakter und wurde zu einem Vorbild fuer andere Gemeinden.","people":[],"places":["Dornbirn"],"category":"Kultur","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 101"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Verbundsystem der Dornbirner Buechereien","summary":"Seit 1992 arbeiten alle acht Dornbirner Buechereien zusammen. Das Dornbirner Buechereiwesen erhielt durch dieses Verbundsystem Modellcharakter und wurde zu einem Vorbild fuer andere Gemeinden."}],"id":"E145"},{"year":1993,"year_end":null,"date_precision":"year","title":"Gruendung Gemeindeverband OEPNV - Unteres Rheintal","summary":"1993 wurde der Gemeindeverband OEPNV - Unteres Rheintal gegruendet. Damit ergaenzt das regionale Angebot der gelben Landbusse das innerstaedtische Stadtbusangebot insbesondere auf den Hauptachsen. Stadt- und Landbus verkehren ab dem Busplatz beim Bahnhof mit werktaeglich ueber 700 Busabfahrten und tragen so ein staedtisches Mobilitaetsangebot in alle Stadtbezirke. Der Busbahnhof entwickelte sich damit neben dem Marktplatz zum zweiten grossen Stadtplatz.","people":[],"places":["Dornbirn","Bahnhof"],"category":"Verkehr","sources":["Aberer: Stadtentwicklung"],"page_hints":["Aberer: Stadtentwicklung S. 35"],"alt_titles":[],"source_summaries":[{"book":"Aberer: Stadtentwicklung","title":"Gruendung Gemeindeverband OEPNV - Unteres Rheintal","summary":"1993 wurde der Gemeindeverband OEPNV - Unteres Rheintal gegruendet. Damit ergaenzt das regionale Angebot der gelben Landbusse das innerstaedtische Stadtbusangebot insbesondere auf den Hauptachsen. Stadt- und Landbus verkehren ab dem Busplatz beim Bahnhof mit werktaeglich ueber 700 Busabfahrten und tragen so ein staedtisches Mobilitaetsangebot in alle Stadtbezirke. Der Busbahnhof entwickelte sich damit neben dem Marktplatz zum zweiten grossen Stadtplatz."}],"id":"E146"},{"year":1993,"year_end":null,"date_precision":"year","title":"Insolvenz F.M. Rhomberg Textil - Gruenraumkonzept","summary":"1993 folgte die Insolvenz der F.M. Rhomberg Textil als weiterer dramatischer Schritt im Niedergang der Textilbranche. Im selben Jahr tauchte mit dem staedtischen Gruenraumkonzept erstmals die Idee eines Stadtgartens auf dem ehemaligen Ruesch-Areal auf. Damit begann die Planung der Umnutzung zum Naturmuseum inatura. Auch wurde das erste Fachhochschul-Studiengesetz verabschiedet.","people":["F.M. Rhomberg"],"places":["Dornbirn"],"category":"Industrie","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 11"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Insolvenz F.M. Rhomberg Textil - Gruenraumkonzept","summary":"1993 folgte die Insolvenz der F.M. Rhomberg Textil als weiterer dramatischer Schritt im Niedergang der Textilbranche. Im selben Jahr tauchte mit dem staedtischen Gruenraumkonzept erstmals die Idee eines Stadtgartens auf dem ehemaligen Ruesch-Areal auf. Damit begann die Planung der Umnutzung zum Naturmuseum inatura. Auch wurde das erste Fachhochschul-Studiengesetz verabschiedet."}],"id":"E147"},{"year":1993,"year_end":null,"date_precision":"year","title":"Konkurs Rhomberg Textil","summary":"Im Jahr 1993 erfolgte der Konkurs des Traditionsunternehmens Rhomberg Textil. Anfang der 1990er Jahre war damit der Hoehepunkt der Krise in der Dornbirner Textilindustrie erreicht. Die Industrie beschaeftigte 1993 nur noch 4.584 Mitarbeiter - ein Rueckgang von beinahe 25 Prozent in fuenf Jahren. Obwohl der Handel auch Rueckgaenge zu verzeichnen hatte, uebertraf er mit 4.660 Beschaeftigten erstmals die Industrie.","people":[],"places":["Dornbirn"],"category":"Wirtschaft","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 96"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Konkurs Rhomberg Textil","summary":"Im Jahr 1993 erfolgte der Konkurs des Traditionsunternehmens Rhomberg Textil. Anfang der 1990er Jahre war damit der Hoehepunkt der Krise in der Dornbirner Textilindustrie erreicht. Die Industrie beschaeftigte 1993 nur noch 4.584 Mitarbeiter - ein Rueckgang von beinahe 25 Prozent in fuenf Jahren. Obwohl der Handel auch Rueckgaenge zu verzeichnen hatte, uebertraf er mit 4.660 Beschaeftigten erstmals die Industrie."}],"id":"E148"},{"year":1994,"year_end":null,"date_precision":"year","title":"Gründung der Fachhochschule Vorarlberg in Dornbirn","summary":"Die Fachhochschule Vorarlberg wird als erste Hochschule des Landes Vorarlberg in Dornbirn etabliert. Die Stadt kauft das Gebäude der ehemaligen Textilschule in Sägen vom Bund ab und saniert es als Sitz der FH. Später sichert sich die Stadt in einer 'Nacht- und Nebelaktion' das anliegende Areal der Firma F.M. Hämmerle für die Erweiterung. Die FH bietet akademische Lehre in Technik, Wirtschaft, Gestaltung und Soziales sowie Forschung als 'Think Tank'. Heute ist sie mit mehr als 100 weltweiten Kooperationsvereinbarungen international vernetzt und arbeitet bei über 90% der Projekte mit heimischen Unternehmen zusammen.","people":["Rudi Feurstein","Lars Frormann"],"places":["Dornbirn","Sägen","Spinnergasse"],"category":"Bildung","sources":["Fessler: Wirtschaften","Hämmerle: Innovation"],"page_hints":["Fessler: Wirtschaften S. 54","Hämmerle: Innovation S. 26-29"],"alt_titles":["Fachhochschule Vorarlberg - Wirtschaftsstudie"],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Fachhochschule Vorarlberg - Wirtschaftsstudie","summary":"1994 entwickelte sich aus dem Technikum Vorarlberg in Dornbirn der erste Studiengang Fertigungsautomatisierung. Dornbirn wurde so zur Geburtsstaette des gesamten Fachhochschulwesens in Oesterreich. Im selben Jahr gab die Stadtverwaltung angesichts des bevorstehenden EU-Beitritts und des rasanten Arbeitsplatzrueckgangs in der Textilindustrie eine Studie in Auftrag, die Dornbirns Zukunft als Wirtschaftsstandort klaeren sollte. Fussenegger Holding erzielte mit 500 Beschaeftigten 700 Mio Schilling Umsatz."},{"book":"Hämmerle: Innovation","title":"Gründung der Fachhochschule Vorarlberg in Dornbirn","summary":"Die Fachhochschule Vorarlberg wird als erste Hochschule des Landes Vorarlberg in Dornbirn etabliert. Die Stadt kauft das Gebäude der ehemaligen Textilschule in Sägen vom Bund ab und saniert es als Sitz der FH. Später sichert sich die Stadt in einer 'Nacht- und Nebelaktion' das anliegende Areal der Firma F.M. Hämmerle für die Erweiterung. Die FH bietet akademische Lehre in Technik, Wirtschaft, Gestaltung und Soziales sowie Forschung als 'Think Tank'. Heute ist sie mit mehr als 100 weltweiten Kooperationsvereinbarungen international vernetzt und arbeitet bei über 90% der Projekte mit heimischen Unternehmen zusammen."}],"id":"E149"},{"year":1994,"year_end":null,"date_precision":"year","title":"Konkurs der Textilfärberei F.M. Rhomberg und Wirtschaftsstudie","summary":"1994 geht die Textilfärberei F.M. Rhomberg in Konkurs, wodurch ein ca. 8 ha großes Areal in Dornbirn zur Disposition steht. Zur Zeit des Konkurses waren in der Färberei rund 400 Mitarbeiter beschäftigt. Die Textilkrise ist Auslöser für eine breit angelegte Wirtschaftsstudie, in der die Potenziale des Standorts untersucht und konkrete Maßnahmen zur Stärkung vorgeschlagen werden. Die Stadt sieht die Krise als Chance und kauft verstärkt Betriebsgebiete an. Masseverwalter und Stadt sorgen dafür, dass das Gelände nicht in kleine Einheiten zerschlagen wird.","people":[],"places":["Dornbirn"],"category":"Wirtschaft","sources":["Hämmerle: Innovation"],"page_hints":["Hämmerle: Innovation S. 8, 18"],"alt_titles":[],"source_summaries":[{"book":"Hämmerle: Innovation","title":"Konkurs der Textilfärberei F.M. Rhomberg und Wirtschaftsstudie","summary":"1994 geht die Textilfärberei F.M. Rhomberg in Konkurs, wodurch ein ca. 8 ha großes Areal in Dornbirn zur Disposition steht. Zur Zeit des Konkurses waren in der Färberei rund 400 Mitarbeiter beschäftigt. Die Textilkrise ist Auslöser für eine breit angelegte Wirtschaftsstudie, in der die Potenziale des Standorts untersucht und konkrete Maßnahmen zur Stärkung vorgeschlagen werden. Die Stadt sieht die Krise als Chance und kauft verstärkt Betriebsgebiete an. Masseverwalter und Stadt sorgen dafür, dass das Gelände nicht in kleine Einheiten zerschlagen wird."}],"id":"E150"},{"year":1994,"year_end":null,"date_precision":"year","title":"Rohrbach und Schoren werden Stadtbezirke und Eroeffnung 1. Fachhochschule Oesterreichs","summary":"Im Jahr 1994 wurden Rohrbach und Schoren zu eigenen Stadtbezirken erklaert, womit Dornbirn nun ueber sechs Bezirke verfuegte. Im selben Jahr 1994 wurde die erste Fachhochschule Oesterreichs in Dornbirn eroeffnet. Dieser Schritt war ein wichtiger Beitrag zur Entwicklung Dornbirns von der Industrie- zur Dienstleistungsstadt.","people":[],"places":["Rohrbach","Schoren","Dornbirn"],"category":"Bildung","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 94, 115"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Rohrbach und Schoren werden Stadtbezirke und Eroeffnung 1. Fachhochschule Oesterreichs","summary":"Im Jahr 1994 wurden Rohrbach und Schoren zu eigenen Stadtbezirken erklaert, womit Dornbirn nun ueber sechs Bezirke verfuegte. Im selben Jahr 1994 wurde die erste Fachhochschule Oesterreichs in Dornbirn eroeffnet. Dieser Schritt war ein wichtiger Beitrag zur Entwicklung Dornbirns von der Industrie- zur Dienstleistungsstadt."}],"id":"E151"},{"year":1994,"year_end":null,"date_precision":"year","title":"Wirtschaftsstudie Dornbirn: Wirtschaftsstadt mit Lebensqualitaet","summary":"In der Wirtschaftsstudie 1994 wurde ein neues Leitbild fuer Dornbirn postuliert, das den sozialen, kulturellen und oekologischen Anforderungen einer modernen Stadt gerecht werden sollte: Dornbirn als Wirtschaftsstadt mit hoher Lebensqualitaet. Diese Selbstdefinition ergaenzte die bisherigen Attribute Messestadt, Gartenstadt oder Sportstadt und wurde zur Richtschnur der weiteren Stadtentwicklung. Die Studie markiert den programmatischen Uebergang zu einer integrativen, qualitaetsorientierten Stadtpolitik.","people":[],"places":["Dornbirn"],"category":"Politik","sources":["Aberer: Stadtentwicklung"],"page_hints":["Aberer: Stadtentwicklung S. 7"],"alt_titles":[],"source_summaries":[{"book":"Aberer: Stadtentwicklung","title":"Wirtschaftsstudie Dornbirn: Wirtschaftsstadt mit Lebensqualitaet","summary":"In der Wirtschaftsstudie 1994 wurde ein neues Leitbild fuer Dornbirn postuliert, das den sozialen, kulturellen und oekologischen Anforderungen einer modernen Stadt gerecht werden sollte: Dornbirn als Wirtschaftsstadt mit hoher Lebensqualitaet. Diese Selbstdefinition ergaenzte die bisherigen Attribute Messestadt, Gartenstadt oder Sportstadt und wurde zur Richtschnur der weiteren Stadtentwicklung. Die Studie markiert den programmatischen Uebergang zu einer integrativen, qualitaetsorientierten Stadtpolitik."}],"id":"E152"},{"year":1995,"year_end":null,"date_precision":"year","title":"Dornbirner Landschafts- und Gruenraumkonzept","summary":"1995 wurde das Dornbirner Landschafts- und Gruenraumkonzept beschlossen. Es kartierte und bilanzierte die Gruenausstattung der Gesamtstadt, zeigte zu entwickelnde Gruenraeume auf und schlug die Flaechensicherung zu deren Realisierung vor. Das Konzept wurde Grundlage fuer den Ausbau des oeffentlichen Gruenflaechenbestands auf rund 37 Hektar in Form von Stadtteilparks, dem Stadtgarten und Spielplaetzen. Damit erweiterte sich der Begriff der Gartenstadt von den tausenden Privatgaerten hin zu oeffentlichen Frei- und Gruenflaechen.","people":[],"places":["Dornbirn"],"category":"Natur","sources":["Aberer: Stadtentwicklung"],"page_hints":["Aberer: Stadtentwicklung S. 43"],"alt_titles":[],"source_summaries":[{"book":"Aberer: Stadtentwicklung","title":"Dornbirner Landschafts- und Gruenraumkonzept","summary":"1995 wurde das Dornbirner Landschafts- und Gruenraumkonzept beschlossen. Es kartierte und bilanzierte die Gruenausstattung der Gesamtstadt, zeigte zu entwickelnde Gruenraeume auf und schlug die Flaechensicherung zu deren Realisierung vor. Das Konzept wurde Grundlage fuer den Ausbau des oeffentlichen Gruenflaechenbestands auf rund 37 Hektar in Form von Stadtteilparks, dem Stadtgarten und Spielplaetzen. Damit erweiterte sich der Begriff der Gartenstadt von den tausenden Privatgaerten hin zu oeffentlichen Frei- und Gruenflaechen."}],"id":"E153"},{"year":1995,"year_end":null,"date_precision":"year","title":"Fohramoos als Natura 2000-Gebiet bei EU nominiert","summary":"1995 wurde das Fohramoos vom Land Vorarlberg bei der EU als Natura 2000-Gebiet nominiert. Inzwischen ist es als Europaschutzgebiet von überregionaler Bedeutung anerkannt. Das Hochmoor mit seinen Moorwäldern, Streuwiesen und Magerrasen beheimatet seltene Pflanzen wie Rundblättrigen Sonnentau und Rosmarinheide sowie spezialisierte Schmetterlingsarten.","people":[],"places":["Dornbirn","Schwarzenberg","Fohramoos"],"category":"Natur","sources":["Friebe: Naturraum"],"page_hints":["Friebe: Naturraum S. 49"],"alt_titles":[],"source_summaries":[{"book":"Friebe: Naturraum","title":"Fohramoos als Natura 2000-Gebiet bei EU nominiert","summary":"1995 wurde das Fohramoos vom Land Vorarlberg bei der EU als Natura 2000-Gebiet nominiert. Inzwischen ist es als Europaschutzgebiet von überregionaler Bedeutung anerkannt. Das Hochmoor mit seinen Moorwäldern, Streuwiesen und Magerrasen beheimatet seltene Pflanzen wie Rundblättrigen Sonnentau und Rosmarinheide sowie spezialisierte Schmetterlingsarten."}],"id":"E154"},{"year":1995,"year_end":null,"date_precision":"year","title":"KIKA Einrichtungshaus an Josef-Ganahl-Strasse","summary":"1995 eroeffnete eine Filiale des Einrichtungshauses KIKA an der Josef-Ganahl-Strasse in Dornbirn nach dem Cash & Carry-Prinzip der Selbstabholung. Im selben Jahr startete der Studiengang Betriebliches Prozess- und Projektmanagement an der Fachhochschule.","people":[],"places":["Dornbirn","Josef-Ganahl-Strasse"],"category":"Wirtschaft","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 78"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"KIKA Einrichtungshaus an Josef-Ganahl-Strasse","summary":"1995 eroeffnete eine Filiale des Einrichtungshauses KIKA an der Josef-Ganahl-Strasse in Dornbirn nach dem Cash & Carry-Prinzip der Selbstabholung. Im selben Jahr startete der Studiengang Betriebliches Prozess- und Projektmanagement an der Fachhochschule."}],"id":"E155"},{"year":1995,"year_end":null,"date_precision":"year","title":"Schliessung Benedikt Maeser und Bohle als Sieger","summary":"Im Jahr 1995 loeste Benedikt Maeser seine Produktion in Dornbirn auf. Im selben Jahr 1995 brachte die Gemeinderatswahl Sohm als grossen Sieger - die OuVP hatte ihren Stimmanteil wieder auf rund 60 Prozent gesteigert. Erstmals zogen zwei Frauen, Marie-Louise Hinterauer und Andrea Kaufmann, in den Stadtrat ein. Die Wirtschaftliche Umstrukturierung lief gut, die Fussgaengerzone wurde inzwischen angenommen. Ein grosses Einrichtungshaus eroeffnete an der Autobahnauffahrt Sued.","people":["Rudolf Sohm","Marie-Louise Hinterauer","Andrea Kaufmann"],"places":["Dornbirn"],"category":"Wirtschaft","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 96, 107"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Schliessung Benedikt Maeser und Bohle als Sieger","summary":"Im Jahr 1995 loeste Benedikt Maeser seine Produktion in Dornbirn auf. Im selben Jahr 1995 brachte die Gemeinderatswahl Sohm als grossen Sieger - die OuVP hatte ihren Stimmanteil wieder auf rund 60 Prozent gesteigert. Erstmals zogen zwei Frauen, Marie-Louise Hinterauer und Andrea Kaufmann, in den Stadtrat ein. Die Wirtschaftliche Umstrukturierung lief gut, die Fussgaengerzone wurde inzwischen angenommen. Ein grosses Einrichtungshaus eroeffnete an der Autobahnauffahrt Sued."}],"id":"E156"},{"year":1996,"year_end":null,"date_precision":"year","title":"Erste FH-Diplomingenieure - Zumtobel kauft Knobel","summary":"1996 absolvierten die ersten 31 Diplomingenieure FH ihr Studium in Dornbirn. Im selben Jahr uebernahm die Zumtobel-Gruppe den schweizerischen Vorschaltgeraetehersteller Knobel, der bereits 1940 ein Vorreiter dieser Technik gewesen war.","people":[],"places":["Dornbirn"],"category":"Bildung","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 54"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Erste FH-Diplomingenieure - Zumtobel kauft Knobel","summary":"1996 absolvierten die ersten 31 Diplomingenieure FH ihr Studium in Dornbirn. Im selben Jahr uebernahm die Zumtobel-Gruppe den schweizerischen Vorschaltgeraetehersteller Knobel, der bereits 1940 ein Vorreiter dieser Technik gewesen war."}],"id":"E157"},{"year":1996,"year_end":null,"date_precision":"year","title":"Hotel Martinspark und Feuerwehrhaus","summary":"Im Jahr 1996 entstanden zwei herausragende Neubauten in Dornbirn: das Hotel Martinspark durch das Architekturbuero Baumschlager/Eberle und das Feuerwehrhaus durch Wolfgang Ritsch. Beide Bauten markierten den Aufschwung einer eigenstaendigen Vorarlberger Architektur, die internationale Beachtung fand.","people":["Wolfgang Ritsch"],"places":["Dornbirn"],"category":"Bauten","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 101"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Hotel Martinspark und Feuerwehrhaus","summary":"Im Jahr 1996 entstanden zwei herausragende Neubauten in Dornbirn: das Hotel Martinspark durch das Architekturbuero Baumschlager/Eberle und das Feuerwehrhaus durch Wolfgang Ritsch. Beide Bauten markierten den Aufschwung einer eigenstaendigen Vorarlberger Architektur, die internationale Beachtung fand."}],"id":"E158"},{"year":1997,"year_end":2012,"date_precision":"year_range","title":"Business Göte - Mentoring-Programm für Dornbirner Unternehmer","summary":"Vom Standort- und Gründerzentrum wird das aus dem angelsächsischen Raum stammende 'Business Göte'-Konzept (Wirtschaftspate) für Dornbirn adaptiert. Erfolgreiche Unternehmer nehmen sich Zeit und Geduld, um Neugründern als 'Sparringpartner' zur Seite zu stehen und sie auf Hürden und Fallstricke aufmerksam zu machen. Den Jungen hilft die Erfahrung, den Älteren helfen die neuen Ideen. Eine typisch dornbirnerische Win-Win-Situation, die den gesamten Wirtschaftsstandort stärkt. In den vergangenen zehn Jahren wurden so viele Firmen gegründet wie in den 50 Jahren davor.","people":["Gerald Mathis","Marco Fehr"],"places":["Dornbirn"],"category":"Wirtschaft","sources":["Hämmerle: Innovation"],"page_hints":["Hämmerle: Innovation S. 11-12"],"alt_titles":[],"source_summaries":[{"book":"Hämmerle: Innovation","title":"Business Göte - Mentoring-Programm für Dornbirner Unternehmer","summary":"Vom Standort- und Gründerzentrum wird das aus dem angelsächsischen Raum stammende 'Business Göte'-Konzept (Wirtschaftspate) für Dornbirn adaptiert. Erfolgreiche Unternehmer nehmen sich Zeit und Geduld, um Neugründern als 'Sparringpartner' zur Seite zu stehen und sie auf Hürden und Fallstricke aufmerksam zu machen. Den Jungen hilft die Erfahrung, den Älteren helfen die neuen Ideen. Eine typisch dornbirnerische Win-Win-Situation, die den gesamten Wirtschaftsstandort stärkt. In den vergangenen zehn Jahren wurden so viele Firmen gegründet wie in den 50 Jahren davor."}],"id":"E159"},{"year":1997,"year_end":null,"date_precision":"year","title":"Einrichtung des Standort- und Gründerzentrums","summary":"1997 wird das Standort- und Gründerzentrum als Servicestelle für die Dornbirner Wirtschaft eingerichtet. Ursprünglich konzipiert, um nach der Textilkrise neue Unternehmen nach Dornbirn zu locken, entwickelt es sich zu einer breit aufgestellten Anlaufstelle. Das von der Stadt eingerichtete Büro wird outgesourced und von einem europaweit tätigen Unternehmen betrieben. Geleitet von Gerald Mathis und Marco Fehr, ist es erste Anlaufstelle für Unternehmen bei Grundstückssuche, Förderungen oder Lehrlingen. Dornbirn leistet damit Pionierarbeit und findet zahlreiche Nachahmer.","people":["Gerald Mathis","Marco Fehr"],"places":["Dornbirn"],"category":"Wirtschaft","sources":["Aberer: Stadtentwicklung","Hämmerle: Innovation"],"page_hints":["Aberer: Stadtentwicklung S. 25","Hämmerle: Innovation S. 10-13"],"alt_titles":["Gruendung Standort- und Gruenderzentrum (etwa)"],"source_summaries":[{"book":"Aberer: Stadtentwicklung","title":"Gruendung Standort- und Gruenderzentrum (etwa)","summary":"Etwa Mitte der 1990er Jahre wurde in Dornbirn das ausgelagerte Standort- und Gruenderzentrum eingerichtet. Es wirkt hochaktiv in der aktiven Bodenpolitik mit und begleitet junge Unternehmer bei Gruendung und Staerkung in ihrer Anfangsphase. Damit erhielt die Stadtentwicklung ein operatives Werkzeug zur Wirtschaftsfoerderung und Flaechenakquisition. Das Zentrum bereitet auch Standorte und Interventionen fuer die Beschlussfassung der Arbeitsgruppe Flaechenmanagement vor."},{"book":"Hämmerle: Innovation","title":"Einrichtung des Standort- und Gründerzentrums","summary":"1997 wird das Standort- und Gründerzentrum als Servicestelle für die Dornbirner Wirtschaft eingerichtet. Ursprünglich konzipiert, um nach der Textilkrise neue Unternehmen nach Dornbirn zu locken, entwickelt es sich zu einer breit aufgestellten Anlaufstelle. Das von der Stadt eingerichtete Büro wird outgesourced und von einem europaweit tätigen Unternehmen betrieben. Geleitet von Gerald Mathis und Marco Fehr, ist es erste Anlaufstelle für Unternehmen bei Grundstückssuche, Förderungen oder Lehrlingen. Dornbirn leistet damit Pionierarbeit und findet zahlreiche Nachahmer."}],"id":"E160"},{"year":1997,"year_end":2012,"date_precision":"year_range","title":"Gewerbepark Rhomberg's Fabrik als Modell der Nachnutzung","summary":"Nach dem Konkurs 1994 entwickelt Rhomberg-Bau auf dem ca. 8 ha großen Areal der ehemaligen F.M. Rhomberg-Färberei den wohl größten Gewerbepark Westösterreichs. Die Stadt erwarb ca. 1,2 ha samt Gebäudeteilen, Rhomberg-Bau kaufte ca. 6 ha. Für Straßenausbauten lukrierte die Stadt etwa 15% EU-Förderung. Ein Viertel der Fläche wurde weiterverkauft, drei Viertel grundsaniert und vermietet. Heute arbeiten dort über 100 Betriebe mit rund 1.700 Mitarbeitern - vier Mal so viele wie zu Zeiten der Färberei.","people":[],"places":["Dornbirn"],"category":"Wirtschaft","sources":["Hämmerle: Innovation"],"page_hints":["Hämmerle: Innovation S. 18-19"],"alt_titles":[],"source_summaries":[{"book":"Hämmerle: Innovation","title":"Gewerbepark Rhomberg's Fabrik als Modell der Nachnutzung","summary":"Nach dem Konkurs 1994 entwickelt Rhomberg-Bau auf dem ca. 8 ha großen Areal der ehemaligen F.M. Rhomberg-Färberei den wohl größten Gewerbepark Westösterreichs. Die Stadt erwarb ca. 1,2 ha samt Gebäudeteilen, Rhomberg-Bau kaufte ca. 6 ha. Für Straßenausbauten lukrierte die Stadt etwa 15% EU-Förderung. Ein Viertel der Fläche wurde weiterverkauft, drei Viertel grundsaniert und vermietet. Heute arbeiten dort über 100 Betriebe mit rund 1.700 Mitarbeitern - vier Mal so viele wie zu Zeiten der Färberei."}],"id":"E161"},{"year":1997,"year_end":null,"date_precision":"year","title":"Nur noch 1900 Textil-Beschaeftigte","summary":"Vierzehn Jahre nach dem ersten grossen Konkurs (Herrburger und Rhomberg 1983) arbeiteten 1997 nicht einmal mehr die Haelfte, naemlich nur noch 1900 Beschaeftigte, in Dornbirns Textil- und Bekleidungsindustrie. Mit der Globalisierung und dem GATT-Beitritt (Uruguay-Runde) hatte ein rasanter Strukturwandel begonnen, der die Produktion in Billiglohn- und Schwellenlaender verlagerte.","people":[],"places":["Dornbirn"],"category":"Industrie","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 11"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Nur noch 1900 Textil-Beschaeftigte","summary":"Vierzehn Jahre nach dem ersten grossen Konkurs (Herrburger und Rhomberg 1983) arbeiteten 1997 nicht einmal mehr die Haelfte, naemlich nur noch 1900 Beschaeftigte, in Dornbirns Textil- und Bekleidungsindustrie. Mit der Globalisierung und dem GATT-Beitritt (Uruguay-Runde) hatte ein rasanter Strukturwandel begonnen, der die Produktion in Billiglohn- und Schwellenlaender verlagerte."}],"id":"E162"},{"year":1997,"year_end":null,"date_precision":"year","title":"Spielboden zieht ins Rhomberg-Areal um","summary":"Im Jahr 1997 konnte der Spielboden in groessere, technisch besser ausgestattete Raeumlichkeiten im Rhomberg-Areal umziehen. Bei rund 200 Veranstaltungen im Jahr verdoppelte sich die Publikumsfrequenz. Im selben Jahr wurde das Vorarlberger Architekturinstitut (vai) als Verein gegruendet.","people":[],"places":["Dornbirn","Rhomberg-Areal"],"category":"Kultur","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 100-101"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Spielboden zieht ins Rhomberg-Areal um","summary":"Im Jahr 1997 konnte der Spielboden in groessere, technisch besser ausgestattete Raeumlichkeiten im Rhomberg-Areal umziehen. Bei rund 200 Veranstaltungen im Jahr verdoppelte sich die Publikumsfrequenz. Im selben Jahr wurde das Vorarlberger Architekturinstitut (vai) als Verein gegruendet."}],"id":"E163"},{"year":1998,"year_end":null,"date_precision":"year","title":"Luxmate Controls auf Lichtmanagement konzentriert","summary":"Seit 1998 konzentriert sich Luxmate Controls, eine Tochtergesellschaft der Zumtobel AG, auf das elektronische Lichtmanagement. Noch vor der Jahrtausendwende eroeffnete Zumtobel Staff die ersten Vertriebsbueros in Hongkong und Kuala Lumpur und fasste Fuss in Asien.","people":[],"places":["Dornbirn"],"category":"Industrie","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 69"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Luxmate Controls auf Lichtmanagement konzentriert","summary":"Seit 1998 konzentriert sich Luxmate Controls, eine Tochtergesellschaft der Zumtobel AG, auf das elektronische Lichtmanagement. Noch vor der Jahrtausendwende eroeffnete Zumtobel Staff die ersten Vertriebsbueros in Hongkong und Kuala Lumpur und fasste Fuss in Asien."}],"id":"E164"},{"year":1999,"year_end":null,"date_precision":"year","title":"61 Vollbauern und 266 Hobbybauern in Dornbirn","summary":"Schon vor etwa 10 Jahren (1999) gab es in Dornbirn nur noch 61 Vollbauern (landwirtschaftliche Vollerwerbsbetriebe) und 266 Hobbybauern (Nebenerwerbsbetriebe). Die Vollerwerbsbetriebe bewirtschaften dafuer immer groessere Flaechen auf Kosten der Nebenerwerbslandwirte. Dieser Trend hat sich weiter fortgesetzt.","people":[],"places":["Dornbirn"],"category":"Wirtschaft","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 88"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"61 Vollbauern und 266 Hobbybauern in Dornbirn","summary":"Schon vor etwa 10 Jahren (1999) gab es in Dornbirn nur noch 61 Vollbauern (landwirtschaftliche Vollerwerbsbetriebe) und 266 Hobbybauern (Nebenerwerbsbetriebe). Die Vollerwerbsbetriebe bewirtschaften dafuer immer groessere Flaechen auf Kosten der Nebenerwerbslandwirte. Dieser Trend hat sich weiter fortgesetzt."}],"id":"E165"},{"year":1999,"year_end":null,"date_precision":"year","title":"Rolls-Royce-Museum im Guetle eroeffnet","summary":"1999 ermoeglichten Stadt Dornbirn, Land Vorarlberg, F.M. Haemmerle Holding AG und Familie Vonier nach der Sanierung des Spinnerei-Hochbaus Guetle um 1.453.457 Euro die Einrichtung eines Rolls-Royce-Museums. Es ist das weltgroesste Rolls-Royce-Museum mit ueber 1000 Exponaten auf 3000 m2 Ausstellungsflaeche. Neben dem Paradewagen der Queen Mum finden sich Fahrzeuge von Lawrence of Arabia, John Lennon oder Diktator Franco. Im selben Jahr beschlossen Stadt und Land die Errichtung der inatura im Ruesch-Areal.","people":["Franz Vonier"],"places":["Dornbirn","Guetle"],"category":"Kultur","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 32"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Rolls-Royce-Museum im Guetle eroeffnet","summary":"1999 ermoeglichten Stadt Dornbirn, Land Vorarlberg, F.M. Haemmerle Holding AG und Familie Vonier nach der Sanierung des Spinnerei-Hochbaus Guetle um 1.453.457 Euro die Einrichtung eines Rolls-Royce-Museums. Es ist das weltgroesste Rolls-Royce-Museum mit ueber 1000 Exponaten auf 3000 m2 Ausstellungsflaeche. Neben dem Paradewagen der Queen Mum finden sich Fahrzeuge von Lawrence of Arabia, John Lennon oder Diktator Franco. Im selben Jahr beschlossen Stadt und Land die Errichtung der inatura im Ruesch-Areal."}],"id":"E166"},{"year":1999,"year_end":null,"date_precision":"year","title":"Wolfgang Ruemmele wird Buergermeister","summary":"Am 6. April 1999 wurde Wolfgang Ruemmele nach dem Ruecktritt von Rudolf Sohm von der Gemeindevertretung zum neuen Buergermeister von Dornbirn gewaehlt. Dr. Guntram Feurstein wurde Vizebuergermeister. Ruemmele war Absolvent der Universitaet fuer Bodenkultur, dann Biologielehrer am Bundesgymnasium Dornbirn. Im selben Jahr 1999 eroeffnete die weltweit groesste private Rolls-Royce-Sammlung in Dornbirn und das vai mit seiner Initialausstellung. Die Eigentumsanlage Atriumhaus von Roland Gnaiger und Udo Moessler wurde eroeffnet. Auch das Jazzseminar zog mit der Ballettklasse in den Kehlerpark.","people":["Wolfgang Ruemmele","Rudolf Sohm","Guntram Feurstein","Roland Gnaiger"],"places":["Dornbirn"],"category":"Politik","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 99, 101, 107"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Wolfgang Ruemmele wird Buergermeister","summary":"Am 6. April 1999 wurde Wolfgang Ruemmele nach dem Ruecktritt von Rudolf Sohm von der Gemeindevertretung zum neuen Buergermeister von Dornbirn gewaehlt. Dr. Guntram Feurstein wurde Vizebuergermeister. Ruemmele war Absolvent der Universitaet fuer Bodenkultur, dann Biologielehrer am Bundesgymnasium Dornbirn. Im selben Jahr 1999 eroeffnete die weltweit groesste private Rolls-Royce-Sammlung in Dornbirn und das vai mit seiner Initialausstellung. Die Eigentumsanlage Atriumhaus von Roland Gnaiger und Udo Moessler wurde eroeffnet. Auch das Jazzseminar zog mit der Ballettklasse in den Kehlerpark."}],"id":"E167"},{"year":2000,"year_end":null,"date_precision":"year","title":"Abgabe der Produktion von F.M. Haemmerle und erste Buergermeister-Direktwahl","summary":"Im Jahr 2000 war das einstige Paradeunternehmen F.M. Haemmerle gezwungen, seine Produktion - rund 500 Beschaeftigte in Dornbirn - mit einem Sanierungszuschuss von 80 Millionen Schilling abzugeben. Das Traditionsunternehmen besteht nur noch als Holding fort. Bei der Gemeinderatswahl im Fruehjahr 2000 wurde erstmals eine Buergermeister-Direktwahl durchgefuehrt. Wolfgang Ruemmele wurde mit 65 Prozent gewaehlt. Im selben Jahr erfolgte der Spatenstich fuer die neue Naturschau inatura auf dem Firmengelaende der ehemaligen Rueschwerke.","people":["Wolfgang Ruemmele"],"places":["Dornbirn"],"category":"Wirtschaft","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 96-97, 101, 107"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Abgabe der Produktion von F.M. Haemmerle und erste Buergermeister-Direktwahl","summary":"Im Jahr 2000 war das einstige Paradeunternehmen F.M. Haemmerle gezwungen, seine Produktion - rund 500 Beschaeftigte in Dornbirn - mit einem Sanierungszuschuss von 80 Millionen Schilling abzugeben. Das Traditionsunternehmen besteht nur noch als Holding fort. Bei der Gemeinderatswahl im Fruehjahr 2000 wurde erstmals eine Buergermeister-Direktwahl durchgefuehrt. Wolfgang Ruemmele wurde mit 65 Prozent gewaehlt. Im selben Jahr erfolgte der Spatenstich fuer die neue Naturschau inatura auf dem Firmengelaende der ehemaligen Rueschwerke."}],"id":"E168"},{"year":2000,"year_end":null,"date_precision":"year","title":"Ankauf 2,5 ha Textilareal fuer FH-Erweiterung","summary":"Im Herbst 2000 konnte die Stadt Dornbirn ein rund 2,5 Hektar grosses Textilareal in zentraler Lage fuer die Erweiterung der Fachhochschule Vorarlberg erwerben. Dieser strategische Bodenankauf legte den Grundstein fuer die Entwicklung Dornbirns zur Hochschulstadt am stadtkulturellen Brueckenkopf an der Saegerbruecke. Die Ansiedlung der Fachhochschule auf zentralen ehemaligen Industriegruenden ist ein Paradebeispiel der erfolgreichen Nachnutzung von Industriearealen in Dornbirn.","people":[],"places":["Dornbirn","Saegerbruecke"],"category":"Bildung","sources":["Aberer: Stadtentwicklung"],"page_hints":["Aberer: Stadtentwicklung S. 29"],"alt_titles":[],"source_summaries":[{"book":"Aberer: Stadtentwicklung","title":"Ankauf 2,5 ha Textilareal fuer FH-Erweiterung","summary":"Im Herbst 2000 konnte die Stadt Dornbirn ein rund 2,5 Hektar grosses Textilareal in zentraler Lage fuer die Erweiterung der Fachhochschule Vorarlberg erwerben. Dieser strategische Bodenankauf legte den Grundstein fuer die Entwicklung Dornbirns zur Hochschulstadt am stadtkulturellen Brueckenkopf an der Saegerbruecke. Die Ansiedlung der Fachhochschule auf zentralen ehemaligen Industriegruenden ist ein Paradebeispiel der erfolgreichen Nachnutzung von Industriearealen in Dornbirn."}],"id":"E169"},{"year":2000,"year_end":null,"date_precision":"year","title":"Heiligsprechung von Katharina Drexel","summary":"Katharina Drexel (1858-1955), Enkelin des Dornbirner Auswanderers Franz Martin Drexel aus Hatlerdorf, wird im Jahr 2000 von Papst Johannes Paul II. heiliggesprochen. Anerkennung findet ihr lebenslanger ideeller, persönlicher und materieller Einsatz für die Missionierung und Beschulung von amerikanischen Ureinwohnern und Schwarzen. Mit der Heiligsprechung erhält Dornbirn – über die Drexel-Linie – seine erste 'Heilige' und einen weltweit sichtbaren Bezugspunkt zur Stadt Philadelphia.","people":["Katharina Drexel","Franz Martin Drexel"],"places":["Philadelphia","Hatlerdorf","Rom"],"category":"Religion","sources":["Pichler: Auswanderer"],"page_hints":["Pichler: Auswanderer S. 19"],"alt_titles":[],"source_summaries":[{"book":"Pichler: Auswanderer","title":"Heiligsprechung von Katharina Drexel","summary":"Katharina Drexel (1858-1955), Enkelin des Dornbirner Auswanderers Franz Martin Drexel aus Hatlerdorf, wird im Jahr 2000 von Papst Johannes Paul II. heiliggesprochen. Anerkennung findet ihr lebenslanger ideeller, persönlicher und materieller Einsatz für die Missionierung und Beschulung von amerikanischen Ureinwohnern und Schwarzen. Mit der Heiligsprechung erhält Dornbirn – über die Drexel-Linie – seine erste 'Heilige' und einen weltweit sichtbaren Bezugspunkt zur Stadt Philadelphia."}],"id":"E170"},{"year":2000,"year_end":2012,"date_precision":"year_range","title":"Kooperation Dornbirn – Drexel University Philadelphia aufgebaut","summary":"Die Stadt Dornbirn und die Dornbirner Fachhochschule bauen transkontinentale Kontakte mit der Drexel University in Philadelphia auf – einer der bedeutendsten Hochschulen an der amerikanischen Ostküste, gegründet 1891 von Anthony J. Drexel, Sohn des aus Hatlerdorf ausgewanderten Bankiers Franz Martin Drexel. Damit wird die historische Verbindung zur 'fünftgrössten Stadt der USA' in eine moderne akademische Partnerschaft überführt. Der Name Drexel ist in Philadelphia bis heute präsent.","people":["Franz Martin Drexel","Anthony J. Drexel"],"places":["Philadelphia","Hatlerdorf","Dornbirn"],"category":"Bildung","sources":["Pichler: Auswanderer"],"page_hints":["Pichler: Auswanderer S. 60-61"],"alt_titles":[],"source_summaries":[{"book":"Pichler: Auswanderer","title":"Kooperation Dornbirn – Drexel University Philadelphia aufgebaut","summary":"Die Stadt Dornbirn und die Dornbirner Fachhochschule bauen transkontinentale Kontakte mit der Drexel University in Philadelphia auf – einer der bedeutendsten Hochschulen an der amerikanischen Ostküste, gegründet 1891 von Anthony J. Drexel, Sohn des aus Hatlerdorf ausgewanderten Bankiers Franz Martin Drexel. Damit wird die historische Verbindung zur 'fünftgrössten Stadt der USA' in eine moderne akademische Partnerschaft überführt. Der Name Drexel ist in Philadelphia bis heute präsent."}],"id":"E171"},{"year":2000,"year_end":2012,"date_precision":"year_range","title":"Prisma als Standortentwickler in Dornbirn","summary":"In den 2000er Jahren setzt das Unternehmen Prisma unter geschäftsführendem Gesellschafter Bernhard Ölz in Dornbirn fünf für die Stadtentwicklung relevante Projekte um, sowohl in der Innenstadt als auch im Umfeld ehemaliger Betriebsareale. Prisma versteht sich nicht als Bauträger, sondern als Standortentwickler, der Impulse setzt. In den Wirtschaftsparks gibt es Kinderbetreuung, soziales Leben, betreutes Wohnen und Gastronomie. Direkt neben der Fachhochschule betreibt Prisma gemeinsam mit der Stadt einen Wirtschaftspark für kreative Unternehmen. Motto: 'Vor dem Raum kommt das Leben'.","people":["Bernhard Ölz"],"places":["Dornbirn","Bodenseeraum"],"category":"Stadtentwicklung","sources":["Hämmerle: Innovation"],"page_hints":["Hämmerle: Innovation S. 21-23"],"alt_titles":[],"source_summaries":[{"book":"Hämmerle: Innovation","title":"Prisma als Standortentwickler in Dornbirn","summary":"In den 2000er Jahren setzt das Unternehmen Prisma unter geschäftsführendem Gesellschafter Bernhard Ölz in Dornbirn fünf für die Stadtentwicklung relevante Projekte um, sowohl in der Innenstadt als auch im Umfeld ehemaliger Betriebsareale. Prisma versteht sich nicht als Bauträger, sondern als Standortentwickler, der Impulse setzt. In den Wirtschaftsparks gibt es Kinderbetreuung, soziales Leben, betreutes Wohnen und Gastronomie. Direkt neben der Fachhochschule betreibt Prisma gemeinsam mit der Stadt einen Wirtschaftspark für kreative Unternehmen. Motto: 'Vor dem Raum kommt das Leben'."}],"id":"E172"},{"year":2000,"year_end":null,"date_precision":"year","title":"Zumtobel uebernimmt Thorn Lighting - Tobias Ilg Hof","summary":"2000 erfolgte mit der Uebernahme der britischen Wassall-Group und der Eingliederung der Thorn Lighting Group in den Zumtobel-Konzern ein anfaenglich schwieriger, aber wichtiger Konsolidierungsschritt in der europaeischen Lichtindustrie. Im selben Jahr uebernahm Tobias Ilg im Hatlerdorf als gelernter Land- und Forstwirt den Familienhof und erkannte, dass man Holz aus den Waeldern besser verkaufen kann als Milch.","people":["Tobias Ilg"],"places":["Dornbirn","Hatlerdorf"],"category":"Industrie","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 69"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Zumtobel uebernimmt Thorn Lighting - Tobias Ilg Hof","summary":"2000 erfolgte mit der Uebernahme der britischen Wassall-Group und der Eingliederung der Thorn Lighting Group in den Zumtobel-Konzern ein anfaenglich schwieriger, aber wichtiger Konsolidierungsschritt in der europaeischen Lichtindustrie. Im selben Jahr uebernahm Tobias Ilg im Hatlerdorf als gelernter Land- und Forstwirt den Familienhof und erkannte, dass man Holz aus den Waeldern besser verkaufen kann als Milch."}],"id":"E173"},{"year":2001,"year_end":null,"date_precision":"year","title":"Drexel-Grosshandelszentrale uebersiedelt ins Wallenmahd","summary":"Um die Jahrtausendwende wurde die SPAR-Grosshandelszentrale der Brueder Drexel in der Birkenwiese zu klein und uebersiedelte 2001 ins Wallenmahd. Von dort werden heute ueber 100 Filialen in Vorarlberg beliefert. Diese Handelszentrale ist ein modernes, ausgekluegeltes Logistikzentrum.","people":["Drexel"],"places":["Dornbirn","Wallenmahd"],"category":"Wirtschaft","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 76"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Drexel-Grosshandelszentrale uebersiedelt ins Wallenmahd","summary":"Um die Jahrtausendwende wurde die SPAR-Grosshandelszentrale der Brueder Drexel in der Birkenwiese zu klein und uebersiedelte 2001 ins Wallenmahd. Von dort werden heute ueber 100 Filialen in Vorarlberg beliefert. Diese Handelszentrale ist ein modernes, ausgekluegeltes Logistikzentrum."}],"id":"E174"},{"year":2002,"year_end":null,"date_precision":"year","title":"Gruendung des Theaters im Kopfbau (TIK)","summary":"Im Jahr 2002 schlossen sich im TIK (Theater im Kopfbau) auf Initiative von Martin Greil eine Reihe von ganz unterschiedlichen Theatergruppen in den alten Raeumlichkeiten des Spielbodens zusammen. Damit erhielten verschiedene Theaterprojekte in Dornbirn eine eigene Spielstaette.","people":["Martin Greil"],"places":["Dornbirn"],"category":"Kultur","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 100"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Gruendung des Theaters im Kopfbau (TIK)","summary":"Im Jahr 2002 schlossen sich im TIK (Theater im Kopfbau) auf Initiative von Martin Greil eine Reihe von ganz unterschiedlichen Theatergruppen in den alten Raeumlichkeiten des Spielbodens zusammen. Damit erhielten verschiedene Theaterprojekte in Dornbirn eine eigene Spielstaette."}],"id":"E175"},{"year":2002,"year_end":null,"date_precision":"year","title":"Krippenmuseum im Glockenturm Guetle - Oelz Wallenmahd","summary":"2002 wurde der alte Stadel mit dem Gloeckeleturm im Guetle vom Krippenbauverein Dornbirn ausgebaut, und danach wurde ein Krippenmuseum eingerichtet. Im selben Jahr begann Oelz im Wallenmahd den Bau neuer Produktionslinien fuer die positive Entwicklung des Absatzes nach Osteuropa.","people":[],"places":["Dornbirn","Guetle","Wallenmahd"],"category":"Kultur","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 33"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Krippenmuseum im Glockenturm Guetle - Oelz Wallenmahd","summary":"2002 wurde der alte Stadel mit dem Gloeckeleturm im Guetle vom Krippenbauverein Dornbirn ausgebaut, und danach wurde ein Krippenmuseum eingerichtet. Im selben Jahr begann Oelz im Wallenmahd den Bau neuer Produktionslinien fuer die positive Entwicklung des Absatzes nach Osteuropa."}],"id":"E176"},{"year":2003,"year_end":null,"date_precision":"year","title":"Eroeffnung der inatura im Stadtzentrum","summary":"Im Jahr 2003 wurde die inatura eroeffnet, eines der groessten naturkundlichen Museen Oesterreichs. Sie entstand auf einem ehemaligen Industrieareal in zentraler Lage und ist umgeben von einem rund zwei Hektar grossen Stadtgarten. Die grosse staedtische Investition bewirkte zudem hochwertigen Wohnbau in direkter Nachbarschaft in der Innenstadt. Die inatura wurde so zu einem zentralen Element der Innenstadtentwicklung und zum Beleg fuer das Postulat hochwertiger Architektur bei oeffentlichen Bauten.","people":["Christian Lenz","Dietrich Untertrifaller"],"places":["Dornbirn","Stadtgarten","Rueschareal","Müllerbach"],"category":"Kultur","sources":["Matt: Geschichte Dornbirns","Aberer: Stadtentwicklung","Fessler: Wirtschaften","Hämmerle: Innovation"],"page_hints":["Matt: Geschichte Dornbirns S. 101","Aberer: Stadtentwicklung S. 29","Fessler: Wirtschaften S. 63","Hämmerle: Innovation S. 21"],"alt_titles":["Eroeffnung der inatura im Rueschareal","Eroeffnung inatura - Kunstraum Dornbirn","Eröffnung der inatura im Areal der ehemaligen Rüsch-Werke"],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Eroeffnung der inatura im Rueschareal","summary":"Im Jahr 2003 wurde die inatura - Erlebnis Naturschau Dornbirn im ehemaligen Rueschareal vom Architektenduo Christian Lenz und Dietrich Untertrifaller eroeffnet. Die Nachfolge des Naturmuseums aus dem Jahr 1960 ist heute eines der bedeutendsten Naturkundemuseen Vorarlbergs."},{"book":"Aberer: Stadtentwicklung","title":"Eroeffnung der inatura im Stadtzentrum","summary":"Im Jahr 2003 wurde die inatura eroeffnet, eines der groessten naturkundlichen Museen Oesterreichs. Sie entstand auf einem ehemaligen Industrieareal in zentraler Lage und ist umgeben von einem rund zwei Hektar grossen Stadtgarten. Die grosse staedtische Investition bewirkte zudem hochwertigen Wohnbau in direkter Nachbarschaft in der Innenstadt. Die inatura wurde so zu einem zentralen Element der Innenstadtentwicklung und zum Beleg fuer das Postulat hochwertiger Architektur bei oeffentlichen Bauten."},{"book":"Fessler: Wirtschaften","title":"Eroeffnung inatura - Kunstraum Dornbirn","summary":"Im Juni 2003 wurde die inatura im Ruesch-Werke-Areal als Erlebnis-Naturschau eroeffnet. Zu den Attraktionen gehoeren ein Lawinensimulator, ein Unterwasserkino, ein Wolfsrudel, eine Erdbebenstation, Rieseninsekten und ein glaeserner Fluss. In guten Jahren werden 100.000 Besucher ueberschritten. Im selben Jahr wurde der Kunstraum Dornbirn in der Montagehalle eroeffnet, und das Kleinkraftwerk Inatura mit Zuppinger-Wasserrad ging in Betrieb."},{"book":"Hämmerle: Innovation","title":"Eröffnung der inatura im Areal der ehemaligen Rüsch-Werke","summary":"Im Juni 2003 wird die Neue Vorarlberger Naturschau (inatura) in den alten Hallen der ehemaligen Rüsch-Werke eröffnet. Das naturkundliche Museum mit rund 2.500 m² Ausstellungsfläche entstand in Zusammenarbeit mit dem Eigentümer F.M. Hämmerle Holding AG. Neben der musealen Nutzung wurde ein ca. 2 ha großer Stadtgarten in zentraler Lage verwirklicht. Die inatura hat sich gemeinsam mit dem Stadtgarten zu einem Anziehungspunkt und Erholungsoase entwickelt."}],"id":"E177"},{"year":2004,"year_end":null,"date_precision":"year","title":"Bologna-Umstellung der Fachhochschule","summary":"2004 musste die Fachhochschule Vorarlberg nach EU-Vorgabe auf Bachelor- und Masterstudiengaenge umgestellt werden. Es wurden Studien wie Mechatronik, Berufsbegleitende und Vollzeit-Betriebswirtschaft, Mediengestaltung, Informatik und Sozialarbeit angeboten. Die Schwerpunkte konzentrieren sich auf Technik, Wirtschaft, Gestaltung und Soziales.","people":[],"places":["Dornbirn"],"category":"Bildung","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 54"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Bologna-Umstellung der Fachhochschule","summary":"2004 musste die Fachhochschule Vorarlberg nach EU-Vorgabe auf Bachelor- und Masterstudiengaenge umgestellt werden. Es wurden Studien wie Mechatronik, Berufsbegleitende und Vollzeit-Betriebswirtschaft, Mediengestaltung, Informatik und Sozialarbeit angeboten. Die Schwerpunkte konzentrieren sich auf Technik, Wirtschaft, Gestaltung und Soziales."}],"id":"E178"},{"year":2004,"year_end":null,"date_precision":"year","title":"Krankenhaus-Zubau durch Gohm/Hiessberger","summary":"Im Jahr 2004 wurde der Zubau des Dornbirner Krankenhauses durch das Architekturbuero Gohm/Hiessberger fertiggestellt. Das Krankenhaus an der Saubrache war urspruenglich 1841 als Kaserne errichtet und dann als Armenhaus genutzt worden, bevor es zum Krankenhaus wurde.","people":[],"places":["Dornbirn"],"category":"Bauten","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 101"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Krankenhaus-Zubau durch Gohm/Hiessberger","summary":"Im Jahr 2004 wurde der Zubau des Dornbirner Krankenhauses durch das Architekturbuero Gohm/Hiessberger fertiggestellt. Das Krankenhaus an der Saubrache war urspruenglich 1841 als Kaserne errichtet und dann als Armenhaus genutzt worden, bevor es zum Krankenhaus wurde."}],"id":"E179"},{"year":2005,"year_end":null,"date_precision":"year","title":"Neues Stadtbad durch Cukrowicz/Nachbaur und Wiederwahl Ruemmele","summary":"Im Jahr 2005 wurde das Stadtbad durch das Architekturbuero Cukrowicz/Nachbaur eroeffnet. Bei der Gemeinderatswahl 2005 wurde Wolfgang Ruemmele mit 65,6 Prozent bei der Buergermeisterdirektwahl bestaetigt. Die OuVP erreichte 58 Prozent, die SPOu 23 Prozent, die Gruenen 11 Prozent, die FPOu verlor deutlich auf 8 Prozent.","people":["Wolfgang Ruemmele"],"places":["Dornbirn"],"category":"Bauten","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 101, 107"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Neues Stadtbad durch Cukrowicz/Nachbaur und Wiederwahl Ruemmele","summary":"Im Jahr 2005 wurde das Stadtbad durch das Architekturbuero Cukrowicz/Nachbaur eroeffnet. Bei der Gemeinderatswahl 2005 wurde Wolfgang Ruemmele mit 65,6 Prozent bei der Buergermeisterdirektwahl bestaetigt. Die OuVP erreichte 58 Prozent, die SPOu 23 Prozent, die Gruenen 11 Prozent, die FPOu verlor deutlich auf 8 Prozent."}],"id":"E180"},{"year":2005,"year_end":2006,"date_precision":"year_range","title":"Schmetterlings-Erhebung im Fohramoos","summary":"In den Vegetationsperioden 2005 und 2006 wurden im Fohramoos im Rahmen einer gezielten Erhebung 474 Schmetterlingsarten beobachtet. Neun Arten konnten dabei erstmals für das Bundesland Vorarlberg registriert werden, darunter Bewohner der Hochmoore. Die Untersuchung lieferte wichtige Erkenntnisse über die postglaziale Reliktfauna des Schutzgebiets.","people":[],"places":["Dornbirn","Fohramoos"],"category":"Bildung","sources":["Friebe: Naturraum"],"page_hints":["Friebe: Naturraum S. 54"],"alt_titles":[],"source_summaries":[{"book":"Friebe: Naturraum","title":"Schmetterlings-Erhebung im Fohramoos","summary":"In den Vegetationsperioden 2005 und 2006 wurden im Fohramoos im Rahmen einer gezielten Erhebung 474 Schmetterlingsarten beobachtet. Neun Arten konnten dabei erstmals für das Bundesland Vorarlberg registriert werden, darunter Bewohner der Hochmoore. Die Untersuchung lieferte wichtige Erkenntnisse über die postglaziale Reliktfauna des Schutzgebiets."}],"id":"E181"},{"year":2005,"year_end":null,"date_precision":"year","title":"Staedtisches Kulturleitbild mit den vier A's","summary":"Das staedtische Kulturleitbild 2005 formulierte die vier A's als programmatische Leitlinien des kulturellen Lebens in Dornbirn: Avantgarde, Alltagskultur, aus dem Alternativbereich gewachsene Kultur sowie Architektur. Dieses Leitbild unterstreicht die Bedeutung der weichen Standortfaktoren fuer die Stadtentwicklung und positioniert Architektur explizit als Teil des Kulturbegriffs. Es wirkt als Richtschnur fuer kulturelle Foerderpolitik und oeffentliche Bauprojekte.","people":[],"places":["Dornbirn"],"category":"Kultur","sources":["Aberer: Stadtentwicklung"],"page_hints":["Aberer: Stadtentwicklung S. 29"],"alt_titles":[],"source_summaries":[{"book":"Aberer: Stadtentwicklung","title":"Staedtisches Kulturleitbild mit den vier A's","summary":"Das staedtische Kulturleitbild 2005 formulierte die vier A's als programmatische Leitlinien des kulturellen Lebens in Dornbirn: Avantgarde, Alltagskultur, aus dem Alternativbereich gewachsene Kultur sowie Architektur. Dieses Leitbild unterstreicht die Bedeutung der weichen Standortfaktoren fuer die Stadtentwicklung und positioniert Architektur explizit als Teil des Kulturbegriffs. Es wirkt als Richtschnur fuer kulturelle Foerderpolitik und oeffentliche Bauprojekte."}],"id":"E182"},{"year":2006,"year_end":null,"date_precision":"year","title":"Biowaerme Hatlerdorf - Tobias Ilg gruendet Heizwerk","summary":"Tobias Ilg errichtete 2006 gemeinsam mit seinem Bruder Bernhard in seinem Haus an der Hatlerstrasse ein modernes Heizwerk zur Verbrennung von Hackschnitzeln und gruendete die Biowaerme Hatlerdorf GesbR. Das Projekt kostete 2,6 Millionen Euro und wurde von der EU gefoerdert. Die Anlage leistet 1780 kW und versorgt mittlerweile 90 private und gewerbliche Verbraucher mit Fernwaerme. Damit wurde aus dem Viehbauern ein Energiebauer.","people":["Tobias Ilg","Bernhard Ilg"],"places":["Dornbirn","Hatlerdorf"],"category":"Wirtschaft","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 90"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Biowaerme Hatlerdorf - Tobias Ilg gruendet Heizwerk","summary":"Tobias Ilg errichtete 2006 gemeinsam mit seinem Bruder Bernhard in seinem Haus an der Hatlerstrasse ein modernes Heizwerk zur Verbrennung von Hackschnitzeln und gruendete die Biowaerme Hatlerdorf GesbR. Das Projekt kostete 2,6 Millionen Euro und wurde von der EU gefoerdert. Die Anlage leistet 1780 kW und versorgt mittlerweile 90 private und gewerbliche Verbraucher mit Fernwaerme. Damit wurde aus dem Viehbauern ein Energiebauer."}],"id":"E183"},{"year":2006,"year_end":null,"date_precision":"year","title":"Sanierung des Magazins Oberdorf","summary":"Im Jahr 2006 erfolgte die Sanierung des Magazins Oberdorf durch das Architekturbuero Heim/Mueller. Die Sanierung war Teil einer Welle von Revitalisierungen historischer Industrie- und Wirtschaftsgebaeude in Dornbirn.","people":[],"places":["Oberdorf","Dornbirn"],"category":"Bauten","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 101"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Sanierung des Magazins Oberdorf","summary":"Im Jahr 2006 erfolgte die Sanierung des Magazins Oberdorf durch das Architekturbuero Heim/Mueller. Die Sanierung war Teil einer Welle von Revitalisierungen historischer Industrie- und Wirtschaftsgebaeude in Dornbirn."}],"id":"E184"},{"year":2007,"year_end":2008,"date_precision":"year_range","title":"Mega-Baumax uebersiedelt nach Koeblern","summary":"Der Heimwerker-Baumarkt BAUMAX der Unternehmerfamilie Essl, 1990 in Dornbirn eroeffnet, uebersiedelte 2007/08 wesentlich vergroessert als Mega-Baumax nach Dornbirn-Koeblern. Damit konnte der Vorarlberger Umsatz um 75 Prozent gesteigert werden.","people":["Essl"],"places":["Dornbirn","Koeblern"],"category":"Wirtschaft","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 78"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Mega-Baumax uebersiedelt nach Koeblern","summary":"Der Heimwerker-Baumarkt BAUMAX der Unternehmerfamilie Essl, 1990 in Dornbirn eroeffnet, uebersiedelte 2007/08 wesentlich vergroessert als Mega-Baumax nach Dornbirn-Koeblern. Damit konnte der Vorarlberger Umsatz um 75 Prozent gesteigert werden."}],"id":"E185"},{"year":2007,"year_end":null,"date_precision":"year","title":"Weltgymnaestrada: Ausbau Hauptbahnhof und Haltestelle Schoren","summary":"Zur Weltgymnaestrada 2007 wurden der Hauptbahnhof Dornbirn und die Haltestelle Schoren gemeinsam mit den OEBB sowohl funktionell als auch stadtgestalterisch ausgebaut. Diese Investitionen trugen wesentlich dazu bei, den OEV-Anteil in der Gesamtstadt zu erhoehen. Die Haltestelle Schoren wurde voellig neu errichtet und mit vier Zugaengen samt Lift ausgestattet. Eine weitere Verschraenkung der Verkehrsarten durch bike & ride wurde mit dem Bau eines zweigeschossigen Fahrradhauses beim Bahnhof erreicht.","people":[],"places":["Dornbirn","Bahnhof","Schoren"],"category":"Verkehr","sources":["Aberer: Stadtentwicklung"],"page_hints":["Aberer: Stadtentwicklung S. 35"],"alt_titles":[],"source_summaries":[{"book":"Aberer: Stadtentwicklung","title":"Weltgymnaestrada: Ausbau Hauptbahnhof und Haltestelle Schoren","summary":"Zur Weltgymnaestrada 2007 wurden der Hauptbahnhof Dornbirn und die Haltestelle Schoren gemeinsam mit den OEBB sowohl funktionell als auch stadtgestalterisch ausgebaut. Diese Investitionen trugen wesentlich dazu bei, den OEV-Anteil in der Gesamtstadt zu erhoehen. Die Haltestelle Schoren wurde voellig neu errichtet und mit vier Zugaengen samt Lift ausgestattet. Eine weitere Verschraenkung der Verkehrsarten durch bike & ride wurde mit dem Bau eines zweigeschossigen Fahrradhauses beim Bahnhof erreicht."}],"id":"E186"},{"year":2007,"year_end":null,"date_precision":"year","title":"Wohn- und Pflegebauten rund um Haltestelle Schoren","summary":"Im Umfeld der zur Weltgymnaestrada 2007 neu errichteten Haltestelle Schoren entstanden auf einem ehemaligen privaten Bauhofareal und auf dem Gelaende der alten Sparzentrale gemeinnuetzige Mietwohnungen sowie das zweite staedtische Seniorenhaus mit 30 Wohneinheiten. In der Ecke Bahn- und Achdamm wurde zudem das dritte Pflegeheim mit 105 Betten errichtet, weitere 71 Wohnungen kamen hinzu. Diese Buendelung von Wohnen, Pflege und Mobilitaet rund um eine Bahnhaltestelle illustriert die abgestimmte Siedlungs- und Mobilitaetsentwicklung in Dornbirn.","people":[],"places":["Schoren","Achdamm"],"category":"Soziales","sources":["Aberer: Stadtentwicklung"],"page_hints":["Aberer: Stadtentwicklung S. 35"],"alt_titles":[],"source_summaries":[{"book":"Aberer: Stadtentwicklung","title":"Wohn- und Pflegebauten rund um Haltestelle Schoren","summary":"Im Umfeld der zur Weltgymnaestrada 2007 neu errichteten Haltestelle Schoren entstanden auf einem ehemaligen privaten Bauhofareal und auf dem Gelaende der alten Sparzentrale gemeinnuetzige Mietwohnungen sowie das zweite staedtische Seniorenhaus mit 30 Wohneinheiten. In der Ecke Bahn- und Achdamm wurde zudem das dritte Pflegeheim mit 105 Betten errichtet, weitere 71 Wohnungen kamen hinzu. Diese Buendelung von Wohnen, Pflege und Mobilitaet rund um eine Bahnhaltestelle illustriert die abgestimmte Siedlungs- und Mobilitaetsentwicklung in Dornbirn."}],"id":"E187"},{"year":2008,"year_end":null,"date_precision":"year","title":"Konkurs F.M. Haemmerle - Oelz an dritte Generation","summary":"Am 31. Juli 2008 musste auch bei der Paradefirma F.M. Haemmerle das Konkursverfahren eroeffnet werden. Die Passiva betrugen bei einem Mitarbeiterstand von 311 Personen rund 6 Mio. Euro. Es war das endgueltige Aus fuer das einst groesste Textilunternehmen Oesterreichs. Im selben Jahr uebergab Helmut Oelz den Familienbetrieb an seine Soehne Bernhard, Martin und Florian (3. Generation). Auch die Garnfaerberei F.M. Haemmerle Textil am Standort Steinebach war die letzte industrielle Textil-Produktionsstaette.","people":["Franz Martin Haemmerle","Helmut Oelz","Bernhard Oelz","Martin Oelz","Florian Oelz"],"places":["Dornbirn","Steinebach"],"category":"Industrie","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 11"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Konkurs F.M. Haemmerle - Oelz an dritte Generation","summary":"Am 31. Juli 2008 musste auch bei der Paradefirma F.M. Haemmerle das Konkursverfahren eroeffnet werden. Die Passiva betrugen bei einem Mitarbeiterstand von 311 Personen rund 6 Mio. Euro. Es war das endgueltige Aus fuer das einst groesste Textilunternehmen Oesterreichs. Im selben Jahr uebergab Helmut Oelz den Familienbetrieb an seine Soehne Bernhard, Martin und Florian (3. Generation). Auch die Garnfaerberei F.M. Haemmerle Textil am Standort Steinebach war die letzte industrielle Textil-Produktionsstaette."}],"id":"E188"},{"year":2008,"year_end":null,"date_precision":"year","title":"Sanierung des Bahnhofs Dornbirn","summary":"Im Jahr 2008 erfolgte die Sanierung des Bahnhofs Dornbirn durch den Architekten Marco Ostertag. Sie reihte sich ein in eine Welle von architektonisch hochwertigen Revitalisierungsprojekten in der Stadt.","people":["Marco Ostertag"],"places":["Bahnhof Dornbirn","Dornbirn"],"category":"Bauten","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 101"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Sanierung des Bahnhofs Dornbirn","summary":"Im Jahr 2008 erfolgte die Sanierung des Bahnhofs Dornbirn durch den Architekten Marco Ostertag. Sie reihte sich ein in eine Welle von architektonisch hochwertigen Revitalisierungsprojekten in der Stadt."}],"id":"E189"},{"year":2009,"year_end":null,"date_precision":"year","title":"Bernstein-Waldschabe erstmals in Vorarlberg gemeldet","summary":"2009 wurden der inatura die ersten Exemplare der Bernstein-Waldschabe (Ectobius vittiventris) aus Vorarlberg gemeldet. Das ursprünglich aus dem Mittelmeerraum stammende Tier hatte den Weg über die Alpen begünstigt durch den Klimawandel geschafft. Die harmlose Wanze lebt versteckt auf Gebüschen am Waldrand und sieht der Deutschen Schabe ähnlich, ist aber völlig unschädlich.","people":[],"places":["Dornbirn"],"category":"Natur","sources":["Friebe: Naturraum"],"page_hints":["Friebe: Naturraum S. 107"],"alt_titles":[],"source_summaries":[{"book":"Friebe: Naturraum","title":"Bernstein-Waldschabe erstmals in Vorarlberg gemeldet","summary":"2009 wurden der inatura die ersten Exemplare der Bernstein-Waldschabe (Ectobius vittiventris) aus Vorarlberg gemeldet. Das ursprünglich aus dem Mittelmeerraum stammende Tier hatte den Weg über die Alpen begünstigt durch den Klimawandel geschafft. Die harmlose Wanze lebt versteckt auf Gebüschen am Waldrand und sieht der Deutschen Schabe ähnlich, ist aber völlig unschädlich."}],"id":"E190"},{"year":2009,"year_end":null,"date_precision":"year","title":"Eroeffnung Flatz-Museum","summary":"Im Jahr 2009 wurde das Flatz-Museum im Haus Dreiunddreissig in der Marktstrasse eroeffnet. Es bespielt gemeinsam mit dem Vorarlberger Architekturinstitut (vai) Raeume im selben Haus und bereichert die Dornbirner Museumslandschaft.","people":[],"places":["Dornbirn","Marktstrasse"],"category":"Kultur","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 101"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Eroeffnung Flatz-Museum","summary":"Im Jahr 2009 wurde das Flatz-Museum im Haus Dreiunddreissig in der Marktstrasse eroeffnet. Es bespielt gemeinsam mit dem Vorarlberger Architekturinstitut (vai) Raeume im selben Haus und bereichert die Dornbirner Museumslandschaft."}],"id":"E191"},{"year":2009,"year_end":null,"date_precision":"year","title":"Ledon Lamp GmbH und 1000 FH-Studierende","summary":"2009 wurde die Ledon Lamp GmbH von Zumtobel gegruendet, um an der Entwicklung zukunftsweisender LED-Technik mitzuwirken. Im selben Jahr wurde die Zahl von 1000 StudentInnen an der Fachhochschule Vorarlberg ueberschritten. Die Insolvenz der F.M. Haemmerle Nfg. GmbH, die zur indischen Oswal-Gruppe gehoerte, beschaeftigte noch 182 Dienstnehmer.","people":[],"places":["Dornbirn"],"category":"Industrie","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 69"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Ledon Lamp GmbH und 1000 FH-Studierende","summary":"2009 wurde die Ledon Lamp GmbH von Zumtobel gegruendet, um an der Entwicklung zukunftsweisender LED-Technik mitzuwirken. Im selben Jahr wurde die Zahl von 1000 StudentInnen an der Fachhochschule Vorarlberg ueberschritten. Die Insolvenz der F.M. Haemmerle Nfg. GmbH, die zur indischen Oswal-Gruppe gehoerte, beschaeftigte noch 182 Dienstnehmer."}],"id":"E192"},{"year":2010,"year_end":2011,"date_precision":"year_range","title":"20 Libellenarten im Wassergarten der inatura dokumentiert","summary":"In den Sommern 2010 und 2011 konnten am Wassergarten der inatura zwanzig Libellenarten identifiziert werden, mindestens eine weitere blieb unbestimmt. Darunter befanden sich auch gefährdete Arten wie die Sumpf-Heidelibelle. Der Wassergarten erwies sich als überraschend artenreicher Lebensraum mitten im Stadtgebiet - trotz ursprünglicher Probleme mit Algen, ausgesetzten Goldfischen und Hechten.","people":[],"places":["Dornbirn"],"category":"Natur","sources":["Friebe: Naturraum"],"page_hints":["Friebe: Naturraum S. 91"],"alt_titles":[],"source_summaries":[{"book":"Friebe: Naturraum","title":"20 Libellenarten im Wassergarten der inatura dokumentiert","summary":"In den Sommern 2010 und 2011 konnten am Wassergarten der inatura zwanzig Libellenarten identifiziert werden, mindestens eine weitere blieb unbestimmt. Darunter befanden sich auch gefährdete Arten wie die Sumpf-Heidelibelle. Der Wassergarten erwies sich als überraschend artenreicher Lebensraum mitten im Stadtgebiet - trotz ursprünglicher Probleme mit Algen, ausgesetzten Goldfischen und Hechten."}],"id":"E193"},{"year":2010,"year_end":2012,"date_precision":"year_range","title":"Dornbirner Sparkasse als Partner der Innovation","summary":"Unter Vorstandsvorsitzendem Werner Böhler agiert die Dornbirner Sparkasse als regionaler Finanzdienstleister, der heimische Unternehmen mit Risikokapital für innovative Projekte versorgt. Bewusst meidet die Bank spekulative Finanzgeschäfte. Die Sparkasse erzielt mehr als doppelt so große Ergebnisse wie vergleichbare Banken - ein Beleg für das innovationsfreundliche Klima in Dornbirn. Ein historischer Bezug: Franz Martin Drexel aus Dornbirn-Hatlerdorf, Begründer des modernen Investmentbankings in den USA, finanzierte Thomas Edisons Glühbirne und die Eisenbahnverbindung Ost-West.","people":["Werner Böhler","Franz Martin Drexel"],"places":["Dornbirn","Hatlerdorf"],"category":"Wirtschaft","sources":["Hämmerle: Innovation"],"page_hints":["Hämmerle: Innovation S. 30-33"],"alt_titles":[],"source_summaries":[{"book":"Hämmerle: Innovation","title":"Dornbirner Sparkasse als Partner der Innovation","summary":"Unter Vorstandsvorsitzendem Werner Böhler agiert die Dornbirner Sparkasse als regionaler Finanzdienstleister, der heimische Unternehmen mit Risikokapital für innovative Projekte versorgt. Bewusst meidet die Bank spekulative Finanzgeschäfte. Die Sparkasse erzielt mehr als doppelt so große Ergebnisse wie vergleichbare Banken - ein Beleg für das innovationsfreundliche Klima in Dornbirn. Ein historischer Bezug: Franz Martin Drexel aus Dornbirn-Hatlerdorf, Begründer des modernen Investmentbankings in den USA, finanzierte Thomas Edisons Glühbirne und die Eisenbahnverbindung Ost-West."}],"id":"E194"},{"year":2010,"year_end":null,"date_precision":"year","title":"Letzte Textilproduktion verschwindet - Maselli und Gasser","summary":"Mit der Schliessung des Betriebs Fischbach verschwand 2010 die letzte groessere Textilproduktion von der Dornbirner Bildflaeche. Im selben Jahr verlagerte die Strickerei Maselli ihre Produktion nach Rumaenien (EU-Foerderungen), wobei 20 Beschaeftigte ihren Arbeitsplatz verloren. Die Erich Gasser GesmbH fusionierte mit Kunert in Rankweil. Das Kompetenzzentrum Licht verlegte seinen Firmensitz nach Dornbirn. Oelz erzielte einen Gesamtumsatz von 183 Millionen Euro mit 840 Mitarbeitern.","people":[],"places":["Dornbirn","Fischbach","Rankweil"],"category":"Industrie","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 11"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Letzte Textilproduktion verschwindet - Maselli und Gasser","summary":"Mit der Schliessung des Betriebs Fischbach verschwand 2010 die letzte groessere Textilproduktion von der Dornbirner Bildflaeche. Im selben Jahr verlag

erte die Strickerei Maselli ihre Produktion nach Rumaenien (EU-Foerderungen), wobei 20 Beschaeftigte ihren Arbeitsplatz verloren. Die Erich Gasser GesmbH fusionierte mit Kunert in Rankweil. Das Kompetenzzentrum Licht verlegte seinen Firmensitz nach Dornbirn. Oelz erzielte einen Gesamtumsatz von 183 Millionen Euro mit 840 Mitarbeitern."}],"id":"E195"},{"year":2010,"year_end":null,"date_precision":"year","title":"Patent-Rekord: Vorarlberg pro Kopf an der Spitze Österreichs","summary":"Im Bundesländer-Ranking 2010 zur Patentanmeldungen meldet Vorarlberg 225 Erfindungen an und liegt damit insgesamt auf Platz fünf, pro Kopf jedoch klar auf Platz eins der österreichischen Bundesländer. Insgesamt werden in Österreich 3.560 Erfindungen angemeldet. Bei den innovativsten Unternehmen belegt die Dornbirner Zumtobel Gruppe mit 22 Schutzrechten trotz erstmaliger Teilnahme den dritten Rang. Im Trend liegen die Branchen Arbeitsverfahren, täglicher Lebensbedarf, Maschinenbau sowie Beleuchtung und Heizung.","people":[],"places":["Dornbirn","Vorarlberg"],"category":"Wirtschaft","sources":["Hämmerle: Innovation"],"page_hints":["Hämmerle: Innovation S. 9"],"alt_titles":[],"source_summaries":[{"book":"Hämmerle: Innovation","title":"Patent-Rekord: Vorarlberg pro Kopf an der Spitze Österreichs","summary":"Im Bundesländer-Ranking 2010 zur Patentanmeldungen meldet Vorarlberg 225 Erfindungen an und liegt damit insgesamt auf Platz fünf, pro Kopf jedoch klar auf Platz eins der österreichischen Bundesländer. Insgesamt werden in Österreich 3.560 Erfindungen angemeldet. Bei den innovativsten Unternehmen belegt die Dornbirner Zumtobel Gruppe mit 22 Schutzrechten trotz erstmaliger Teilnahme den dritten Rang. Im Trend liegen die Branchen Arbeitsverfahren, täglicher Lebensbedarf, Maschinenbau sowie Beleuchtung und Heizung."}],"id":"E196"},{"year":2010,"year_end":null,"date_precision":"year","title":"Platanen-Netzwanze erstmals in Dornbirn entdeckt","summary":"2010 wurde die Platanen-Netzwanze (Corythucha ciliata) im Rahmen einer Botaniker-Tagung erstmals in Dornbirn nachgewiesen. Die ursprünglich aus Nordamerika stammende Wanze wurde 1964 in Padua erstmals in Europa entdeckt und breitete sich rasch aus. Sie schädigt Platanen, indem sie an der Blattunterseite saugt und das Chlorophyll zerstört - bei starkem Befall können befallene Bäume absterben.","people":[],"places":["Dornbirn"],"category":"Natur","sources":["Friebe: Naturraum"],"page_hints":["Friebe: Naturraum S. 107"],"alt_titles":[],"source_summaries":[{"book":"Friebe: Naturraum","title":"Platanen-Netzwanze erstmals in Dornbirn entdeckt","summary":"2010 wurde die Platanen-Netzwanze (Corythucha ciliata) im Rahmen einer Botaniker-Tagung erstmals in Dornbirn nachgewiesen. Die ursprünglich aus Nordamerika stammende Wanze wurde 1964 in Padua erstmals in Europa entdeckt und breitete sich rasch aus. Sie schädigt Platanen, indem sie an der Blattunterseite saugt und das Chlorophyll zerstört - bei starkem Befall können befallene Bäume absterben."}],"id":"E197"},{"year":2010,"year_end":null,"date_precision":"year","title":"Wiederwahl Ruemmele mit knapper absoluter Mehrheit","summary":"Im Jahr 2010 war die OuVP bei den Gemeinderatswahlen mit 52 Prozent immer noch stimmstaerkste Partei, allerdings nur noch mit knapper absoluter Mehrheit. Es folgten SPOu (21 Prozent), Freiheitliche (14 Prozent) und Gruene (13 Prozent). Neu angetreten, aber ohne Mandat blieben die Buntkarierten. Buergermeister Wolfgang Ruemmele erreichte in der Direktwahl 57 Prozent.","people":["Wolfgang Ruemmele"],"places":["Dornbirn"],"category":"Politik","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 107-108"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Wiederwahl Ruemmele mit knapper absoluter Mehrheit","summary":"Im Jahr 2010 war die OuVP bei den Gemeinderatswahlen mit 52 Prozent immer noch stimmstaerkste Partei, allerdings nur noch mit knapper absoluter Mehrheit. Es folgten SPOu (21 Prozent), Freiheitliche (14 Prozent) und Gruene (13 Prozent). Neu angetreten, aber ohne Mandat blieben die Buntkarierten. Buergermeister Wolfgang Ruemmele erreichte in der Direktwahl 57 Prozent."}],"id":"E198"},{"year":2011,"year_end":null,"date_precision":"year","title":"50. Chemiefasertagung - David Fussenegger Uebergabe","summary":"Zur 50. Jubilaeumsveranstaltung der Chemiefasertagung im September 2011 kamen ueber 700 Teilnehmer aus 30 Nationen ins Kulturhaus Dornbirn. Im selben Jahr erwarben Gottfried Wohlgenannt und Juergen Spiegel die Anteile der David Fussenegger Textil GmbH von Klaus Ladstaetter-Fussenegger und uebernahmen die Fuehrung des 180 Jahre alten Familienunternehmens, das mit Heimtextilien etwa 5 Millionen Euro Jahresumsatz erzielt.","people":["Gottfried Wohlgenannt","Juergen Spiegel","Klaus Ladstaetter-Fussenegger"],"places":["Dornbirn","Wallenmahd"],"category":"Wirtschaft","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 26"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"50. Chemiefasertagung - David Fussenegger Uebergabe","summary":"Zur 50. Jubilaeumsveranstaltung der Chemiefasertagung im September 2011 kamen ueber 700 Teilnehmer aus 30 Nationen ins Kulturhaus Dornbirn. Im selben Jahr erwarben Gottfried Wohlgenannt und Juergen Spiegel die Anteile der David Fussenegger Textil GmbH von Klaus Ladstaetter-Fussenegger und uebernahmen die Fuehrung des 180 Jahre alten Familienunternehmens, das mit Heimtextilien etwa 5 Millionen Euro Jahresumsatz erzielt."}],"id":"E199"},{"year":2011,"year_end":null,"date_precision":"year","title":"Demografische Bestandsaufnahme und religioese Vielfalt","summary":"Bei der Volkszaehlung 2011 wuchs Dornbirn wieder staerker auf rund 46.000 Einwohner. In der Bevoelkerung stellten Angehoerige der roemisch-katholischen Kirche mit rund 69 Prozent die weitaus groesste Gruppe (1975 noch 85 Prozent). Es folgten Anhaenger des Islam mit 13 Prozent, Menschen ohne Bekenntnis mit 10 Prozent und evangelische Christen mit 2 Prozent. Tuerkische Staatsangehoerige bildeten mit rund 2.000 Personen die groesste Gruppe der Auslaenderinnen und Auslaender, gefolgt von Deutschen mit 1.600 Menschen.","people":[],"places":["Dornbirn"],"category":"Migration","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 92"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"Demografische Bestandsaufnahme und religioese Vielfalt","summary":"Bei der Volkszaehlung 2011 wuchs Dornbirn wieder staerker auf rund 46.000 Einwohner. In der Bevoelkerung stellten Angehoerige der roemisch-katholischen Kirche mit rund 69 Prozent die weitaus groesste Gruppe (1975 noch 85 Prozent). Es folgten Anhaenger des Islam mit 13 Prozent, Menschen ohne Bekenntnis mit 10 Prozent und evangelische Christen mit 2 Prozent. Tuerkische Staatsangehoerige bildeten mit rund 2.000 Personen die groesste Gruppe der Auslaenderinnen und Auslaender, gefolgt von Deutschen mit 1.600 Menschen."}],"id":"E200"},{"year":2011,"year_end":null,"date_precision":"year","title":"Felssturz der Rappenlochbrücke verändert Dornbirns Wahrzeichen","summary":"Am 10. Mai 2011 kurz vor 13 Uhr stürzte die Rappenlochbrücke in die Tiefe. Nicht die Brücke selbst war eingestürzt, sondern der ermüdete Fels unter ihr hatte der Schwerkraft nachgegeben. Innerhalb weniger Minuten wurde das Wahrzeichen Dornbirns nachhaltig verändert. Wo zuvor das Wasser durch eine enge Schlucht rauschte, sucht es sich seither seinen Weg durch das Blockwerk. Die Schlucht ist seitdem nicht mehr durchgängig begehbar.","people":[],"places":["Dornbirn","Rappenloch"],"category":"Natur","sources":["Friebe: Naturraum"],"page_hints":["Friebe: Naturraum S. 62"],"alt_titles":[],"source_summaries":[{"book":"Friebe: Naturraum","title":"Felssturz der Rappenlochbrücke verändert Dornbirns Wahrzeichen","summary":"Am 10. Mai 2011 kurz vor 13 Uhr stürzte die Rappenlochbrücke in die Tiefe. Nicht die Brücke selbst war eingestürzt, sondern der ermüdete Fels unter ihr hatte der Schwerkraft nachgegeben. Innerhalb weniger Minuten wurde das Wahrzeichen Dornbirns nachhaltig verändert. Wo zuvor das Wasser durch eine enge Schlucht rauschte, sucht es sich seither seinen Weg durch das Blockwerk. Die Schlucht ist seitdem nicht mehr durchgängig begehbar."}],"id":"E201"},{"year":2011,"year_end":null,"date_precision":"year","title":"Gruen- und Freiraumkonzept Dornbirn","summary":"2011 beschloss die Stadtvertretung Dornbirn das Gruen- und Freiraumkonzept. Es enthaelt eine genaue Analyse und Handlungsanweisungen fuer den weiteren Ausbau und die Pflege der staedtischen Frei- und Gruenflaechen. Aufbauend auf dem Landschafts- und Gruenraumkonzept 1995 traegt es den gestiegenen Anforderungen an oeffentliche Gruenraeume Rechnung. Im Rahmen von Schul- und Kindergartenbauten werden Aussenraeume meist gemeinsam mit Schulen, Kindergaerten und Nachbarschaften neu gestaltet.","people":[],"places":["Dornbirn"],"category":"Natur","sources":["Aberer: Stadtentwicklung"],"page_hints":["Aberer: Stadtentwicklung S. 43"],"alt_titles":[],"source_summaries":[{"book":"Aberer: Stadtentwicklung","title":"Gruen- und Freiraumkonzept Dornbirn","summary":"2011 beschloss die Stadtvertretung Dornbirn das Gruen- und Freiraumkonzept. Es enthaelt eine genaue Analyse und Handlungsanweisungen fuer den weiteren Ausbau und die Pflege der staedtischen Frei- und Gruenflaechen. Aufbauend auf dem Landschafts- und Gruenraumkonzept 1995 traegt es den gestiegenen Anforderungen an oeffentliche Gruenraeume Rechnung. Im Rahmen von Schul- und Kindergartenbauten werden Aussenraeume meist gemeinsam mit Schulen, Kindergaerten und Nachbarschaften neu gestaltet."}],"id":"E202"},{"year":2011,"year_end":null,"date_precision":"year","title":"Konkurs des letzten F.M. Hämmerle-Nachfolgebetriebs","summary":"Mit dem Konkurs des letzten Nachfolgebetriebs von F.M. Hämmerle im Jahr 2011 verschwindet eine ganze Epoche der Dornbirner Textilindustrie. Die ehemals stadtprägenden Textilfirmen mussten ihre Produktion teilweise ins Ausland verlagern oder verschwanden. Tröstend ist, dass in den Gebäuden der ehemaligen wirtschaftlichen Flaggschiffe heute mehr Menschen beschäftigt sind als zur Hochblüte der Textilindustrie. Mit den Schornsteinen der frühen Industrialisierung fielen auch zahlreiche stadtprägende Textilunternehmen.","people":[],"places":["Dornbirn"],"category":"Industrie","sources":["Hämmerle: Innovation"],"page_hints":["Hämmerle: Innovation S. 6-7"],"alt_titles":[],"source_summaries":[{"book":"Hämmerle: Innovation","title":"Konkurs des letzten F.M. Hämmerle-Nachfolgebetriebs","summary":"Mit dem Konkurs des letzten Nachfolgebetriebs von F.M. Hämmerle im Jahr 2011 verschwindet eine ganze Epoche der Dornbirner Textilindustrie. Die ehemals stadtprägenden Textilfirmen mussten ihre Produktion teilweise ins Ausland verlagern oder verschwanden. Tröstend ist, dass in den Gebäuden der ehemaligen wirtschaftlichen Flaggschiffe heute mehr Menschen beschäftigt sind als zur Hochblüte der Textilindustrie. Mit den Schornsteinen der frühen Industrialisierung fielen auch zahlreiche stadtprägende Textilunternehmen."}],"id":"E203"},{"year":2011,"year_end":null,"date_precision":"year","title":"Städtepartnerschaft Dornbirn – Dubuque/Iowa geschlossen","summary":"Im Mai 2011 erklärt die Stadt Dubuque/Iowa offiziell ihren Wunsch, mit Dornbirn eine Städtepartnerschaft einzugehen. Bürgermeister Roy D. Buol präsentiert das Dokument in Anwesenheit der Dornbirner Stadträtinnen Marie Luise Hinterauer und Joyce E. Connors. Auslöser war der Besuch einer Dornbirner Delegation in der 'Schlüsselstadt' am Mississippi, wo rund 200 Dornbirner sich ab den 1850er Jahren angesiedelt hatten (Rhomberg, Hefel, Blaser, Schwendinger, Klocker u.a.). Die Partnerschaft krönt das Dornbirner Mississippi-Erbe.","people":["Roy D. Buol","Marie Luise Hinterauer","Joyce E. Connors","Ralf Hämmerle"],"places":["Dubuque","Dornbirn"],"category":"Politik","sources":["Pichler: Auswanderer"],"page_hints":["Pichler: Auswanderer S. 61"],"alt_titles":[],"source_summaries":[{"book":"Pichler: Auswanderer","title":"Städtepartnerschaft Dornbirn – Dubuque/Iowa geschlossen","summary":"Im Mai 2011 erklärt die Stadt Dubuque/Iowa offiziell ihren Wunsch, mit Dornbirn eine Städtepartnerschaft einzugehen. Bürgermeister Roy D. Buol präsentiert das Dokument in Anwesenheit der Dornbirner Stadträtinnen Marie Luise Hinterauer und Joyce E. Connors. Auslöser war der Besuch einer Dornbirner Delegation in der 'Schlüsselstadt' am Mississippi, wo rund 200 Dornbirner sich ab den 1850er Jahren angesiedelt hatten (Rhomberg, Hefel, Blaser, Schwendinger, Klocker u.a.). Die Partnerschaft krönt das Dornbirner Mississippi-Erbe."}],"id":"E204"},{"year":2011,"year_end":null,"date_precision":"year","title":"Wiederentdeckung des Malven-Dickkopffalters im inatura-Garten","summary":"Im Sommer 2011 wurde der Malven-Dickkopffalter (Carcharodus alceae) nach rund 50 Jahren wieder in Vorarlberg gesichtet - ausgerechnet im Garten der inatura mitten in Dornbirn. Die Art galt seit 1961 als verschollen. Ob der Klimawandel die Rückkehr des wärmeliebenden Falters begünstigt, ist nicht eindeutig belegt, doch wurde er inzwischen auch an anderen Orten Vorarlbergs entdeckt. Ebenfalls 2011 wurde erstmals die vom Aussterben bedrohte Sibirische Winterlibelle im inatura-Garten beobachtet.","people":[],"places":["Dornbirn"],"category":"Natur","sources":["Friebe: Naturraum"],"page_hints":["Friebe: Naturraum S. 92"],"alt_titles":[],"source_summaries":[{"book":"Friebe: Naturraum","title":"Wiederentdeckung des Malven-Dickkopffalters im inatura-Garten","summary":"Im Sommer 2011 wurde der Malven-Dickkopffalter (Carcharodus alceae) nach rund 50 Jahren wieder in Vorarlberg gesichtet - ausgerechnet im Garten der inatura mitten in Dornbirn. Die Art galt seit 1961 als verschollen. Ob der Klimawandel die Rückkehr des wärmeliebenden Falters begünstigt, ist nicht eindeutig belegt, doch wurde er inzwischen auch an anderen Orten Vorarlbergs entdeckt. Ebenfalls 2011 wurde erstmals die vom Aussterben bedrohte Sibirische Winterlibelle im inatura-Garten beobachtet."}],"id":"E205"},{"year":2012,"year_end":null,"date_precision":"year","title":"1zu1 Prototypen fertigt Teile für Eccerobot-Projekt","summary":"Die Dornbirner Innovationsschmiede 1zu1 Prototypen, gegründet und geführt von Hannes Hämmerle und Wolfgang Humml, beteiligt sich an einem europaweit einmaligen Forschungsprojekt der TU München und der awtec AG Zürich. Eccerobot, der erste anthropomimetische Roboter, kopiert die innere Struktur und Mechanismen des menschlichen Bewegungsapparats. 1zu1 fertigt Teile mit 3D-Druck und Lasersintertechnik. Das Unternehmen beschäftigt 120 Fachkräfte und erwirtschaftet mehr als 12 Millionen Euro Jahresumsatz. Es ist eines der führenden Unternehmen für Prototypen- und Modellbau in Europa.","people":["Hannes Hämmerle","Wolfgang Humml"],"places":["Dornbirn"],"category":"Industrie","sources":["Hämmerle: Innovation"],"page_hints":["Hämmerle: Innovation S. 44-49"],"alt_titles":[],"source_summaries":[{"book":"Hämmerle: Innovation","title":"1zu1 Prototypen fertigt Teile für Eccerobot-Projekt","summary":"Die Dornbirner Innovationsschmiede 1zu1 Prototypen, gegründet und geführt von Hannes Hämmerle und Wolfgang Humml, beteiligt sich an einem europaweit einmaligen Forschungsprojekt der TU München und der awtec AG Zürich. Eccerobot, der erste anthropomimetische Roboter, kopiert die innere Struktur und Mechanismen des menschlichen Bewegungsapparats. 1zu1 fertigt Teile mit 3D-Druck und Lasersintertechnik. Das Unternehmen beschäftigt 120 Fachkräfte und erwirtschaftet mehr als 12 Millionen Euro Jahresumsatz. Es ist eines der führenden Unternehmen für Prototypen- und Modellbau in Europa."}],"id":"E206"},{"year":2012,"year_end":null,"date_precision":"year","title":"46.000 Einwohner und Erscheinen der Geschichte Dornbirns","summary":"Im Jahr 2012 hatte Dornbirn 46.080 Einwohner in rund 11.000 Haeusern. Die Einwohnerverteilung war: 1. Bezirk Markt 28 Prozent, 2. Bezirk Hatlerdorf 23 Prozent, 3. Bezirk Oberdorf 10 Prozent, 4. Bezirk Haselstauden 11 Prozent, 5. Bezirk Rohrbach 16 Prozent, 6. Bezirk Schoren 12 Prozent. Im selben Jahr erschien die hier zitierte Geschichte Dornbirns von Werner Matt im Amt der Stadt Dornbirn.","people":["Werner Matt"],"places":["Dornbirn"],"category":"Stadtentwicklung","sources":["Matt: Geschichte Dornbirns"],"page_hints":["Matt: Geschichte Dornbirns S. 116"],"alt_titles":[],"source_summaries":[{"book":"Matt: Geschichte Dornbirns","title":"46.000 Einwohner und Erscheinen der Geschichte Dornbirns","summary":"Im Jahr 2012 hatte Dornbirn 46.080 Einwohner in rund 11.000 Haeusern. Die Einwohnerverteilung war: 1. Bezirk Markt 28 Prozent, 2. Bezirk Hatlerdorf 23 Prozent, 3. Bezirk Oberdorf 10 Prozent, 4. Bezirk Haselstauden 11 Prozent, 5. Bezirk Rohrbach 16 Prozent, 6. Bezirk Schoren 12 Prozent. Im selben Jahr erschien die hier zitierte Geschichte Dornbirns von Werner Matt im Amt der Stadt Dornbirn."}],"id":"E207"},{"year":2012,"year_end":null,"date_precision":"year","title":"Bilanz: 30 ha umgenutzte Industrieflaechen in knapp 30 Jahren","summary":"In knapp 30 Jahren wurden in Dornbirn ueber 30 Hektar an genutzten Industrieflaechen umgenutzt, ohne dass in irgendeiner Phase Industriebrachen entstanden. Durch die meist sehr zentrale Lage waren die Areale von grosser staedtebaulicher Bedeutung und wurden zu Bausteinen verkehrs- und gruenraumplanerischer Ziele, Arbeitsplatzpolitik und Erhaltung identitaetstragender Industriearchitektur. In den nachgenutzten Textilarealen arbeiten heute mehr Menschen in unterschiedlichsten Betriebsgroessen als vor der Textilkrise.","people":[],"places":["Dornbirn"],"category":"Stadtentwicklung","sources":["Aberer: Stadtentwicklung"],"page_hints":["Aberer: Stadtentwicklung S. 19"],"alt_titles":[],"source_summaries":[{"book":"Aberer: Stadtentwicklung","title":"Bilanz: 30 ha umgenutzte Industrieflaechen in knapp 30 Jahren","summary":"In knapp 30 Jahren wurden in Dornbirn ueber 30 Hektar an genutzten Industrieflaechen umgenutzt, ohne dass in irgendeiner Phase Industriebrachen entstanden. Durch die meist sehr zentrale Lage waren die Areale von grosser staedtebaulicher Bedeutung und wurden zu Bausteinen verkehrs- und gruenraumplanerischer Ziele, Arbeitsplatzpolitik und Erhaltung identitaetstragender Industriearchitektur. In den nachgenutzten Textilarealen arbeiten heute mehr Menschen in unterschiedlichsten Betriebsgroessen als vor der Textilkrise."}],"id":"E208"},{"year":2012,"year_end":null,"date_precision":"year","title":"Charles de Ganahl Koch – Dornbirner Nachfahre prägt US-Konzernwelt","summary":"Pichler dokumentiert 2012 die Linie der Texaner de Ganahls weiter: Charles de Ganahl Koch, Nachfahre des aus Dornbirn ausgewanderten Joseph Ganahl (1796-1837, Sohn des Landrichters) und seines Sohnes Charles de Ganahl (Gründer von 'Zanzenberg/Texas'), besitzt 'Koch Industries' – das zweitgrösste Privatunternehmen Amerikas. Er zählt zu den reichsten Amerikanern und ist grosszügiger Förderer der erzkonservativen Denkfabrik Cato. Eine politisch einflussreiche Verzweigung des Dornbirner Stammbaums.","people":["Charles de Ganahl Koch","Charles de Ganahl","Joseph Ganahl"],"places":["Dornbirn","Texas","Zanzenberg"],"category":"Wirtschaft","sources":["Pichler: Auswanderer"],"page_hints":["Pichler: Auswanderer S. 22"],"alt_titles":[],"source_summaries":[{"book":"Pichler: Auswanderer","title":"Charles de Ganahl Koch – Dornbirner Nachfahre prägt US-Konzernwelt","summary":"Pichler dokumentiert 2012 die Linie der Texaner de Ganahls weiter: Charles de Ganahl Koch, Nachfahre des aus Dornbirn ausgewanderten Joseph Ganahl (1796-1837, Sohn des Landrichters) und seines Sohnes Charles de Ganahl (Gründer von 'Zanzenberg/Texas'), besitzt 'Koch Industries' – das zweitgrösste Privatunternehmen Amerikas. Er zählt zu den reichsten Amerikanern und ist grosszügiger Förderer der erzkonservativen Denkfabrik Cato. Eine politisch einflussreiche Verzweigung des Dornbirner Stammbaums."}],"id":"E209"},{"year":2012,"year_end":null,"date_precision":"year","title":"Erweiterung Stadtbad an der Stadtstrasse","summary":"Das staedtische Hallenbad wurde in zentralster Lage an der Stadtstrasse umfassend saniert und erweitert. Aus Sicht der Innenstadtentwicklung lobt diese Standortentscheidung die politisch Verantwortlichen, da es zuvor verlockende Angebote von Investoren fuer ein privat finanziertes Erlebnisbad an der Autobahn gegeben hatte. Das neue Stadtbad im Zentrum ist auch Beleg fuer das Postulat hochwertiger Architektur bei oeffentlichen Bauten. Es bildet einen Eckpfeiler des Investitionspakets in Sportanlagen rund um Eishalle, Ballsporthalle und Stadion Birkenwiese.","people":[],"places":["Dornbirn","Stadtstrasse"],"category":"Sport","sources":["Aberer: Stadtentwicklung"],"page_hints":["Aberer: Stadtentwicklung S. 29"],"alt_titles":[],"source_summaries":[{"book":"Aberer: Stadtentwicklung","title":"Erweiterung Stadtbad an der Stadtstrasse","summary":"Das staedtische Hallenbad wurde in zentralster Lage an der Stadtstrasse umfassend saniert und erweitert. Aus Sicht der Innenstadtentwicklung lobt diese Standortentscheidung die politisch Verantwortlichen, da es zuvor verlockende Angebote von Investoren fuer ein privat finanziertes Erlebnisbad an der Autobahn gegeben hatte. Das neue Stadtbad im Zentrum ist auch Beleg fuer das Postulat hochwertiger Architektur bei oeffentlichen Bauten. Es bildet einen Eckpfeiler des Investitionspakets in Sportanlagen rund um Eishalle, Ballsporthalle und Stadion Birkenwiese."}],"id":"E210"},{"year":2012,"year_end":null,"date_precision":"year","title":"Fussenegger Holding mit Umsatzplus - 30 Mio Euro","summary":"2012 gab die Firmenleitung der Fussenegger Holding einen Umsatz von 30 Millionen Euro bekannt, Tendenz steigend. Im Textilbereich sind 140 Mitarbeiter beschaeftigt mit guten Zukunftsaussichten. Joseph Froeis und Stephan Rhomberg fuehren als Geschaeftsfuehrer die Firma im Wallenmahd nach erfolgreicher Umstrukturierung. Im Areal 23 sind 65 Firmen mit 300 Beschaeftigten auf 42.000 m2 untergebracht.","people":["Joseph Froeis","Stephan Rhomberg"],"places":["Dornbirn","Wallenmahd"],"category":"Industrie","sources":["Fessler: Wirtschaften"],"page_hints":["Fessler: Wirtschaften S. 17"],"alt_titles":[],"source_summaries":[{"book":"Fessler: Wirtschaften","title":"Fussenegger Holding mit Umsatzplus - 30 Mio Euro","summary":"2012 gab die Firmenleitung der Fussenegger Holding einen Umsatz von 30 Millionen Euro bekannt, Tendenz steigend. Im Textilbereich sind 140 Mitarbeiter beschaeftigt mit guten Zukunftsaussichten. Joseph Froeis und Stephan Rhomberg fuehren als Geschaeftsfuehrer die Firma im Wallenmahd nach erfolgreicher Umstrukturierung. Im Areal 23 sind 65 Firmen mit 300 Beschaeftigten auf 42.000 m2 untergebracht."}],"id":"E211"},{"year":2012,"year_end":null,"date_precision":"year","title":"Gesamterneuerung Volksschule Wallenmahd mit Kindergarten","summary":"Im Rahmen des Schul- und Kindergarteninvestitionsprogramms wurde die Volksschule Wallenmahd gesamterneuert und direkt daneben ein neuer viergruppiger Kindergarten errichtet. In einer Gesamtplanung wurden auch die Aussenraeume voellig neu gestaltet, unter Beteiligung der Schulen, Kindergaerten und Nachbarschaften. Das Projekt steht exemplarisch fuer den Anspruch, Schul- und Kindergartenstandorte als oeffentliche Lebensorte im Stadtquartier zu konzipieren.","people":[],"places":["Wallenmahd"],"category":"Bildung","sources":["Aberer: Stadtentwicklung"],"page_hints":["Aberer: Stadtentwicklung S. 29"],"alt_titles":[],"source_summaries":[{"book":"Aberer: Stadtentwicklung","title":"Gesamterneuerung Volksschule Wallenmahd mit Kindergarten","summary":"Im Rahmen des Schul- und Kindergarteninvestitionsprogramms wurde die Volksschule Wallenmahd gesamterneuert und direkt daneben ein neuer viergruppiger Kindergarten errichtet. In einer Gesamtplanung wurden auch die Aussenraeume voellig neu gestaltet, unter Beteiligung der Schulen, Kindergaerten und Nachbarschaften. Das Projekt steht exemplarisch fuer den Anspruch, Schul- und Kindergartenstandorte als oeffentliche Lebensorte im Stadtquartier zu konzipieren."}],"id":"E212"},{"year":2012,"year_end":null,"date_precision":"year","title":"Hermann Gmeiner-Park und weitere neue Stadtteilparks","summary":"Im Zuge des Ausbaus des oeffentlichen Gruenraums wurden in Dornbirn neue Stadtteilparks angelegt, darunter der Hermann Gmeiner-Park, die Freizeitanlage Staufenblick fuer die Stadtbezirke Schoren und Hatlerdorf sowie das Forachwaeldchen im Stadtbezirk Rohrbach. Diese Parks verbessern die Wohn- und Lebensqualitaet in den jeweiligen Stadtteilen und sind Ausdruck des erweiterten Begriffs der Gartenstadt, der nicht mehr nur Privatgaerten umfasst, sondern zunehmend oeffentliche Freiflaechen.","people":[],"places":["Schoren","Hatlerdorf","Rohrbach","Staufenblick"],"category":"Natur","sources":["Aberer: Stadtentwicklung"],"page_hints":["Aberer: Stadtentwicklung S. 43"],"alt_titles":[],"source_summaries":[{"book":"Aberer: Stadtentwicklung","title":"Hermann Gmeiner-Park und weitere neue Stadtteilparks","summary":"Im Zuge des Ausbaus des oeffentlichen Gruenraums wurden in Dornbirn neue Stadtteilparks angelegt, darunter der Hermann Gmeiner-Park, die Freizeitanlage Staufenblick fuer die Stadtbezirke Schoren und Hatlerdorf sowie das Forachwaeldchen im Stadtbezirk Rohrbach. Diese Parks verbessern die Wohn- und Lebensqualitaet in den jeweiligen Stadtteilen und sind Ausdruck des erweiterten Begriffs der Gartenstadt, der nicht mehr nur Privatgaerten umfasst, sondern zunehmend oeffentliche Freiflaechen."}],"id":"E213"},{"year":2012,"year_end":null,"date_precision":"year","title":"Investitionen in Sportanlagen: Eishalle, Ballsporthalle, Birkenwiese","summary":"Grosse Investitionen wurden in den Jahren vor 2012 in Sportanlagen Dornbirns getaetigt: in die Eishalle und die neue Ballsporthalle im Messegelaende, in die Laufbahn und den Kunstrasenplatz im staedtischen Stadion Birkenwiese sowie in die Erweiterung des Stadtbades an der Stadtstrasse. Diese Investitionen unterstreichen die Bedeutung des Sports als weicher Standortfaktor und sind Teil der staedtischen Strategie, hochwertige oeffentliche Infrastruktur in zentralen Lagen vorzuhalten.","people":[],"places":["Dornbirn","Messegelaende","Birkenwiese","Stadtstrasse"],"category":"Sport","sources":["Aberer: Stadtentwicklung"],"page_hints":["Aberer: Stadtentwicklung S. 29"],"alt_titles":[],"source_summaries":[{"book":"Aberer: Stadtentwicklung","title":"Investitionen in Sportanlagen: Eishalle, Ballsporthalle, Birkenwiese","summary":"Grosse Investitionen wurden in den Jahren vor 2012 in Sportanlagen Dornbirns getaetigt: in die Eishalle und die neue Ballsporthalle im Messegelaende, in die Laufbahn und den Kunstrasenplatz im staedtischen Stadion Birkenwiese sowie in die Erweiterung des Stadtbades an der Stadtstrasse. Diese Investitionen unterstreichen die Bedeutung des Sports als weicher Standortfaktor und sind Teil der staedtischen Strategie, hochwertige oeffentliche Infrastruktur in zentralen Lagen vorzuhalten."}],"id":"E214"},{"year":2012,"year_end":null,"date_precision":"year","title":"Kauf Mehrzweckgebaeude Kehlerpark fuer Jazzseminar","summary":"Die Stadt Dornbirn kaufte im Kehlerpark, dem ehemaligen Areal der Firma Maeser-Textil, ein ganzes Gebaeude, um dem Jazzseminar der Musikschule Uebungs- und Vortragsraeume in optimaler Groesse anbieten zu koennen. Damit setzte die Stadt einen kulturellen Akzent in einem nachgenutzten Textilareal und beteiligte sich aktiv an dessen Durchmischung. Der Ankauf illustriert, wie Bildungs- und Kultureinrichtungen gezielt zur Aufwertung ehemaliger Industrieflaechen eingesetzt werden.","people":[],"places":["Kehlerpark"],"category":"Kultur","sources":["Aberer: Stadtentwicklung"],"page_hints":["Aberer: Stadtentwicklung S. 19"],"alt_titles":[],"source_summaries":[{"book":"Aberer: Stadtentwicklung","title":"Kauf Mehrzweckgebaeude Kehlerpark fuer Jazzseminar","summary":"Die Stadt Dornbirn kaufte im Kehlerpark, dem ehemaligen Areal der Firma Maeser-Textil, ein ganzes Gebaeude, um dem Jazzseminar der Musikschule Uebungs- und Vortragsraeume in optimaler Groesse anbieten zu koennen. Damit setzte die Stadt einen kulturellen Akzent in einem nachgenutzten Textilareal und beteiligte sich aktiv an dessen Durchmischung. Der Ankauf illustriert, wie Bildungs- und Kultureinrichtungen gezielt zur Aufwertung ehemaliger Industrieflaechen eingesetzt werden."}],"id":"E215"},{"year":2012,"year_end":null,"date_precision":"year","title":"Kunst.Raum.Dornbirn in ehemaligen Ruesch-Werken","summary":"Mit dem Kunst.Raum.Dornbirn hat eine regional bedeutsame Kultureinrichtung in einer Halle der ehemaligen Ruesch-Werke im Stadtgarten Quartier genommen. Die Nachnutzung der industriellen Bausubstanz fuer kulturelle Zwecke ist ein Paradebeispiel der Dornbirner Strategie, ehemalige Produktionsareale mit weichen Standortfaktoren aufzuwerten. Der Kunst.Raum bereichert gemeinsam mit dem Stadtgarten und der inatura die kulturelle Mitte der Stadt.","people":[],"places":["Dornbirn","Stadtgarten","Ruesch-Werke"],"category":"Kultur","sources":["Aberer: Stadtentwicklung"],"page_hints":["Aberer: Stadtentwicklung S. 29"],"alt_titles":[],"source_summaries":[{"book":"Aberer: Stadtentwicklung","title":"Kunst.Raum.Dornbirn in ehemaligen Ruesch-Werken","summary":"Mit dem Kunst.Raum.Dornbirn hat eine regional bedeutsame Kultureinrichtung in einer Halle der ehemaligen Ruesch-Werke im Stadtgarten Quartier genommen. Die Nachnutzung der industriellen Bausubstanz fuer kulturelle Zwecke ist ein Paradebeispiel der Dornbirner Strategie, ehemalige Produktionsareale mit weichen Standortfaktoren aufzuwerten. Der Kunst.Raum bereichert gemeinsam mit dem Stadtgarten und der inatura die kulturelle Mitte der Stadt."}],"id":"E216"},{"year":2012,"year_end":null,"date_precision":"year","title":"Mohren-Bierhalle: Wohn- und Geschaeftshaus beim Bahnhof","summary":"Beim Bahnhof Dornbirn wurde auf dem Areal der ehemaligen Mohren-Bierhalle ein attraktives Wohn- und Geschaeftshaus errichtet. Zugleich wurde das benachbarte Postamt gesamtsaniert und aufgestockt. Weitere Objektplanungen suedwestlich des Postamts an der Poststrasse waren in Vorbereitung. Diese Projekte profitieren von der besten Erreichbarkeit durch das dichte Bahn- und Busangebot und entwickeln die Urbanitaet des Bahnhofsviertels als wichtigen Teil der Innenstadt weiter.","people":[],"places":["Bahnhof","Poststrasse"],"category":"Bauten","sources":["Aberer: Stadtentwicklung"],"page_hints":["Aberer: Stadtentwicklung S. 35"],"alt_titles":[],"source_summaries":[{"book":"Aberer: Stadtentwicklung","title":"Mohren-Bierhalle: Wohn- und Geschaeftshaus beim Bahnhof","summary":"Beim Bahnhof Dornbirn wurde auf dem Areal der ehemaligen Mohren-Bierhalle ein attraktives Wohn- und Geschaeftshaus errichtet. Zugleich wurde das benachbarte Postamt gesamtsaniert und aufgestockt. Weitere Objektplanungen suedwestlich des Postamts an der Poststrasse waren in Vorbereitung. Diese Projekte profitieren von der besten Erreichbarkeit durch das dichte Bahn- und Busangebot und entwickeln die Urbanitaet des Bahnhofsviertels als wichtigen Teil der Innenstadt weiter."}],"id":"E217"},{"year":2012,"year_end":null,"date_precision":"year","title":"Neubau Sonderpaedagogisches Zentrum Schulgasse","summary":"Als Teil eines ueber 100 Millionen Euro umfassenden Investitionsprogramms in Pflichtschulen und Kindergaerten der naechsten 20 Jahre wurde in Dornbirn der Neubau des Sonderpaedagogischen Zentrums in der Schulgasse umgesetzt. Das Projekt steht beispielhaft fuer die staedtische Strategie, Bildungseinrichtungen mit hoher architektonischer Qualitaet zu errichten und ihre Aussenraeume neu zu gestalten. Damit wird Bildung als weicher Standortfaktor materialisiert und langfristig gesichert.","people":[],"places":["Dornbirn","Schulgasse"],"category":"Bildung","sources":["Aberer: Stadtentwicklung"],"page_hints":["Aberer: Stadtentwicklung S. 29"],"alt_titles":[],"source_summaries":[{"book":"Aberer: Stadtentwicklung","title":"Neubau Sonderpaedagogisches Zentrum Schulgasse","summary":"Als Teil eines ueber 100 Millionen Euro umfassenden Investitionsprogramms in Pflichtschulen und Kindergaerten der naechsten 20 Jahre wurde in Dornbirn der Neubau des Sonderpaedagogischen Zentrums in der Schulgasse umgesetzt. Das Projekt steht beispielhaft fuer die staedtische Strategie, Bildungseinrichtungen mit hoher architektonischer Qualitaet zu errichten und ihre Aussenraeume neu zu gestalten. Damit wird Bildung als weicher Standortfaktor materialisiert und langfristig gesichert."}],"id":"E218"},{"year":2012,"year_end":null,"date_precision":"year","title":"Pichlers Auswanderlexikon mit 900 Dornbirnern in Buch publiziert","summary":"Mit der Publikation 'Von Dornbirn in die Neue Welt' legt Meinrad Pichler 2012 erstmals ein umfassendes Verzeichnis der Dornbirner USA-Auswanderung 1800–1938 vor. Gut 900 erwachsene Auswanderer/innen sind im Anhang namentlich erfasst. Das Buch flankiert die frisch geschlossene Städtepartnerschaft mit Dubuque und holt – wie Stadtarchivar Ralf Hämmerle im Nachwort schreibt – ein 'für die Stadt wichtiges Kapitel ihrer Geschichte ins Bewusstsein zurück'. Quellen sind die 'Amerikasammlung Pichler' (AS Pi) und das Stadtarchiv Dornbirn.","people":["Meinrad Pichler","Ralf Hämmerle"],"places":["Dornbirn","Dubuque"],"category":"Kultur","sources":["Pichler: Auswanderer"],"page_hints":["Pichler: Auswanderer S. 9, S. 60-61"],"alt_titles":[],"source_summaries":[{"book":"Pichler: Auswanderer","title":"Pichlers Auswanderlexikon mit 900 Dornbirnern in Buch publiziert","summary":"Mit der Publikation 'Von Dornbirn in die Neue Welt' legt Meinrad Pichler 2012 erstmals ein umfassendes Verzeichnis der Dornbirner USA-Auswanderung 1800–1938 vor. Gut 900 erwachsene Auswanderer/innen sind im Anhang namentlich erfasst. Das Buch flankiert die frisch geschlossene Städtepartnerschaft mit Dubuque und holt – wie Stadtarchivar Ralf Hämmerle im Nachwort schreibt – ein 'für die Stadt wichtiges Kapitel ihrer Geschichte ins Bewusstsein zurück'. Quellen sind die 'Amerikasammlung Pichler' (AS Pi) und das Stadtarchiv Dornbirn."}],"id":"E219"},{"year":2012,"year_end":null,"date_precision":"year","title":"'Rhomberg Furs' nach 4 Generationen weiter aktiv im Mittleren Westen","summary":"Das 1909 von Franz Martin Rhomberg (1869-1919) in Dubuque gegründete Pelz- und Ledergeschäft 'Rhomberg Furs' – Nachfolgeunternehmen der ehemaligen Whisky-Firma 'Rhomberg Bros. Co' – wird zum Zeitpunkt von Pichlers Buchveröffentlichung (2012) in vierter Generation der Familie geführt und unterhält mehrere Niederlassungen im mittleren Westen der USA. Ein sichtbares, bis heute lebendiges Wirtschaftserbe der Dornbirner Auswanderung.","people":["Franz Martin Rhomberg"],"places":["Dubuque","Dornbirn"],"category":"Wirtschaft","sources":["Pichler: Auswanderer"],"page_hints":["Pichler: Auswanderer S. 30"],"alt_titles":[],"source_summaries":[{"book":"Pichler: Auswanderer","title":"'Rhomberg Furs' nach 4 Generationen weiter aktiv im Mittleren Westen","summary":"Das 1909 von Franz Martin Rhomberg (1869-1919) in Dubuque gegründete Pelz- und Ledergeschäft 'Rhomberg Furs' – Nachfolgeunternehmen der ehemaligen Whisky-Firma 'Rhomberg Bros. Co' – wird zum Zeitpunkt von Pichlers Buchveröffentlichung (2012) in vierter Generation der Familie geführt und unterhält mehrere Niederlassungen im mittleren Westen der USA. Ein sichtbares, bis heute lebendiges Wirtschaftserbe der Dornbirner Auswanderung."}],"id":"E220"},{"year":2012,"year_end":null,"date_precision":"year","title":"Spielboden in Rhomberg's Fabrik etabliert","summary":"Die Stadt Dornbirn leistete wesentliche Beitraege zur Durchmischung der nachgenutzten Industrieareale, unter anderem durch die Ansiedlung des Spielbodens in Rhomberg's Fabrik. Der Spielboden ist ein aus der alternativen Szene herausgewachsener Kulturanbieter und wurde durch die Ansiedlung in der ehemaligen Fabrik zu einem festen Bestandteil der Kulturlandschaft des Areals. Das Beispiel zeigt, wie aktive Bodenpolitik und kulturelle Foerderung in Dornbirn ineinandergreifen, um Industriearchitektur in neue Nutzungen zu ueberfuehren.","people":[],"places":["Rhomberg's Fabrik"],"category":"Kultur","sources":["Aberer: Stadtentwicklung"],"page_hints":["Aberer: Stadtentwicklung S. 19"],"alt_titles":[],"source_summaries":[{"book":"Aberer: Stadtentwicklung","title":"Spielboden in Rhomberg's Fabrik etabliert","summary":"Die Stadt Dornbirn leistete wesentliche Beitraege zur Durchmischung der nachgenutzten Industrieareale, unter anderem durch die Ansiedlung des Spielbodens in Rhomberg's Fabrik. Der Spielboden ist ein aus der alternativen Szene herausgewachsener Kulturanbieter und wurde durch die Ansiedlung in der ehemaligen Fabrik zu einem festen Bestandteil der Kulturlandschaft des Areals. Das Beispiel zeigt, wie aktive Bodenpolitik und kulturelle Foerderung in Dornbirn ineinandergreifen, um Industriearchitektur in neue Nutzungen zu ueberfuehren."}],"id":"E221"},{"year":2012,"year_end":null,"date_precision":"year","title":"Stadtgarten um die inatura - 2 ha innerstaedtischer Gruenraum","summary":"Rund um die inatura wurde ein zwei Hektar grosser Stadtgarten angelegt, der zur zentralen Gruenflaeche der Innenstadt wurde. Er ist Teil eines Gesamtkonzepts, das den oeffentlichen Gruenflaechenbestand Dornbirns auf rund 37 Hektar erweiterte. Der Stadtgarten verbindet das naturkundliche Museum mit umliegenden kulturellen Einrichtungen wie dem Kunst.Raum.Dornbirn und erfuellt damit gleichzeitig oekologische, kulturelle und soziale Funktionen.","people":[],"places":["Dornbirn","Stadtgarten"],"category":"Natur","sources":["Aberer: Stadtentwicklung"],"page_hints":["Aberer: Stadtentwicklung S. 25"],"alt_titles":[],"source_summaries":[{"book":"Aberer: Stadtentwicklung","title":"Stadtgarten um die inatura - 2 ha innerstaedtischer Gruenraum","summary":"Rund um die inatura wurde ein zwei Hektar grosser Stadtgarten angelegt, der zur zentralen Gruenflaeche der Innenstadt wurde. Er ist Teil eines Gesamtkonzepts, das den oeffentlichen Gruenflaechenbestand Dornbirns auf rund 37 Hektar erweiterte. Der Stadtgarten verbindet das naturkundliche Museum mit umliegenden kulturellen Einrichtungen wie dem Kunst.Raum.Dornbirn und erfuellt damit gleichzeitig oekologische, kulturelle und soziale Funktionen."}],"id":"E222"},{"year":2012,"year_end":null,"date_precision":"year","title":"VAI und FLATZ-Museum in der Marktstrasse 33","summary":"Das Vorarlberger Architektur Institut VAI in der Marktstrasse 33 sowie die Ausstellungsflaeche mit dem FLATZ-Museum im zweiten Obergeschoss desselben Hauses bereichern die kulturelle zentraloertliche Position Dornbirns. Die beiden Institutionen unterstreichen das im Kulturleitbild verankerte vierte A der Architektur als Teil staedtischen Kulturlebens und positionieren Dornbirn als Standort fuer zeitgenoessische Auseinandersetzung mit Architektur und Kunst.","people":["Wolfgang Flatz"],"places":["Marktstrasse"],"category":"Kultur","sources":["Aberer: Stadtentwicklung"],"page_hints":["Aberer: Stadtentwicklung S. 29"],"alt_titles":[],"source_summaries":[{"book":"Aberer: Stadtentwicklung","title":"VAI und FLATZ-Museum in der Marktstrasse 33","summary":"Das Vorarlberger Architektur Institut VAI in der Marktstrasse 33 sowie die Ausstellungsflaeche mit dem FLATZ-Museum im zweiten Obergeschoss desselben Hauses bereichern die kulturelle zentraloertliche Position Dornbirns. Die beiden Institutionen unterstreichen das im Kulturleitbild verankerte vierte A der Architektur als Teil staedtischen Kulturlebens und positionieren Dornbirn als Standort fuer zeitgenoessische Auseinandersetzung mit Architektur und Kunst."}],"id":"E223"},{"year":2012,"year_end":null,"date_precision":"year","title":"Zumtobel beleuchtet Valentinstag-Herz am Times Square New York","summary":"Am Times Square in New York erstrahlt 2012 das vom dänischen Architekturbüro Bjarke Ingels Group (BIG) gestaltete Valentinstag-Herz 'City Pulse'. Die Skulptur besteht aus 400 transparenten, mit LEDs bestückten Acrylröhren. Zumtobel stellte die LED-Beleuchtung zur Verfügung und installierte sie. Besucher konnten durch Berühren eines Touchpads das pulsierende Herz aktivieren - je mehr Menschen Hand in Hand eine Kette bildeten, desto kräftiger schlug das Herz. Ein weiteres Sonderprojekt, das Dornbirns Namen weltweit trägt.","people":[],"places":["Dornbirn","New York"],"category":"Wirtschaft","sources":["Hämmerle: Innovation"],"page_hints":["Hämmerle: Innovation S. 36-37"],"alt_titles":[],"source_summaries":[{"book":"Hämmerle: Innovation","title":"Zumtobel beleuchtet Valentinstag-Herz am Times Square New York","summary":"Am Times Square in New York erstrahlt 2012 das vom dänischen Architekturbüro Bjarke Ingels Group (BIG) gestaltete Valentinstag-Herz 'City Pulse'. Die Skulptur besteht aus 400 transparenten, mit LEDs bestückten Acrylröhren. Zumtobel stellte die LED-Beleuchtung zur Verfügung und installierte sie. Besucher konnten durch Berühren eines Touchpads das pulsierende Herz aktivieren - je mehr Menschen Hand in Hand eine Kette bildeten, desto kräftiger schlug das Herz. Ein weiteres Sonderprojekt, das Dornbirns Namen weltweit trägt."}],"id":"E224"},{"year":2012,"year_end":null,"date_precision":"year","title":"Zumtobel Gruppe als Weltmarktführer und größter Arbeitgeber","summary":"Die Zumtobel Gruppe ist das Flaggschiff der Dornbirner Wirtschaft - Weltmarktführer im Bereich Beleuchtung mit Stammsitz und Firmenzentrale in Dornbirn. Zur Gruppe gehören neben der Marke Zumtobel auch der englische Leuchtenhersteller Thorn und der Dornbirner Komponentenhersteller Tridonic. Weltweit beschäftigt sie mehr als 7.400 Menschen mit rund 1,23 Milliarden Euro Jahresumsatz. Etwa 20% des Gesamtumsatzes werden mit Sonderprojekten generiert. Zumtobel investiert 2012 rund 20 Millionen Euro in den Standort Dornbirn.","people":["Harald Sommerer"],"places":["Dornbirn","Schweizerstraße"],"category":"Wirtschaft","sources":["Hämmerle: Innovation"],"page_hints":["Hämmerle: Innovation S. 34, 40-43"],"alt_titles":[],"source_summaries":[{"book":"Hämmerle: Innovation","title":"Zumtobel Gruppe als Weltmarktführer und größter Arbeitgeber","summary":"Die Zumtobel Gruppe ist das Flaggschiff der Dornbirner Wirtschaft - Weltmarktführer im Bereich Beleuchtung mit Stammsitz und Firmenzentrale in Dornbirn. Zur Gruppe gehören neben der Marke Zumtobel auch der englische Leuchtenhersteller Thorn und der Dornbirner Komponentenhersteller Tridonic. Weltweit beschäftigt sie mehr als 7.400 Menschen mit rund 1,23 Milliarden Euro Jahresumsatz. Etwa 20% des Gesamtumsatzes werden mit Sonderprojekten generiert. Zumtobel investiert 2012 rund 20 Millionen Euro in den Standort Dornbirn."}],"id":"E225"},{"year":2012,"year_end":null,"date_precision":"year","title":"Zumtobel-Lichtlösung Rookery Building Chicago gewinnt WAN Award","summary":"Das Rookery Gebäude in Chicago wird 2012 mit dem World Architecture News Award für die beste Lichtlösung ausgezeichnet. Das historische Gebäude im Financial District von Chicago, der erste moderne Stahlbau, wurde von OVI (Office for Visual Interaction) gemeinsam mit Zumtobel beleuchtet. Umgesetzt mit der speziell entworfenen LED-Fassadenleuchte ROOK, die später als LED-Strahler ELEVO ins Standardprodukt-Portfolio überführt wurde. Ein Paradebeispiel, wie Sonderprojekte der Zumtobel Group in die Produktion einfließen.","people":[],"places":["Dornbirn","Chicago"],"category":"Wirtschaft","sources":["Hämmerle: Innovation"],"page_hints":["Hämmerle: Innovation S. 35-36"],"alt_titles":[],"source_summaries":[{"book":"Hämmerle: Innovation","title":"Zumtobel-Lichtlösung Rookery Building Chicago gewinnt WAN Award","summary":"Das Rookery Gebäude in Chicago wird 2012 mit dem World Architecture News Award für die beste Lichtlösung ausgezeichnet. Das historische Gebäude im Financial District von Chicago, der erste moderne Stahlbau, wurde von OVI (Office for Visual Interaction) gemeinsam mit Zumtobel beleuchtet. Umgesetzt mit der speziell entworfenen LED-Fassadenleuchte ROOK, die später als LED-Strahler ELEVO ins Standardprodukt-Portfolio überführt wurde. Ein Paradebeispiel, wie Sonderprojekte der Zumtobel Group in die Produktion einfließen."}],"id":"E226"},{"year":2012,"year_end":null,"date_precision":"year","title":"Zumtobel sanierte Beleuchtung im Technischen Museum Wien","summary":"Das Technische Museum Wien, einziges Bundesmuseum Österreichs für Geschichte der Technik und Naturwissenschaften, erhält unter dem Namen 'Licht & Klima' eine neue Beleuchtungslösung von Zumtobel. Die Anschlussleistung wurde um 70 Prozent reduziert. Die Kombination aus direkter und indirekter Beleuchtung verbessert die Lichtqualität. Insgesamt 1.400 Arcos-Strahler auf drei Etagen sind im Einsatz. Der geringere Wärmeeintrag verbessert besonders im Sommer die Klimaverhältnisse.","people":[],"places":["Dornbirn","Wien"],"category":"Wirtschaft","sources":["Hämmerle: Innovation"],"page_hints":["Hämmerle: Innovation S. 38-39"],"alt_titles":[],"source_summaries":[{"book":"Hämmerle: Innovation","title":"Zumtobel sanierte Beleuchtung im Technischen Museum Wien","summary":"Das Technische Museum Wien, einziges Bundesmuseum Österreichs für Geschichte der Technik und Naturwissenschaften, erhält unter dem Namen 'Licht & Klima' eine neue Beleuchtungslösung von Zumtobel. Die Anschlussleistung wurde um 70 Prozent reduziert. Die Kombination aus direkter und indirekter Beleuchtung verbessert die Lichtqualität. Insgesamt 1.400 Arcos-Strahler auf drei Etagen sind im Einsatz. Der geringere Wärmeeintrag verbessert besonders im Sommer die Klimaverhältnisse."}],"id":"E227"}]}</script>
  <script>
    (function () {
      const tlEl0 = document.getElementById("timeline");
      const dataEl = document.getElementById("events-data");
      const rawLen = dataEl ? (dataEl.textContent || "").length : -1;
      let parseErr = null;
      try {
        window.EVENTS_DATA = JSON.parse(dataEl.textContent);
      } catch (err) {
        parseErr = err && err.message ? err.message : String(err);
        window.EVENTS_DATA = null;
      }
      const DATA = window.EVENTS_DATA;
      if (!DATA) {
        tlEl0.innerHTML =
          '<div class="empty" style="text-align:left;font-family:monospace;font-size:12px;white-space:pre-wrap;padding:20px">' +
          'DEBUG (build v3)\n' +
          'dataEl gefunden: ' + (dataEl ? 'ja' : 'nein') + '\n' +
          'textContent.length: ' + rawLen + '\n' +
          'parse error: ' + (parseErr || '(keiner)') + '\n\n' +
          'erste 300 Zeichen:\n' + (dataEl ? (dataEl.textContent || '').slice(0,300) : '') +
          '</div>';
        return;
      }

      const EVENTS = DATA.events.slice();
      const state = {
        q: "",
        categories: new Set(),
        decades: new Set(),
      };

      // -------- Helpers --------
      function decade(year) { return Math.floor(year / 10) * 10; }
      function decadeLabel(d) { return d + "er"; }
      function norm(s) { return (s || "").toLowerCase(); }

      function matchesSearch(e, q) {
        if (!q) return true;
        const hay = [
          e.title,
          (e.alt_titles || []).join(" "),
          ...(e.source_summaries || []).map(s => s.summary || ""),
          (e.people || []).join(" "),
          (e.places || []).join(" "),
          (e.sources || []).join(" "),
          e.category,
          String(e.year),
        ].join(" ").toLowerCase();
        return q.split(/\s+/).filter(Boolean).every(t => hay.includes(t));
      }

      function filtered() {
        const q = norm(state.q);
        return EVENTS.filter(e => {
          if (state.categories.size && !state.categories.has(e.category)) return false;
          if (state.decades.size && !state.decades.has(decade(e.year))) return false;
          if (!matchesSearch(e, q)) return false;
          return true;
        });
      }

      // -------- Filter bars --------
      function buildFilterBar(containerId, items, stateSet, labelText) {
        const bar = document.getElementById(containerId);
        bar.innerHTML = "";
        const label = document.createElement("span");
        label.className = "filter-label";
        label.textContent = labelText;
        bar.appendChild(label);

        const resetBtn = document.createElement("button");
        resetBtn.className = "chip reset";
        resetBtn.textContent = "alle";
        resetBtn.addEventListener("click", () => {
          stateSet.clear();
          updateChipsState();
          render();
        });
        bar.appendChild(resetBtn);

        items.forEach(({ value, label: t, count }) => {
          const b = document.createElement("button");
          b.className = "chip";
          b.dataset.value = String(value);
          b.setAttribute("aria-pressed", "false");
          b.textContent = t + (count != null ? " (" + count + ")" : "");
          b.addEventListener("click", () => {
            if (stateSet.has(value)) stateSet.delete(value);
            else stateSet.add(value);
            updateChipsState();
            render();
          });
          bar.appendChild(b);
        });
      }

      function updateChipsState() {
        document.querySelectorAll("#filter-categories .chip, #filter-decades .chip").forEach(c => {
          if (!c.dataset.value) return;
          const v = c.dataset.value;
          const isCat = c.parentElement.id === "filter-categories";
          const set = isCat ? state.categories : state.decades;
          const present = isCat ? set.has(v) : set.has(parseInt(v, 10));
          c.setAttribute("aria-pressed", present ? "true" : "false");
        });
      }

      // -------- Render timeline --------
      const tlEl = document.getElementById("timeline");
      const statsEl = document.getElementById("stats");

      function escapeHtml(s) {
        return String(s || "").replace(/[&<>"']/g, c => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
        }[c]));
      }

      function renderEvent(e) {
        const summaries = (e.source_summaries || []).map(s => `
          <div class="event-summary">
            <span class="src-label">${escapeHtml(s.book)}</span>
            ${escapeHtml(s.summary)}
          </div>
        `).join("");

        const personTags = (e.people || []).map(p =>
          `<span class="tag person">${escapeHtml(p)}</span>`
        ).join("");
        const placeTags = (e.places || []).map(p =>
          `<span class="tag place">${escapeHtml(p)}</span>`
        ).join("");

        const sourcesLine = (e.page_hints || []).join(" · ");
        const yearLabel = e.year_end && e.year_end !== e.year
          ? `${e.year}–${e.year_end}`
          : (e.date_precision === "decade" ? `${decade(e.year)}er` : String(e.year));

        return `
          <article class="event" data-id="${escapeHtml(e.id)}">
            <div class="event-head">
              <div class="event-year">${escapeHtml(yearLabel)}</div>
              <div class="event-title">${escapeHtml(e.title)}</div>
              <div class="event-cat">${escapeHtml(e.category || "")}</div>
            </div>
            <div class="event-body">
              ${summaries}
              ${(personTags || placeTags) ? `<div class="tags">${personTags}${placeTags}</div>` : ""}
              ${sourcesLine ? `<div class="sources-list"><span class="label">Quellen</span>${escapeHtml(sourcesLine)}</div>` : ""}
            </div>
          </article>
        `;
      }

      function render() {
        const list = filtered();
        statsEl.textContent = `${list.length} Ereignis${list.length === 1 ? "" : "se"}`
          + (list.length !== EVENTS.length ? ` (von ${EVENTS.length})` : "");

        if (!list.length) {
          tlEl.innerHTML = '<div class="empty">Keine Ereignisse für diesen Filter.</div>';
          return;
        }

        let html = "";
        let currentDecade = null;
        for (const e of list) {
          const d = decade(e.year);
          if (d !== currentDecade) {
            currentDecade = d;
            html += `<div class="decade-header">${decadeLabel(d)}</div>`;
          }
          html += renderEvent(e);
        }
        tlEl.innerHTML = html;
      }

      // -------- Build filter values --------
      const catCounts = {};
      const decCounts = {};
      EVENTS.forEach(e => {
        catCounts[e.category] = (catCounts[e.category] || 0) + 1;
        const d = decade(e.year);
        decCounts[d] = (decCounts[d] || 0) + 1;
      });

      const catList = Object.entries(catCounts)
        .sort((a, b) => b[1] - a[1])
        .map(([value, count]) => ({ value, label: value, count }));

      const decList = Object.keys(decCounts)
        .map(d => parseInt(d, 10))
        .sort((a, b) => a - b)
        .map(d => ({ value: d, label: decadeLabel(d), count: decCounts[d] }));

      buildFilterBar("filter-categories", catList, state.categories, "Kategorie");
      buildFilterBar("filter-decades", decList, state.decades, "Jahrzehnt");

      // -------- Search --------
      let searchTimer = null;
      document.getElementById("search").addEventListener("input", (ev) => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
          state.q = ev.target.value;
          render();
        }, 120);
      });

      // -------- Tap to expand (event delegation) --------
      tlEl.addEventListener("click", (ev) => {
        const card = ev.target.closest(".event");
        if (!card) return;
        card.classList.toggle("open");
      });

      render();
    })();
  </script>
</body>
